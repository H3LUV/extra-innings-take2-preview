plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('FRIDGE_CHEF_UPLOAD_KEYSTORE')
def releaseStorePassword = System.getenv('FRIDGE_CHEF_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('FRIDGE_CHEF_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FRIDGE_CHEF_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.h3luv.fridgechef'
    compileSdk 36

    defaultConfig {
        applicationId 'com.h3luv.fridgechef'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
