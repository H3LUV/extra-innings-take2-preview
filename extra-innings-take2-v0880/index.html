<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.8</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0870/?v=0880"></iframe>
<div id="patch-status">선택지 1인칭 교정 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<28;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function firstPersonChoice(text){
    if(typeof text!=='string') return text;
    return text
      .replace(/네 인생은 네가 결정/g,'내 인생은 내가 결정')
      .replace(/네 인생은 네가 선택/g,'내 인생은 내가 선택')
      .replace(/네 미래는 네가 결정/g,'내 미래는 내가 결정')
      .replace(/네 미래는 네가 선택/g,'내 미래는 내가 선택')
      .replace(/네 길은 네가 결정/g,'내 길은 내가 결정')
      .replace(/네 길은 네가 선택/g,'내 길은 내가 선택')
      .replace(/네 꿈은 네가/g,'내 꿈은 내가')
      .replace(/네 야구는 네가/g,'내 야구는 내가')
      .replace(/네 선택대로/g,'내 선택대로')
      .replace(/네 결정을/g,'내 결정을')
      .replace(/네 꿈을 지키/g,'내 꿈을 지키')
      .replace(/네 미래를 위해/g,'내 미래를 위해')
      .replace(/네 인생/g,'내 인생')
      .replace(/네 미래/g,'내 미래')
      .replace(/네 꿈/g,'내 꿈')
      .replace(/네 야구/g,'내 야구')
      .replace(/네 경기/g,'내 경기')
      .replace(/네 몸/g,'내 몸')
      .replace(/네 성적/g,'내 성적')
      .replace(/네 이름/g,'내 이름')
      .replace(/네 선택/g,'내 선택')
      .replace(/네 마음/g,'내 마음')
      .replace(/네가 결정하겠/g,'내가 결정하겠')
      .replace(/네가 선택하겠/g,'내가 선택하겠')
      .replace(/네가 책임지겠/g,'내가 책임지겠')
      .replace(/너는 다짐한다/g,'나는 다짐한다')
      .replace(/너는 결심한다/g,'나는 결심한다')
      .replace(/주인공은/g,'나는')
      .replace(/주인공이/g,'내가')
      .replace(/\s+/g,' ')
      .trim();
  }

  function patchChoice(choice){
    if(!choice) return;
    if(Array.isArray(choice)){
      if(typeof choice[0]==='string') choice[0]=firstPersonChoice(choice[0]);
      return;
    }
    if(typeof choice.text==='string') choice.text=firstPersonChoice(choice.text);
  }

  function patchEvent(ev){
    if(!ev||typeof ev!=='object'||!Array.isArray(ev.choices)) return;
    ev.choices.forEach(patchChoice);
  }

  function patchCollections(w){
    const GD=w.GameData||{};
    Object.keys(GD).forEach(key=>{
      const value=GD[key];
      if(Array.isArray(value)&&/(EVENT|ENDING|OUTCOME|STORY|SCENE|EPISODE|MEMORY)/i.test(key)) value.forEach(patchEvent);
      else if(value&&typeof value==='object'&&/(ENDING|OUTCOME|STORY|SCENE)/i.test(key)) Object.values(value).forEach(patchEvent);
    });
    if(Array.isArray(w.EXTRA_INNINGS_V080_EVENTS)) w.EXTRA_INNINGS_V080_EVENTS.forEach(patchEvent);
  }

  function patchVisible(root){
    if(!root||root.nodeType!==1) return;
    const nodes=[];
    if(root.matches&&root.matches('.choice-btn')) nodes.push(root);
    if(root.querySelectorAll) nodes.push(...root.querySelectorAll('.choice-btn'));
    nodes.forEach(el=>{
      const before=el.textContent;
      const after=firstPersonChoice(before);
      if(after!==before) el.textContent=after;
    });
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.document||!w.document.body||!w.GameData) return false;
    if(w.__EXTRA_INNINGS_V088_PATCHED__) return true;
    w.__EXTRA_INNINGS_V088_PATCHED__=true;

    patchCollections(w);
    patchVisible(w.document.body);

    const observer=new w.MutationObserver(ms=>ms.forEach(m=>m.addedNodes&&m.addedNodes.forEach(patchVisible)));
    observer.observe(w.document.body,{childList:true,subtree:true});

    w.document.title='EXTRA INNINGS TAKE 2 v0.8.8';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.8.8 적용 완료';
      setTimeout(()=>status.style.opacity='0',1000);
      return;
    }
    if(attempts<580) setTimeout(tick,100);
    else status.textContent='선택지 교정 적용 실패';
  }

  rootFrame.addEventListener('load',()=>setTimeout(tick,220));
  setTimeout(tick,500);
})();
</script>
</body>
</html>
