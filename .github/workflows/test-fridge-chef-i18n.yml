name: Test Fridge Chef Languages

on:
  workflow_dispatch:
  push:
    branches: [main, fix/fridge-complete-english-20260930]
    paths:
      - 'fridge-chef/**'
      - '.github/workflows/test-fridge-chef-i18n.yml'

permissions:
  contents: read

concurrency:
  group: fridge-language-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check fridge-chef/app-i18n-complete.js
          node --check fridge-chef/api/translate-text.js
      - name: Install test browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test actual app screens, language persistence and saved recipes
        env:
          TEST_OUTPUT: ${{ runner.temp }}/fridge-i18n-tests
        run: python fridge-chef/tests/test_complete_i18n.py
      - name: Check deployed translation API once on this release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[translation-smoke]')
        env:
          TEST_OUTPUT: ${{ runner.temp }}/fridge-i18n-tests
        run: |
          python - <<'PY'
          import json, os, re, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          base = 'https://fridge-chef-ai-tan.vercel.app'
          for attempt in range(18):
              try:
                  with urlopen(base+'/app.js?smoke='+str(time.time_ns()), timeout=10) as response:
                      script = response.read().decode()
                  if '20260930-ko-en-complete-v5' in script: break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise RuntimeError('The new frontend has not reached the production domain.')
          source = '냄비에 김치 200g과 물 400ml를 넣고 중불에서 5분 끓이세요.'
          request = Request(base+'/api/translate-text', data=json.dumps({'language':'en','texts':[source]},ensure_ascii=False).encode(), headers={'Content-Type':'application/json','Origin':base}, method='POST')
          started = time.monotonic()
          with urlopen(request,timeout=40) as response:
              data=json.load(response)
          result=data['translations'][0]
          assert not re.search(r'[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]',result), result
          assert re.findall(r'\d+(?:[.,]\d+)?',result)==['200','400','5'], result
          report={'passed':True,'type':'live-production-translation','english':result,'elapsedSeconds':round(time.monotonic()-started,2)}
          Path(os.environ['TEST_OUTPUT'],'live-translation.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fridge-language-tests
          path: ${{ runner.temp }}/fridge-i18n-tests
          retention-days: 7
