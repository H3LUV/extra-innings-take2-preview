name: Index v0.7.0 source

on:
  push:
    paths:
      - '.github/workflows/index-v0700-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build keyword index
        shell: python
        run: |
          from pathlib import Path
          src = Path('extra-innings-take2-v0700/source.html')
          lines = src.read_text(encoding='utf-8').splitlines()
          keywords = [
            'DAY_PARTS','dayPart','timeSlot','advanceTime','advanceDay','skipTo',
            '시간 넘기기','다음 경기','자동진행','자동 진행','autoPlay','simulateGame',
            'gameResult','personalStats','개인성적','경기 결과'
          ]
          hits = []
          seen = set()
          for i, line in enumerate(lines):
              if any(k in line for k in keywords):
                  start = max(0, i - 5)
                  end = min(len(lines), i + 12)
                  key = (start, end)
                  if key in seen:
                      continue
                  seen.add(key)
                  hits.append(f'===== lines {start+1}-{end} =====')
                  hits.extend(f'{n+1:05d}: {lines[n]}' for n in range(start, end))
          out = '\n'.join(hits)
          Path('extra-innings-take2-v0700/source-index.txt').write_text(out, encoding='utf-8')
          print(f'{len(hits)} indexed lines')
      - name: Commit index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extra-innings-take2-v0700/source-index.txt
          git diff --cached --quiet && exit 0
          git commit -m "Index v0.7.0 gameplay source"
          git push
