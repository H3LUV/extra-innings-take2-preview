name: Index v0.7.0 source

on:
  push:
    paths:
      - '.github/workflows/index-v0700-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build focused indexes
        shell: python
        run: |
          from pathlib import Path
          src = Path('extra-innings-take2-v0700/source.html')
          lines = src.read_text(encoding='utf-8').splitlines()

          groups = {
            'time-index.txt': [
              'GameData.DAY_PARTS', 'p.date.part', 'date.part', 'UI.passTime',
              'advanceDay', 'advanceTime', 'nextDay', '시간 넘기기', '다음 경기'
            ],
            'game-index.txt': [
              '자동진행', '자동 진행', 'autoPlay', 'autoResolve', 'simulateGame',
              'gameResult', 'matchResult', '개인성적', 'boxScore', 'playerStats',
              '경기 결과', 'startGame', 'showGame'
            ],
          }

          for filename, keywords in groups.items():
              blocks = []
              seen = set()
              for i, line in enumerate(lines):
                  if any(k in line for k in keywords):
                      start = max(0, i - 14)
                      end = min(len(lines), i + 36)
                      key = (start, end)
                      if key in seen:
                          continue
                      seen.add(key)
                      blocks.append(f'===== lines {start+1}-{end} =====')
                      blocks.extend(f'{n+1:05d}: {lines[n]}' for n in range(start, end))
              Path('extra-innings-take2-v0700', filename).write_text('\n'.join(blocks), encoding='utf-8')
              print(filename, len(blocks))
      - name: Commit indexes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extra-innings-take2-v0700/time-index.txt extra-innings-take2-v0700/game-index.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh v0.7.0 gameplay indexes"
          git push
