name: Extract v0.7.0 source

on:
  push:
    paths:
      - '.github/workflows/extract-v0700.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source HTML
        shell: python
        run: |
          import base64, gzip, pathlib
          root = pathlib.Path('extra-innings-take2-v0700')
          names = [
              'chunk00.txt','chunk01.txt',
              'chunk02a.txt','chunk02b.txt','chunk02c.txt','chunk02d.txt','chunk02e.txt',
              'chunk03a.txt','chunk03b.txt','chunk03c.txt','chunk03d.txt','chunk03e.txt',
              'chunk04.txt',
              'chunk05a.txt','chunk05b.txt','chunk05c.txt',
              'chunk05d0.txt','chunk05d1.txt','chunk05d2.txt',
              'chunk05e0.txt','chunk05e1.txt','chunk05e2.txt',
              'chunk06.txt','chunk07.txt'
          ]
          payload = bytearray()
          for name in names:
              text = ''.join((root / name).read_text(encoding='utf-8').split())
              payload.extend(base64.b64decode(text, validate=True))
          html = gzip.decompress(bytes(payload))
          (root / 'source.html').write_bytes(html)
          print(f'Wrote {len(html):,} bytes to {root / "source.html"}')
      - name: Commit extracted source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extra-innings-take2-v0700/source.html
          git diff --cached --quiet && exit 0
          git commit -m "Extract v0.7.0 source HTML"
          git push
