# Today MLB clean full-article translation pipeline v7 - force recovery deploy
name: Select four Today MLB reading items

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/today-mlb-reading.yml
  schedule:
    # 22:15 UTC = 07:15 Asia/Seoul
    - cron: '15 22 * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: today-mlb-reading
  cancel-in-progress: true

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: today-mlb-cloudflare
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Archive current editorial by slug
        run: node scripts/archive-editorial.mjs

      - name: Build four clean Korean full-article translations
        run: node scripts/run-mlb-reading.mjs

      - name: Commit reading list, translations, and editorial archive
        run: |
          git config user.name "today-mlb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/news.json public/data/articles public/data/editorials
          if git diff --cached --quiet; then
            echo "No reading or archive changes"
          else
            git commit -m "Publish clean Korean full-text MLB readings"
            git push origin HEAD:today-mlb-cloudflare
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 135ede9cb7c0a586c4facd63f5810921
          command: pages deploy public --project-name=today-mlb --branch=today-mlb-cloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
