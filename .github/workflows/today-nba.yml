# Column publish trigger 2026-08-04 20:00 KST
name: Update and deploy Today NBA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/today-nba.yml
  schedule:
    # Hourly refresh. News translations are reused until new articles appear.
    - cron: '17 * * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: today-nba-production
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Today NBA branch
        uses: actions/checkout@v4
        with:
          ref: today-nba-cloudflare
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Cloudflare API token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          raw = os.environ.get('RAW_CLOUDFLARE_API_TOKEN', '')
          clean = raw.lstrip('\ufeff').strip()
          if not clean:
              raise SystemExit('CLOUDFLARE_API_TOKEN is empty after normalization')
          print(f'::add-mask::{clean}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'CLOUDFLARE_API_TOKEN={clean}\n')
          PY

      - name: Archive current column
        run: node scripts/archive-editorial.mjs

      - name: Refresh all NBA sections
        run: node scripts/update-nba-data.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "today-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/columns public/reading
          if git diff --cached --quiet; then
            echo "No NBA data changes"
          else
            git commit -m "Refresh all Today NBA data"
            git push origin HEAD:today-nba-cloudflare
          fi

      - name: Create Cloudflare Pages project when needed
        env:
          CLOUDFLARE_ACCOUNT_ID: 135ede9cb7c0a586c4facd63f5810921
        run: npx wrangler@4 pages project create today-nba --production-branch today-nba-cloudflare || true

      - name: Deploy Today NBA to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: 135ede9cb7c0a586c4facd63f5810921
        run: npx wrangler@4 pages deploy public --project-name today-nba --branch today-nba-cloudflare

      - name: Record successful deployment
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('public/data/deployment.json',JSON.stringify({project:'today-nba',branch:'today-nba-cloudflare',status:'success',deployedAt:new Date().toISOString()},null,2))"
          git add public/data/deployment.json
          git commit -m "Record Today NBA deployment" || true
          git push origin HEAD:today-nba-cloudflare

      - name: Publish deployment marker
        env:
          CLOUDFLARE_ACCOUNT_ID: 135ede9cb7c0a586c4facd63f5810921
        run: npx wrangler@4 pages deploy public --project-name today-nba --branch today-nba-cloudflare
