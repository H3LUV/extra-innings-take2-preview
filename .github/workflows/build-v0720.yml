name: Build v0.7.2 training and romance fixes

on:
  push:
    paths:
      - '.github/workflows/build-v0720.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.7.2
        shell: python
        run: |
          from pathlib import Path
          import re

          src_path = Path('extra-innings-take2-v0710/index.html')
          html = src_path.read_text(encoding='utf-8')
          html = html.replace('EXTRA INNINGS TAKE 2 v0.7.1', 'EXTRA INNINGS TAKE 2 v0.7.2')

          old_position_trainings = '''  // ---- 포지션별 ----
          { id: "catcher_lead", name: "포수 리드 훈련", group: "position", intensity: "low", energyCost: 8,
            growth: [["stats.physical.baseballIQ", 0.15, 0.3]], resource: { health: [0, 0], fatigue: [1, 3], injuryRisk: [0, 1] } },
          { id: "catcher_block", name: "포수 블로킹 훈련", group: "position", intensity: "medium", energyCost: 10,
            growth: [["stats.batting.catching", 0.2, 0.4]], resource: { health: [-1, 0], fatigue: [2, 5], injuryRisk: [1, 3] } },
          { id: "infield_tr", name: "내야 수비 훈련", group: "position", intensity: "medium", energyCost: 10,
            growth: [["stats.batting.range", 0.15, 0.35]], resource: { health: [-1, 0], fatigue: [2, 4], injuryRisk: [1, 2] } },
          { id: "outfield_tr", name: "외야 수비 훈련", group: "position", intensity: "medium", energyCost: 10,
            growth: [["stats.batting.range", 0.15, 0.35], ["stats.batting.speed", 0.05, 0.1]],
            resource: { health: [-1, 0], fatigue: [2, 4], injuryRisk: [1, 2] } },
          { id: "dp_tr", name: "병살 플레이 훈련", group: "position", intensity: "medium", energyCost: 8,
            growth: [["stats.batting.throwing", 0.15, 0.3]], resource: { health: [0, 0], fatigue: [2, 3], injuryRisk: [1, 2] } },
        ];'''
          new_position_trainings = '''  // ---- 포지션 숙련 훈련 ----
          // 별도의 '포수 능력치/외야 능력치'를 만들지 않는다. 기존 수비 능력치와 실제 포지션 숙련도를 함께 올린다.
          { id: "catcher_lead", name: "포수 리드·사인 훈련", group: "position", positions: ["C"], positionExp: [1.2, 1.8], intensity: "low", energyCost: 8,
            growth: [["stats.physical.baseballIQ", 0.15, 0.3], ["stats.batting.catching", 0.05, 0.12]], resource: { health: [0, 0], fatigue: [1, 3], injuryRisk: [0, 1] } },
          { id: "catcher_block", name: "포수 블로킹·포구 훈련", group: "position", positions: ["C"], positionExp: [1.3, 1.9], intensity: "medium", energyCost: 10,
            growth: [["stats.batting.catching", 0.2, 0.4], ["stats.batting.reaction", 0.08, 0.18]], resource: { health: [-1, 0], fatigue: [2, 5], injuryRisk: [1, 3] } },
          { id: "infield_tr", name: "내야 수비·풋워크 훈련", group: "position", positions: ["1B", "2B", "3B", "SS"], positionExp: [1.1, 1.7], intensity: "medium", energyCost: 10,
            growth: [["stats.batting.range", 0.15, 0.35], ["stats.batting.catching", 0.08, 0.18]], resource: { health: [-1, 0], fatigue: [2, 4], injuryRisk: [1, 2] } },
          { id: "outfield_tr", name: "외야 타구 판단·수비 훈련", group: "position", positions: ["LF", "CF", "RF"], positionExp: [1.1, 1.7], intensity: "medium", energyCost: 10,
            growth: [["stats.batting.range", 0.15, 0.35], ["stats.batting.reaction", 0.08, 0.18], ["stats.batting.speed", 0.05, 0.1]],
            resource: { health: [-1, 0], fatigue: [2, 4], injuryRisk: [1, 2] } },
          { id: "dp_tr", name: "병살 연결·송구 훈련", group: "position", positions: ["2B", "SS"], positionExp: [1.2, 1.8], intensity: "medium", energyCost: 8,
            growth: [["stats.batting.throwing", 0.15, 0.3], ["stats.batting.reaction", 0.05, 0.15]], resource: { health: [0, 0], fatigue: [2, 3], injuryRisk: [1, 2] } },
          { id: "sp_role_tr", name: "선발투수 루틴 훈련", group: "position", positions: ["SP"], positionExp: [1.1, 1.7], intensity: "medium", energyCost: 11,
            growth: [["stats.pitching.stamina", 0.15, 0.3], ["stats.pitching.recovery", 0.08, 0.18]], resource: { health: [-1, 0], fatigue: [3, 5], injuryRisk: [1, 2] } },
          { id: "rp_role_tr", name: "구원투수 연투 적응 훈련", group: "position", positions: ["RP"], positionExp: [1.1, 1.7], intensity: "medium", energyCost: 10,
            growth: [["stats.pitching.recovery", 0.15, 0.3], ["stats.pitching.control", 0.08, 0.18]], resource: { health: [-1, 0], fatigue: [2, 5], injuryRisk: [1, 2] } },
          { id: "cl_role_tr", name: "마무리투수 압박 상황 훈련", group: "position", positions: ["CL"], positionExp: [1.1, 1.7], intensity: "medium", energyCost: 10,
            growth: [["stats.pitching.crisis", 0.15, 0.3], ["stats.pitching.mental", 0.1, 0.2]], resource: { health: [0, 0], fatigue: [2, 4], injuryRisk: [1, 2] } },
        ];'''
          if old_position_trainings not in html:
              raise SystemExit('position training block not found')
          html = html.replace(old_position_trainings, new_position_trainings)

          old_map = '''GameData.TRAINING_POSITION_MAP = {
          catcher_lead: ["C"], catcher_block: ["C"],
          infield_tr: ["1B", "2B", "3B", "SS"], dp_tr: ["2B", "SS"],
          outfield_tr: ["LF", "CF", "RF"], throw_tr: ["C", "3B", "SS", "RF"],
          field_tr: ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"],
        };'''
          new_map = '''GameData.TRAINING_POSITION_MAP = {
          catcher_lead: ["C"], catcher_block: ["C"],
          infield_tr: ["1B", "2B", "3B", "SS"], dp_tr: ["2B", "SS"],
          outfield_tr: ["LF", "CF", "RF"], throw_tr: ["C", "3B", "SS", "RF"],
          field_tr: ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"],
          sp_role_tr: ["SP"], rp_role_tr: ["RP"], cl_role_tr: ["CL"],
        };'''
          if old_map not in html:
              raise SystemExit('training position map not found')
          html = html.replace(old_map, new_map)

          old_exp_func = '''GameData.positionExperienceGain = function (state, trainingId) {
          const p = state.player;
          const group = GameData.profileGroupForPosition(p.primaryPos);
          let mult = 1;
          mult *= GameData.PERSONALITY_EFFECTS[p.personality]?.positionExpMult || 1;
          mult *= GameData.TRAIT_EFFECTS[p.trait]?.positionExpMult || 1;
          const gains = [];
          const mapped = GameData.TRAINING_POSITION_MAP[trainingId] || [];
          if (group === "pitcher") {
            if (["velocity_tr", "control_tr", "breaking_tr", "stuff_tr", "form_tr", "pickoff_tr", "crisis_tr", "bullpen_tr", "lowerbody_tr"].includes(trainingId)) gains.push([p.primaryPos, 1 * mult]);
          } else {
            if (["contact_tr", "power_tr", "eye_tr", "vs_breaking_tr", "bunt_tr", "baserun_tr", "steal_tr"].includes(trainingId)) gains.push([p.primaryPos, 0.5 * mult]);
            if (mapped.includes(p.primaryPos)) gains.push([p.primaryPos, 1 * mult]);
            if (p.secondaryPos !== "NONE" && mapped.includes(p.secondaryPos)) gains.push([p.secondaryPos, 0.75 * mult]);
          }
          return gains;
        };'''
          new_exp_func = '''GameData.positionExperienceGain = function (state, trainingId) {
          const p = state.player;
          const group = GameData.profileGroupForPosition(p.primaryPos);
          const training = GameData.TRAININGS.find(t => t.id === trainingId);
          let mult = 1;
          mult *= GameData.PERSONALITY_EFFECTS[p.personality]?.positionExpMult || 1;
          mult *= GameData.TRAIT_EFFECTS[p.trait]?.positionExpMult || 1;
          const gains = [];
          const mapped = training?.positions || GameData.TRAINING_POSITION_MAP[trainingId] || [];
          const range = training?.positionExp || [0.8, 1.2];
          const focusedGain = (range[0] + Math.random() * (range[1] - range[0])) * mult;
          if (mapped.includes(p.primaryPos)) {
            gains.push([p.primaryPos, focusedGain]);
          } else if (group === "pitcher" && ["velocity_tr", "control_tr", "breaking_tr", "stuff_tr", "form_tr", "pickoff_tr", "crisis_tr", "bullpen_tr", "lowerbody_tr"].includes(trainingId)) {
            gains.push([p.primaryPos, 0.65 * mult]);
          } else if (group === "fielder" && ["contact_tr", "power_tr", "eye_tr", "vs_breaking_tr", "bunt_tr", "baserun_tr", "steal_tr"].includes(trainingId)) {
            gains.push([p.primaryPos, 0.35 * mult]);
          }
          if (group === "fielder" && p.secondaryPos !== "NONE" && mapped.includes(p.secondaryPos)) {
            gains.push([p.secondaryPos, focusedGain * 0.75]);
          }
          return gains;
        };'''
          if old_exp_func not in html:
              raise SystemExit('position experience function not found')
          html = html.replace(old_exp_func, new_exp_func)

          old_gain_log = '''    positionGains.forEach(([posId, gain]) => {
              p.positionExp[posId] = Math.round(GameData.CLAMP((p.positionExp[posId] || 0) + gain, 0, 100) * 100) / 100;
            });'''
          new_gain_log = '''    positionGains.forEach(([posId, gain]) => {
              const before = p.positionExp[posId] || 0;
              const after = Math.round(GameData.CLAMP(before + gain, 0, 100) * 100) / 100;
              p.positionExp[posId] = after;
              const actual = Math.round((after - before) * 100) / 100;
              if (actual > 0) {
                const posName = GameData.POSITIONS.find(pos => pos.id === posId)?.name || posId;
                growthLog.push(`[포지션 숙련] ${posName} +${actual}`);
              }
            });'''
          if old_gain_log not in html:
              raise SystemExit('position gain logging block not found')
          html = html.replace(old_gain_log, new_gain_log)

          old_training_ui = '''UI.showTrainingMenu = function () {
          const state = Game.state;
          const root = UI.clear();
          const groups = [["common", "공통 훈련"], ["batter", "타자 훈련"], ["pitcher", "투수 훈련"], ["position", "포지션별 훈련"]];
          const posGroup = GameData.POSITIONS.find(p => p.id === state.player.primaryPos)?.group;
          const content = [];
          groups.forEach(([g, label]) => {
            if (g === "batter" && posGroup === "pitcher") return;
            if (g === "pitcher" && posGroup === "fielder") return;
            const items = GameData.TRAININGS.filter(t => t.group === g);
            content.push(UI.el("div", { class: "group-label" }, label));
            content.push(UI.el("div", { class: "training-list" }, items.map(t =>
              UI.button(`${t.name} (에너지 -${t.energyCost}${t.intensity === "high" ? " · 고강도" : ""})`, () => UI.doTraining(t.id), "btn training-btn"))));
          });
          root.appendChild(UI.screen("훈련 선택", content, { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
          UI.appendNav(root, "train");
        };'''
          new_training_ui = '''UI.showTrainingMenu = function () {
          const state = Game.state;
          const root = UI.clear();
          const groups = [["common", "공통 훈련"], ["batter", "타자 훈련"], ["pitcher", "투수 훈련"], ["position", "포지션 숙련 훈련"]];
          const posGroup = GameData.POSITIONS.find(p => p.id === state.player.primaryPos)?.group;
          const activePositions = [state.player.primaryPos, state.player.secondaryPos].filter(id => id && id !== "NONE");
          const content = [];
          groups.forEach(([g, label]) => {
            if (g === "batter" && posGroup === "pitcher") return;
            if (g === "pitcher" && posGroup === "fielder") return;
            let items = GameData.TRAININGS.filter(t => t.group === g);
            if (g === "position") {
              items = items.filter(t => (t.positions || GameData.TRAINING_POSITION_MAP[t.id] || []).some(id => activePositions.includes(id)));
            }
            if (!items.length) return;
            content.push(UI.el("div", { class: "group-label" }, label));
            content.push(UI.el("div", { class: "training-list" }, items.map(t => {
              const targets = g === "position"
                ? (t.positions || GameData.TRAINING_POSITION_MAP[t.id] || []).filter(id => activePositions.includes(id)).map(id => GameData.POSITIONS.find(p => p.id === id)?.name || id).join("·")
                : "";
              const targetText = targets ? ` · ${targets} 숙련` : "";
              return UI.button(`${t.name}${targetText} (에너지 -${t.energyCost}${t.intensity === "high" ? " · 고강도" : ""})`, () => UI.doTraining(t.id), "btn training-btn");
            })));
          });
          root.appendChild(UI.screen("훈련 선택", content, { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
          UI.appendNav(root, "train");
        };'''
          if old_training_ui not in html:
              raise SystemExit('training UI block not found')
          html = html.replace(old_training_ui, new_training_ui)

          old_player_rows = '''  const posGroup = GameData.POSITIONS.find(x => x.id === p.primaryPos)?.group;

          const traitRows = p.traits.length === 0'''
          new_player_rows = '''  const posGroup = GameData.POSITIONS.find(x => x.id === p.primaryPos)?.group;
          const activePositionIds = [p.primaryPos, p.secondaryPos].filter(id => id && id !== "NONE");
          const positionRows = activePositionIds.map(id => UI.statBar(GameData.POSITIONS.find(x => x.id === id)?.name || id, p.positionExp?.[id] || 0, 100, "bar-growth"));

          const traitRows = p.traits.length === 0'''
          if old_player_rows not in html:
              raise SystemExit('player position rows anchor not found')
          html = html.replace(old_player_rows, new_player_rows)

          old_player_insert = '''      `자금: ${p.money}00만원`, UI.el("br"),
            ]),
            UI.el("div", { class: "group-label" }, "명성"),'''
          new_player_insert = '''      `자금: ${p.money}00만원`, UI.el("br"),
            ]),
            UI.el("div", { class: "group-label" }, "포지션 숙련도"),
            ...positionRows,
            UI.el("div", { class: "group-label" }, "명성"),'''
          if old_player_insert not in html:
              raise SystemExit('player info insertion anchor not found')
          html = html.replace(old_player_insert, new_player_insert)

          old_romance_sanitize = '''    GameData.ROMANCE_CHARS.forEach(c => {
              if (!state.romance[c.id]) { state.romance[c.id] = GameData.newRomance(); return; }
              const defaults = GameData.newRomance();
              Object.entries(defaults).forEach(([k, v]) => {
                if (state.romance[c.id][k] === undefined) state.romance[c.id][k] = v;
              });
            });'''
          new_romance_sanitize = '''    GameData.ROMANCE_CHARS.forEach(c => {
              const defaults = GameData.newRomance();
              if (!state.romance[c.id]) state.romance[c.id] = GameData.newRomance();
              Object.entries(defaults).forEach(([k, v]) => {
                if (state.romance[c.id][k] === undefined) state.romance[c.id][k] = v;
              });
              const relation = state.romance[c.id];
              const progressed = relation.stage !== defaults.stage || relation.affection > 0 || relation.trust > 0;
              if (progressed && !state.encounteredCharacters[c.id]) state.encounteredCharacters[c.id] = 1;
            });'''
          if old_romance_sanitize not in html:
              raise SystemExit('romance sanitize block not found')
          html = html.replace(old_romance_sanitize, new_romance_sanitize)

          old_event_resolve = '''          const result = Game.Events.resolveChoice(state, event, idx);
                  overlay.remove();'''
          new_event_resolve = '''          const result = Game.Events.resolveChoice(state, event, idx);
                  if (event.category === "romance") {
                    const character = GameData.ROMANCE_CHARS.find(c => event.id.startsWith(`ro_${c.id}_`));
                    if (character) Game.Meta.discoverCharacter(state, character.id, { level: 1, eventId: event.id, route: "romance" });
                  }
                  overlay.remove();'''
          if old_event_resolve not in html:
              raise SystemExit('event resolve anchor not found')
          html = html.replace(old_event_resolve, new_event_resolve)

          helper_anchor = '''UI.doActionCategory = function (category, fallbackMsg) {
          const state = Game.state;
          const ev = Game.Events.pickRandomEvent(state, category);'''
          helper_replacement = '''UI.knownRomanceCharacters = function (state) {
          return GameData.ROMANCE_CHARS.filter(c => (state.encounteredCharacters?.[c.id] || 0) > 0);
        };

        UI.pickRomanceIntroduction = function (state, chance = 0.2) {
          if (Math.random() >= chance) return null;
          const pool = Game.Events.eligible(state, "romance").filter(ev => {
            const character = GameData.ROMANCE_CHARS.find(c => ev.id === `ro_${c.id}_meet`);
            return character && !(state.encounteredCharacters?.[character.id] > 0);
          });
          return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
        };

        UI.doActionCategory = function (category, fallbackMsg) {
          const state = Game.state;
          const intro = UI.pickRomanceIntroduction(state, 0.28);
          const ev = intro || Game.Events.pickRandomEvent(state, category);'''
          if helper_anchor not in html:
              raise SystemExit('action category anchor not found')
          html = html.replace(helper_anchor, helper_replacement)

          old_training_event = '''    const roll = Math.random();
            const ev = roll < 0.55 ? Game.Events.pickRandomEvent(state, "training")
              : roll < 0.8 ? Game.Events.pickAmbientEvent(state)
              : null;'''
          new_training_event = '''    const intro = UI.pickRomanceIntroduction(state, 0.18);
            const roll = Math.random();
            const ev = intro || (roll < 0.55 ? Game.Events.pickRandomEvent(state, "training")
              : roll < 0.8 ? Game.Events.pickAmbientEvent(state)
              : null);'''
          if old_training_event not in html:
              raise SystemExit('training event block not found')
          html = html.replace(old_training_event, new_training_event)

          old_rest_event = '''    const ev = Math.random() < 0.2 ? Game.Events.pickAmbientEvent(state) : null;'''
          new_rest_event = '''    const intro = UI.pickRomanceIntroduction(state, 0.15);
            const ev = intro || (Math.random() < 0.2 ? Game.Events.pickAmbientEvent(state) : null);'''
          if old_rest_event not in html:
              raise SystemExit('rest event block not found')
          html = html.replace(old_rest_event, new_rest_event)

          old_romance_menu = '''UI.showRomanceMenu = function () {
          const state = Game.state;
          const root = UI.clear();
          const items = GameData.ROMANCE_CHARS.map(c => {
            const r = state.romance[c.id];
            return UI.el("div", { class: "romance-card" }, [
              UI.el("div", { class: "romance-name" }, `${c.name} · ${c.archetype}`),
              UI.el("div", { class: "romance-role" }, c.role),
              UI.el("div", { class: "romance-stage" }, `단계: ${GameData.ROMANCE_OUTCOMES[r.stage]?.name || r.stage}`),
              UI.button("만나러 가기", () => UI.doRomanceVisit(c.id), "btn btn-sm"),
            ]);
          });
          root.appendChild(UI.screen("연애·데이트", items, { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
          UI.appendNav(root, "relations");
        };'''
          new_romance_menu = '''UI.showRomanceMenu = function () {
          const state = Game.state;
          const root = UI.clear();
          const known = UI.knownRomanceCharacters(state);
          const items = known.length ? known.map(c => {
            const r = state.romance[c.id];
            return UI.el("div", { class: "romance-card" }, [
              UI.el("div", { class: "romance-name" }, `${c.name} · ${c.archetype}`),
              UI.el("div", { class: "romance-role" }, c.role),
              UI.el("div", { class: "romance-stage" }, `관계: ${GameData.ROMANCE_OUTCOMES[r.stage]?.name || r.stage}`),
              UI.button("만나러 가기", () => UI.doRomanceVisit(c.id), "btn btn-sm"),
            ]);
          }) : [UI.el("div", { class: "empty-msg" }, "아직 특별한 관계가 생긴 사람이 없다. 일상과 훈련 중 첫 만남 이벤트가 발생하면 이곳에 한 명씩 등록된다.")];
          root.appendChild(UI.screen("연애·데이트", items, { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
          UI.appendNav(root, "relations");
        };'''
          if old_romance_menu not in html:
              raise SystemExit('romance menu block not found')
          html = html.replace(old_romance_menu, new_romance_menu)

          old_visit = '''UI.doRomanceVisit = function (charId) {
          const state = Game.state;
          const pool = Game.Events.eligible(state, "romance").filter(ev => ev.id.includes(`ro_${charId}_`));'''
          new_visit = '''UI.doRomanceVisit = function (charId) {
          const state = Game.state;
          if (!(state.encounteredCharacters?.[charId] > 0)) {
            UI.toast("아직 만나지 않은 인물이다.");
            UI.showRomanceMenu();
            return;
          }
          const pool = Game.Events.eligible(state, "romance").filter(ev => ev.id.includes(`ro_${charId}_`) && ev.id !== `ro_${charId}_meet`);'''
          if old_visit not in html:
              raise SystemExit('romance visit block not found')
          html = html.replace(old_visit, new_visit)

          out = Path('extra-innings-take2-v0720')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')

          redirect = '''<!doctype html>
        <html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EXTRA INNINGS TAKE 2 v0.7.2</title><meta http-equiv="refresh" content="0; url=../extra-innings-take2-v0720/?v=0720"><script>location.replace('../extra-innings-take2-v0720/?v=0720');</script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1324;color:#fff;font-family:system-ui,sans-serif;text-align:center}a{color:#ffc04d}</style></head><body><p>EXTRA INNINGS TAKE 2 v0.7.2로 이동 중입니다.<br><a href="../extra-innings-take2-v0720/?v=0720">게임 열기</a></p></body></html>'''
          Path('extra-innings-take2/index.html').write_text(redirect, encoding='utf-8')

          checks = [
            '포지션 숙련 훈련', '[포지션 숙련]', 'UI.knownRomanceCharacters',
