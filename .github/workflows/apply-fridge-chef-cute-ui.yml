name: Apply Fridge Chef Cute UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-fridge-chef-cute-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild cute UI package
        run: |
          cat .github/cute-ui/chunk-*.txt > /tmp/fridge-chef-cute-ui.b64
          base64 -d /tmp/fridge-chef-cute-ui.b64 > /tmp/fridge-chef-cute-ui.zip
          unzip -o /tmp/fridge-chef-cute-ui.zip -d .

      - name: Wire assets and creative recipe names
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          styles = Path('fridge-chef/styles.css')
          text = styles.read_text(encoding='utf-8')
          import_line = "@import url('./styles-cute-theme.css?v=20260731-cute-ui-v1');"
          if import_line not in text:
              text = text.rstrip() + "\n" + import_line + "\n"
          styles.write_text(text, encoding='utf-8')

          app = Path('fridge-chef/app.js')
          text = app.read_text(encoding='utf-8')
          text = re.sub(r"const version = '[^']+';", "const version = '20260731-cute-ui-v1';", text, count=1)
          if "'./app-cute-upgrades.js'" not in text:
              old = "    './app-upgrades.js'\n"
              new = "    './app-upgrades.js',\n    './app-cute-upgrades.js'\n"
              if old not in text:
                  raise SystemExit('app-upgrades.js load entry not found')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          api = Path('fridge-chef/api/generate-recipe.js')
          text = api.read_text(encoding='utf-8')
          anchor = '1. 서로 다른 레시피를 정확히 3개 만드세요.'
          title_rules = (
              "\n   - title은 선택 재료명을 단순히 나열한 이름으로 만들지 마세요. "
              "'양파 계란 볶음밥', '연어 대파 크림구이'처럼 재료 목록이 그대로 제목이 되는 방식은 금지합니다."
              "\n   - title은 요리의 분위기와 조리법이 함께 떠오르는 창의적인 한국어 이름으로 12~28자 작성하세요. "
              "'바다의 낭만 크림 파스타', '불맛 벨벳 덮밥', '포근한 숲속 된장스튜'처럼 감성어와 요리 유형을 자연스럽게 조합하세요."
              "\n   - 세 레시피의 title은 같은 수식어, 같은 문장 구조, 같은 끝맺음을 반복하지 마세요."
          )
          if title_rules.strip() not in text:
              if anchor not in text:
                  raise SystemExit('creative title prompt anchor not found')
              text = text.replace(anchor, anchor + title_rules, 1)
          api.write_text(text, encoding='utf-8')

          shutil.rmtree('.github/cute-ui', ignore_errors=True)
          workflow = Path('.github/workflows/apply-fridge-chef-cute-ui.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify JavaScript syntax
        run: |
          node --check fridge-chef/app-cute-upgrades.js
          node --check fridge-chef/app.js
          node --check fridge-chef/api/generate-recipe.js

      - name: Commit cute app design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply cute fridge chef app design and creative recipes [skip ci]'
          git push
