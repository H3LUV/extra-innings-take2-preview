name: Fridge Chef language regression
on:
  pull_request:
    paths:
      - 'fridge-chef/**'
      - '.github/workflows/fridge-chef-language-qa.yml'
  push:
    branches: [main]
    paths:
      - 'fridge-chef/app-language.js'
      - 'fridge-chef/app-i18n.js'
      - 'fridge-chef/app.js'
      - 'fridge-chef/api/translate-text.js'
      - 'fridge-chef/tests/**'
      - '.github/workflows/fridge-chef-language-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fridge-language-${{ github.ref }}
  cancel-in-progress: true
jobs:
  language-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/fridge-language-qa playwright
          /tmp/fridge-language-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check syntax and bilingual user flows
        env:
          NODE_PATH: /tmp/fridge-language-qa/node_modules
        run: |
          node --check fridge-chef/app-language.js
          node --check fridge-chef/api/translate-text.js
          node fridge-chef/tests/language-regression.cjs
      - name: Save regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fridge-chef-language-qa
          path: |
            language-qa-result.json
            language-qa-*.png
          if-no-files-found: ignore
  live-translation:
    if: github.ref == 'refs/heads/main'
    needs: language-qa
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production deployment and one English translation
        run: node fridge-chef/tests/live-translation-smoke.cjs
      - name: Save production check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fridge-chef-language-live
          path: language-live-result.json
          if-no-files-found: ignore
