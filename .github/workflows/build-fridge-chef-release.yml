name: Build Fridge Chef Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fridge-chef-play-store-release
  cancel-in-progress: false

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FRIDGE_CHEF_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FRIDGE_CHEF_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FRIDGE_CHEF_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FRIDGE_CHEF_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Play Store signing secrets are missing.'
            echo 'Add all four FRIDGE_CHEF_UPLOAD_* repository secrets before running this workflow.'
            exit 1
          fi

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FRIDGE_CHEF_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/fridge-chef-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fridge-chef-signing/fridge-chef-upload.jks"
          chmod 600 "$RUNNER_TEMP/fridge-chef-signing/fridge-chef-upload.jks"

      - name: Build signed release AAB
        working-directory: fridge-chef-android
        shell: bash
        env:
          FRIDGE_CHEF_UPLOAD_KEYSTORE: ${{ runner.temp }}/fridge-chef-signing/fridge-chef-upload.jks
          FRIDGE_CHEF_UPLOAD_STORE_PASSWORD: ${{ secrets.FRIDGE_CHEF_UPLOAD_STORE_PASSWORD }}
          FRIDGE_CHEF_UPLOAD_KEY_ALIAS: ${{ secrets.FRIDGE_CHEF_UPLOAD_KEY_ALIAS }}
          FRIDGE_CHEF_UPLOAD_KEY_PASSWORD: ${{ secrets.FRIDGE_CHEF_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean bundleRelease 2>&1 | tee release-build.log

      - name: Verify signed bundle
        working-directory: fridge-chef-android
        shell: bash
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > release-signing-report.txt
          grep -q 'jar verified' release-signing-report.txt

      - name: Prepare Play Store artifact
        shell: bash
        run: |
          mkdir -p fridge-chef-android/dist-play
          cp fridge-chef-android/app/build/outputs/bundle/release/app-release.aab \
             fridge-chef-android/dist-play/fridge-chef-v1.0.0-release.aab
          cp fridge-chef-android/release-signing-report.txt fridge-chef-android/dist-play/
          cd fridge-chef-android/dist-play
          sha256sum fridge-chef-v1.0.0-release.aab > fridge-chef-v1.0.0-release.sha256

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: fridge-chef-play-store-aab
          path: fridge-chef-android/dist-play/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fridge-chef-release-build-log
          path: fridge-chef-android/release-build.log
          if-no-files-found: ignore
          retention-days: 30
