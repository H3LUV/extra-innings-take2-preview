name: Update Today MLB rebound players

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/today-mlb-midnight.yml
  schedule:
    # 15:05 UTC = 00:05 Asia/Seoul
    - cron: '5 15 * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: today-mlb-midnight
  cancel-in-progress: true

jobs:
  rebound:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: today-mlb-cloudflare
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update recent 14-day rebound players
        run: node scripts/update-rebound.mjs
      - name: Commit rebound list
        run: |
          git config user.name "today-mlb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/column.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update rebound players at midnight KST"
            git push origin HEAD:today-mlb-cloudflare
          fi
      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=today-mlb-cloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
