name: Fix v0.7.2 injected template

on:
  push:
    paths:
      - '.github/workflows/fix-v0720-template.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use cooked template literal
        shell: python
        run: |
          from pathlib import Path
          path = Path('extra-innings-take2-v0720/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'const patch=String.raw`<script>'
          new = 'const patch=`<script>'
          if old not in text:
              raise SystemExit('String.raw patch anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit template fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extra-innings-take2-v0720/index.html
          git commit -m "Fix v0.7.2 injected template literal"
          git push
