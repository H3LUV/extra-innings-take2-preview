name: Send Today MLB column to Kakao Open Chat

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 07:00 Asia/Seoul
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: today-mlb-kakao
  cancel-in-progress: true

jobs:
  send:
    if: ${{ vars.KAKAO_OPENCHAT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: today-mlb-cloudflare

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send latest column
        run: node scripts/send-kakao-openchat.mjs
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_OPENCHAT_DOMAIN_ID: ${{ secrets.KAKAO_OPENCHAT_DOMAIN_ID }}
          KAKAO_OPENCHAT_LINK_ID: ${{ secrets.KAKAO_OPENCHAT_LINK_ID }}
