name: Build Fridge Chef APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fridge-chef-android/**'
      - '.github/workflows/build-fridge-chef-apk.yml'

permissions:
  contents: write

concurrency:
  group: fridge-chef-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: fridge-chef-android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug 2>&1 | tee android-build.log

      - name: Add failure details to summary
        if: failure()
        shell: bash
        run: |
          echo '## Android build failure details' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f fridge-chef-android/android-build.log ]; then
            tail -n 160 fridge-chef-android/android-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The Gradle build log was not created. Check the failed setup step above.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fridge-chef-android-build-log
          path: fridge-chef-android/android-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare APK artifact
        run: |
          mkdir -p fridge-chef-android/dist
          cp fridge-chef-android/app/build/outputs/apk/debug/app-debug.apk \
             fridge-chef-android/dist/fridge-chef-v1.0.2-debug.apk
          cd fridge-chef-android/dist
          sha256sum fridge-chef-v1.0.2-debug.apk > fridge-chef-v1.0.2-debug.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fridge-chef-apk
          path: fridge-chef-android/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to repository
        run: |
          mkdir -p apk-builds
          rm -f apk-builds/fridge-chef-v*-debug.apk apk-builds/fridge-chef-v*-debug.sha256
          cp fridge-chef-android/dist/fridge-chef-v1.0.2-debug.apk apk-builds/
          cp fridge-chef-android/dist/fridge-chef-v1.0.2-debug.sha256 apk-builds/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk-builds
          if git diff --cached --quiet; then
            echo 'APK is unchanged.'
            exit 0
          fi
          git commit -m 'Publish Fridge Chef test APK 1.0.2 [skip ci]'
          git push
