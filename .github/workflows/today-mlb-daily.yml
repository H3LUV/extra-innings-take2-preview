# Today MLB daily edition
name: Update Today MLB edition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/today-mlb-daily.yml
  schedule:
    # 22:00 UTC = 07:00 Asia/Seoul
    - cron: '0 22 * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: today-mlb-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Cloudflare site branch
        uses: actions/checkout@v4
        with:
          ref: today-mlb-cloudflare
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve midnight rebound list
        run: cp public/data/column.json /tmp/rebound-column.json || true

      - name: Generate daily edition
        run: npm run build

      - name: Restore midnight rebound list
        run: |
          if [ -f /tmp/rebound-column.json ]; then
            cp /tmp/rebound-column.json public/data/column.json
          fi

      - name: Select four US reading items
        run: node scripts/augment-news.mjs

      - name: Refresh games and standings fallback
        run: node scripts/update-live-data.mjs

      - name: Commit generated data
        run: |
          git config user.name "today-mlb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update daily MLB edition"
            git push origin HEAD:today-mlb-cloudflare
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=today-mlb-cloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
