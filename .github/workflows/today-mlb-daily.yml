# Today MLB daily edition without duplicate reading translation
name: Update Today MLB edition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/today-mlb-daily.yml
  schedule:
    # 22:00 UTC = 07:00 Asia/Seoul
    - cron: '0 22 * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: today-mlb-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Cloudflare site branch
        uses: actions/checkout@v4
        with:
          ref: today-mlb-cloudflare
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh rebound players
        run: node scripts/update-rebound.mjs

      - name: Refresh games and standings fallback
        run: node scripts/update-live-data.mjs

      - name: Generate static article pages and SEO files
        run: node scripts/update-seo.mjs

      - name: Commit generated data and SEO assets
        run: |
          git config user.name "today-mlb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/columns public/sitemap.xml public/robots.txt public/rss.xml
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update daily MLB edition and SEO"
            git push origin HEAD:today-mlb-cloudflare
          fi

      - name: Deploy daily edition to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 135ede9cb7c0a586c4facd63f5810921
          command: pages deploy public --project-name=today-mlb --branch=today-mlb-cloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record successful deployment
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('public/data/deployment.json',JSON.stringify({project:'today-mlb',branch:'today-mlb-cloudflare',status:'success',deployedAt:new Date().toISOString()},null,2))"
          git add public/data/deployment.json
          git commit -m "Record Today MLB deployment" || true
          git push origin HEAD:today-mlb-cloudflare