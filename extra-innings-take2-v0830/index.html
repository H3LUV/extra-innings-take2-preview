<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0820/?v=0830"></iframe>
<div id="patch-status">대사와 서술 시점 정리 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<18;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function firstPerson(text){
    if(typeof text!=='string') return text;
    return text
      .replace(/주인공은/g,'나는')
      .replace(/주인공이/g,'내가')
      .replace(/주인공의/g,'나의')
      .replace(/주인공에게/g,'나에게')
      .replace(/주인공을/g,'나를')
      .replace(/네가/g,'내가')
      .replace(/너는/g,'나는')
      .replace(/너를/g,'나를')
      .replace(/너의/g,'나의')
      .replace(/너에게/g,'나에게')
      .replace(/네게/g,'내게')
      .replace(/그는(?=\s)/g,'나는')
      .replace(/그가(?=\s)/g,'내가')
      .replace(/그의(?=\s)/g,'나의');
  }

  function cleanSpacing(text){
    return text
      .replace(/\s+/g,' ')
      .replace(/\s+([,.!?])/g,'$1')
      .replace(/([.!?])\1+/g,'$1')
      .trim();
  }

  function splitSentences(text){
    return text.match(/[^.!?]+[.!?]?/g)?.map(s=>s.trim()).filter(Boolean)||[text];
  }

  function removeSystemySentences(sentences){
    const patterns=[
      /선택에 따라.*달라진다/,
      /앞으로의.*영향을.*준다/,
      /다음 기회.*차이를.*만들/,
      /관계의 온도는.*보이지 않/,
      /이 선택은.*기록된다/,
      /플레이어의 선택/,
      /시스템상/,
      /능력치/,
      /호감도/,
      /신뢰도/
    ];
    return sentences.filter(s=>!patterns.some(p=>p.test(s)));
  }

  function polishNarrative(text,kind){
    if(typeof text!=='string') return text;
    let out=cleanSpacing(firstPerson(text));
    let sentences=removeSystemySentences(splitSentences(out));
    if(!sentences.length) sentences=splitSentences(out).slice(0,1);
    const limit=kind==='result'||kind==='ending'?1:2;
    out=sentences.slice(0,limit).join(' ');
    return cleanSpacing(out);
  }

  function polishEvent(ev){
    if(!ev||typeof ev!=='object') return;
    if(typeof ev.desc==='string') ev.desc=polishNarrative(ev.desc,'desc');
    if(typeof ev.line==='string') ev.line=polishNarrative(ev.line,'ending');
    if(Array.isArray(ev.choices)){
      ev.choices.forEach(choice=>{
        if(choice&&typeof choice.result==='string') choice.result=polishNarrative(choice.result,'result');
      });
    }
  }

  function polishCollections(GD){
    ['EVENTS_GENERAL','EVENTS_ROMANCE','EVENTS_POST_HIGHSCHOOL'].forEach(key=>{
      if(Array.isArray(GD[key])) GD[key].forEach(polishEvent);
    });
    ['CAREER_ENDINGS','LIFE_TONES','POST_CAREER_PATHS'].forEach(key=>{
      if(Array.isArray(GD[key])) GD[key].forEach(polishEvent);
    });
    if(GD.ROMANCE_OUTCOMES&&typeof GD.ROMANCE_OUTCOMES==='object'){
      Object.values(GD.ROMANCE_OUTCOMES).forEach(polishEvent);
    }
  }

  function polishVisibleNode(node){
    if(!node||node.nodeType!==1) return;
    const selectors='.event-desc,.result-line,.ending-narrative,.intro-text,.story-text,.notice-line';
    const targets=[];
    if(node.matches&&node.matches(selectors)) targets.push(node);
    if(node.querySelectorAll) targets.push(...node.querySelectorAll(selectors));
    targets.forEach(el=>{
      if(el.dataset&&el.dataset.v083Polished==='1') return;
      const kind=el.matches('.result-line')?'result':el.matches('.ending-narrative')?'ending':'desc';
      el.textContent=polishNarrative(el.textContent,kind);
      if(el.dataset) el.dataset.v083Polished='1';
    });
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.document||!w.GameData) return false;
    if(w.__EXTRA_INNINGS_V083_PATCHED__) return true;
    w.__EXTRA_INNINGS_V083_PATCHED__=true;

    polishCollections(w.GameData);
    polishVisibleNode(w.document.body);

    const observer=new w.MutationObserver(mutations=>{
      mutations.forEach(m=>m.addedNodes&&m.addedNodes.forEach(n=>polishVisibleNode(n)));
    });
    observer.observe(w.document.body,{childList:true,subtree:true});

    w.document.title='EXTRA INNINGS TAKE 2 v0.8.3';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.8.3 적용 완료';
      setTimeout(()=>status.style.opacity='0',1100);
      return;
    }
    if(attempts<480) setTimeout(tick,100);
    else status.textContent='대사 정리 적용 실패';
  }
  rootFrame.addEventListener('load',()=>setTimeout(tick,220));
  setTimeout(tick,500);
})();
</script>
</body>
</html>
