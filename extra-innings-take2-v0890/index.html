<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.9</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}#game{display:block;width:100%;height:100%;border:0}#status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;padding:7px 12px;border-radius:16px;background:#10121ce8;color:#fff;font:12px system-ui;opacity:1;transition:.25s}
</style>
</head>
<body>
<iframe id="game" src="../extra-innings-take2-v0880/?v=0890"></iframe><div id="status">생활 메뉴 확장 적용 중</div>
<script>
(()=>{
 const frame=document.getElementById('game'),status=document.getElementById('status');let tries=0;
 const menus={
  '학교생활':['수업에 집중한다','동아리 활동을 한다','진로 상담을 받는다','학교에서 휴식한다'],
  '가족과의 시간':['가족과 식사한다','아버지와 대화한다','어머니와 외출한다','가족과 나들이를 간다'],
  '친구 만나기':['PC방에 간다','카페에서 이야기한다','영화를 본다','산책하거나 외출한다'],
  '팀 동료·감독':['감독과 대화한다','코치에게 지도를 받는다','동료와 시간을 보낸다','경쟁자와 이야기한다'],
  'SNS 확인':['게시물을 올린다','팬 반응을 확인한다','지인 게시물을 확인한다','SNS 활동을 쉰다']
 };
 function deepest(){try{let w=frame.contentWindow;for(let i=0;i<30;i++){const f=w?.document?.getElementById('game');if(!f?.contentWindow)break;w=f.contentWindow}return w}catch(e){return null}}
 function stateOf(w){return w?.UI?.state||w?.Game?.state||w?.gameState||w?.state||null}
 function adjust(w,group,choice){const s=stateOf(w);if(!s)return;const p=s.player||s;const lower=(k,d)=>{if(typeof p[k]==='number')p[k]=Math.max(0,p[k]+d)};if(group!=='팀 동료·감독')lower('gameSense',-1);if(group==='친구 만나기'){lower('morale',4);lower('stress',-4)}if(group==='가족과의 시간'){lower('morale',5);lower('stress',-3)}if(group==='학교생활'){lower('stress',choice.includes('휴식')?-3:0)}if(group==='SNS 확인'&&choice.includes('쉰다'))lower('stress',-3);s.lastLifeActivity={group,choice,day:p.totalDays||0}}
 function modal(w,title,items,onPick){const d=w.document;d.getElementById('v089-life-modal')?.remove();const ov=d.createElement('div');ov.id='v089-life-modal';ov.innerHTML=`<div class="v089-box"><div class="v089-head"><b>${title}</b><button class="v089-close">×</button></div><div class="v089-list">${items.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div></div>`;d.body.appendChild(ov);ov.querySelector('.v089-close').onclick=()=>ov.remove();ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=items[+b.dataset.i];ov.remove();onPick(x)})}
 function patch(){const w=deepest();if(!w?.document?.body)return false;if(w.__V089__)return true;w.__V089__=1;const d=w.document,st=d.createElement('style');st.textContent=`#v089-life-modal{position:fixed;inset:0;z-index:999999;background:#00102dcc;display:grid;place-items:center;padding:18px}.v089-box{width:min(92vw,420px);background:#f7f8f4;border:4px solid #0b3e8b;box-shadow:0 9px 0 #021843}.v089-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#05275f,#0c4fa4);color:#fff;font:900 22px system-ui}.v089-close{border:0;background:none;color:#fff;font-size:28px}.v089-list{display:grid;gap:10px;padding:14px}.v089-list button{min-height:58px;border:3px solid #0b3e8b;background:#fff;color:#071c45;font:900 16px system-ui;text-align:left;padding:12px 15px;box-shadow:0 5px 0 #03183e;touch-action:manipulation}.v089-list button:active{transform:translateY(3px);box-shadow:0 2px 0 #03183e}`;d.head.appendChild(st);
 d.addEventListener('click',e=>{const btn=e.target.closest('button,.btn,.action-btn,.menu-btn,[role="button"]');if(!btn||btn.closest('#v089-life-modal'))return;const text=(btn.textContent||'').replace(/\s+/g,' ').trim();const key=Object.keys(menus).find(k=>text===k||text.includes(k));if(!key)return;e.preventDefault();e.stopImmediatePropagation();const original=btn;modal(w,key,menus[key],choice=>{adjust(w,key,choice);original.dataset.v089pass='1';original.click();setTimeout(()=>delete original.dataset.v089pass,0)});},true);
 d.addEventListener('click',e=>{const b=e.target.closest('[data-v089pass="1"]');if(b)return},true);d.title='EXTRA INNINGS TAKE 2 v0.8.9';return true}
 function tick(){tries++;if(patch()){status.textContent='v0.8.9 적용 완료';setTimeout(()=>status.style.opacity='0',900)}else if(tries<600)setTimeout(tick,100);else status.textContent='생활 메뉴 적용 실패'}frame.addEventListener('load',()=>setTimeout(tick,250));setTimeout(tick,500)
})();
</script>
</body></html>
