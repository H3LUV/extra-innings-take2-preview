<script>
(()=>{
const frame=document.getElementById('game'),status=document.getElementById('status');
const specs={
 school:{title:'학교생활',aliases:['학교생활','학교'],items:['수업에 집중한다','동아리 활동을 한다','진로 상담을 받는다','학교에서 휴식한다']},
 family:{title:'가족과의 시간',aliases:['가족과의 시간','가족'],items:['가족과 식사한다','아버지와 대화한다','어머니와 외출한다','가족과 나들이를 간다']},
 friend:{title:'친구 만나기',aliases:['친구 만나기','친구'],items:['PC방에 간다','카페에서 이야기한다','영화를 본다','산책하거나 외출한다']},
 team:{title:'팀 동료·감독',aliases:['팀 동료·감독','팀 동료/감독','팀 동료','팀'],items:['감독과 대화한다','코치에게 지도를 받는다','동료와 시간을 보낸다','경쟁자와 이야기한다']},
 sns:{title:'SNS 확인',aliases:['SNS 확인','SNS'],items:['게시물을 올린다','팬 반응을 확인한다','지인 게시물을 확인한다','SNS 활동을 쉰다']}
};
const roleRules={
 '감독과 대화한다':['감독','출전','선발','보직','기용','면담'],
 '코치에게 지도를 받는다':['코치','지도','레슨','훈련','폼','기술'],
 '동료와 시간을 보낸다':['동료','팀메이트','선배','후배','주장','라커룸','팀워크'],
 '경쟁자와 이야기한다':['라이벌','경쟁자','주전 경쟁','포지션 경쟁','도발'],
 '가족과 식사한다':['가족','식사','저녁','밥상'],
 '아버지와 대화한다':['아버지','부친'],
 '어머니와 외출한다':['어머니','엄마','장보기','외출'],
 '가족과 나들이를 간다':['가족','나들이','여행','외출'],
 'PC방에 간다':['PC방','게임','친구'],
 '카페에서 이야기한다':['카페','대화','고민','친구'],
 '영화를 본다':['영화','극장','친구'],
 '산책하거나 외출한다':['산책','외출','친구','거리'],
 '수업에 집중한다':['수업','교실','시험','공부','성적'],
 '동아리 활동을 한다':['동아리','축제','학교 행사'],
 '진로 상담을 받는다':['진로','상담','담임','선생님'],
 '학교에서 휴식한다':['학교','옥상','휴식','교실'],
 '게시물을 올린다':['SNS','게시물','업로드','사진','팔로워'],
 '팬 반응을 확인한다':['팬','댓글','반응','SNS'],
 '지인 게시물을 확인한다':['지인','게시물','SNS','친구'],
 'SNS 활동을 쉰다':['SNS','휴식','휴대폰']
};
function deepest(){try{let w=frame.contentWindow;for(let i=0;i<40;i++){const f=w?.document?.getElementById('game');if(!f?.contentWindow)break;w=f.contentWindow}return w}catch(e){return null}}
function stateOf(w){return w?.Game?.state||w?.UI?.state||w?.gameState||w?.state||null}
function identify(text){const t=(text||'').replace(/\s+/g,' ').trim();for(const [k,s] of Object.entries(specs)){if(s.aliases.some(a=>t===a||t.startsWith(a+' ')||t.endsWith(' '+a)))return[k,s]}return null}
function injectStyle(w){if(w.document.getElementById('v093-style'))return;const s=w.document.createElement('style');s.id='v093-style';s.textContent=`
#v093-modal{position:fixed;inset:0;z-index:999999;background:#00102dcc;display:grid;place-items:center;padding:18px;font-family:'Noto Sans KR',system-ui,sans-serif}
#v093-modal .box{width:min(92vw,430px);background:#f7f8f4;border:4px solid #0b3e8b;box-shadow:0 9px 0 #021843;color:#071c45}
#v093-modal .head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#05275f,#0c4fa4);color:#fff}
#v093-modal .head b{font-size:22px;font-weight:900}#v093-modal .close{border:0;background:none;color:#fff;font-size:28px}
#v093-modal .list{display:grid;gap:10px;padding:14px}#v093-modal .list button{min-height:62px;border:3px solid #0b3e8b;background:linear-gradient(165deg,#fff 0 72%,#eaf3ff 72%);color:#071c45;font:900 16px system-ui;text-align:left;padding:12px 15px;box-shadow:0 5px 0 #03183e}
#v093-modal .list button:active{transform:translateY(3px);box-shadow:0 2px 0 #03183e}
.overlay .event-box,.overlay .result-box{background:#f7f8f4!important;border:4px solid #0b3e8b!important;color:#071c45!important;box-shadow:0 9px 0 #021843!important;border-radius:0!important}
.overlay .event-title,.overlay .result-title{color:#05275f!important;font-size:24px!important;font-weight:900!important}.overlay .event-desc{color:#354766!important;line-height:1.65!important}.overlay .choice-btn{background:linear-gradient(165deg,#fff 0 72%,#eaf3ff 72%)!important;color:#071c45!important;border:3px solid #0b3e8b!important;border-radius:0!important;box-shadow:0 4px 0 #03183e!important;font-weight:900!important}.overlay .result-line{background:#eaf3ff!important;color:#071c45!important;border:2px solid #0b3e8b!important;border-radius:0!important}
`;w.document.head.appendChild(s)}
function showMenu(w,key,spec,original){const d=w.document;d.getElementById('v093-modal')?.remove();const m=d.createElement('div');m.id='v093-modal';m.innerHTML=`<div class="box"><div class="head"><b>${spec.title}</b><button class="close">×</button></div><div class="list">${spec.items.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div></div>`;d.body.appendChild(m);m.querySelector('.close').onclick=()=>m.remove();m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const choice=spec.items[+b.dataset.i];const st=stateOf(w);if(st){st.pendingLifeActivity={choice,day:st.player?.totalDays||0};st.lastLifeActivity={group:key,choice,day:st.player?.totalDays||0};const p=st.player||st;if(key!=='team'&&p.condition&&typeof p.condition.gameSense==='number')p.condition.gameSense=Math.max(0,p.condition.gameSense-1)}m.remove();original.dataset.v093pass='1';original.click()})}
function installFilter(w){const E=w?.Game?.Events;if(!E||typeof E.eligible!=='function'||E.__V093__)return;E.__V093__=1;const orig=E.eligible.bind(E);E.eligible=function(state,category,filterFn){const base=orig(state,category,filterFn),choice=state?.pendingLifeActivity?.choice;if(!choice||!roleRules[choice])return base;const words=roleRules[choice];const relevant=base.filter(ev=>{const t=[ev?.title,ev?.desc,ev?.line,ev?.characterId,ev?.role,ev?.targetRole].filter(Boolean).join(' ');return words.some(x=>t.includes(x))});return relevant.length?relevant:base};if(typeof E.resolveChoice==='function'){const r=E.resolveChoice.bind(E);E.resolveChoice=function(state,event,index){const out=r(state,event,index);if(state)delete state.pendingLifeActivity;return out}}}
function cloneHomeNav(w){const d=w.document,navs=[...d.querySelectorAll('.bottom-nav')];if(!navs.length)return;const visible=navs.find(n=>{const r=n.getBoundingClientRect();return r.width>0&&r.height>0})||navs[0];if(!w.__V093_NAV_TEMPLATE__)w.__V093_NAV_TEMPLATE__=visible.cloneNode(true);navs.forEach(n=>{if(n===visible)return;const c=w.__V093_NAV_TEMPLATE__.cloneNode(true);n.replaceWith(c)})}
function patch(w){if(!w?.document?.body)return false;injectStyle(w);installFilter(w);if(!w.__V093_CLICK__){w.__V093_CLICK__=1;const sel='button,.btn,.action-btn,.menu-btn,.hub-action,.action-card,.menu-card,[role="button"]';w.document.addEventListener('click',e=>{const btn=e.target.closest?.(sel);if(!btn||btn.closest('#v093-modal'))return;if(btn.dataset.v093pass==='1'){delete btn.dataset.v093pass;return}const f=identify(btn.textContent);if(!f)return;e.preventDefault();e.stopImmediatePropagation();showMenu(w,f[0],f[1],btn)},true)}cloneHomeNav(w);if(!w.__V093_OBS__){w.__V093_OBS__=new w.MutationObserver(()=>{injectStyle(w);installFilter(w);cloneHomeNav(w)});w.__V093_OBS__.observe(w.document.body,{childList:true,subtree:true})}w.document.title='EXTRA INNINGS TAKE 2 v0.9.3';return true}
let ok=false,count=0;function tick(){count++;const w=deepest();if(w&&patch(w)){if(!ok){ok=true;status.textContent='v0.9.3 적용 완료';setTimeout(()=>status.style.opacity='0',900)}}else if(count<1200)setTimeout(tick,100);else status.textContent='통합 UI 적용 실패';if(ok)setTimeout(tick,700)}frame.addEventListener('load',()=>setTimeout(tick,200));setTimeout(tick,400)
})();
