<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2</title>
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#0f6fd8,#37a9ff);color:#fff}body{display:flex;align-items:center;justify-content:center}.loader{text-align:center;padding:28px;max-width:360px}.ball{font-size:56px;animation:bounce .8s ease-in-out infinite alternate}.title{font-size:28px;font-weight:900;margin-top:14px}.sub{font-size:14px;opacity:.88;margin-top:8px}.bar{width:min(280px,74vw);height:8px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin:22px auto}.fill{height:100%;width:0;border-radius:999px;background:#fff;transition:width .18s ease}.progress{font-size:12px;opacity:.8;margin-top:-12px}.error{display:none;background:rgba(0,0,0,.22);padding:14px;border-radius:14px;margin-top:16px;line-height:1.5;word-break:keep-all}@keyframes bounce{to{transform:translateY(-14px) rotate(12deg)}}
</style>
</head>
<body>
<div class="loader" id="loading">
  <div class="ball">⚾</div>
  <div class="title">EXTRA INNINGS TAKE 2</div>
  <div class="sub" id="status">게임 데이터를 불러오는 중입니다.</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="progress" id="progress">0%</div>
  <div class="error" id="error"></div>
</div>
<script>
(async()=>{
  const errorBox=document.getElementById('error');
  const status=document.getElementById('status');
  const fill=document.getElementById('fill');
  const progress=document.getElementById('progress');
  try{
    if(!('DecompressionStream' in window)) throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome 또는 Samsung Internet으로 열어주세요.');
    const names=[
      'part01','part02','part03','part04','part05',
      'part06a','part06b','part06c','part06d','part06e','part06f',
      'part06g01','part06g02','part06g03','part06g04','part06g05','part06g06','part06g07','part06g08','part06g09','part06g10',
      'part07','part08','part09','part10','part11','part12'
    ];
    const texts=[];
    for(let i=0;i<names.length;i++){
      const percent=Math.round((i+1)/names.length*88);
      status.textContent=`게임 데이터 불러오는 중 · ${percent}%`;
      const response=await fetch(`./payload/${names[i]}.txt?v=0202`,{cache:'no-store'});
      if(!response.ok) throw new Error(`게임 데이터 다운로드 실패 (${response.status}, ${names[i]})`);
      texts.push(await response.text());
      fill.style.width=`${percent}%`;
      progress.textContent=`${percent}%`;
    }
    status.textContent='게임 데이터를 해제하는 중입니다.';
    let encoded=texts.join('').replace(/[^A-Za-z0-9+/=]/g,'');
    while(encoded.length%4) encoded+='=';
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('<!DOCTYPE html>')&&!html.includes('<html')) throw new Error('게임 데이터의 형식이 올바르지 않습니다.');
    fill.style.width='100%';
    progress.textContent='100%';
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    errorBox.style.display='block';
    status.textContent='불러오기에 실패했습니다.';
    errorBox.textContent='게임을 불러오지 못했습니다. '+(err&&err.message?err.message:String(err));
  }
})();
</script>
</body>
</html>
