<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.9.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.92);color:#fff;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0910/?v=0920"></iframe>
<div id="status">목업 UI 적용 중</div>
<script>
(()=>{
  const frame=document.getElementById('game');
  const status=document.getElementById('status');
  let tries=0;

  function deepest(){
    try{
      let w=frame.contentWindow;
      for(let i=0;i<38;i++){
        const child=w?.document?.getElementById('game');
        if(!child?.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null}
  }

  function text(el){return (el?.textContent||'').replace(/\s+/g,' ').trim()}
  function navButtons(nav){return [...(nav?.querySelectorAll?.('button,.nav-btn,[role="button"]')||[])]}
  function isGlobalNav(nav){
    const labels=navButtons(nav).map(text).join('|');
    return ['홈','훈련','관계','정보','도감','설정'].every(label=>labels.includes(label));
  }
  function isHomeActive(nav){
    const home=navButtons(nav).find(b=>text(b).includes('홈'));
    if(!home) return false;
    const c=String(home.className||'');
    return /active|selected|current|\bon\b/i.test(c)||home.getAttribute('aria-current')==='page'||home.getAttribute('aria-selected')==='true';
  }
  function activeTokens(btn){
    return String(btn.className||'').split(/\s+/).filter(x=>/active|selected|current|\bon\b/i.test(x));
  }

  function install(w){
    if(w.__EXTRA_INNINGS_V092_PATCHED__) return true;
    if(!w?.document?.body) return false;
    w.__EXTRA_INNINGS_V092_PATCHED__=true;
    const d=w.document;

    const style=d.createElement('style');
    style.id='extra-innings-v092-style';
    style.textContent=`
      :root{--ei-navy:#05245b;--ei-navy2:#02153a;--ei-blue:#0c4ea3;--ei-red:#e23a43;--ei-yellow:#ffd331;--ei-paper:#f8f8f4;--ei-ink:#071c45;--ei-line:#0a3e8b}

      #v089-life-modal,#v090-life-modal,
      .life-activity-modal,.activity-modal{
        background:rgba(0,16,45,.84)!important;
        backdrop-filter:blur(2px)!important;
      }
      #v089-life-modal .v089-box,#v090-life-modal .v090-box,
      .life-activity-modal .modal-card,.activity-modal .modal-card{
        width:min(92vw,430px)!important;
        max-height:86vh!important;
        overflow:auto!important;
        border:4px solid var(--ei-line)!important;
        border-radius:0!important;
        background:linear-gradient(160deg,#fff 0 58%,#edf4ff 58%)!important;
        box-shadow:0 9px 0 var(--ei-navy2)!important;
      }
      #v089-life-modal .v089-head,#v090-life-modal .v090-head,
      .life-activity-modal .modal-header,.activity-modal .modal-header{
        padding:16px!important;
        background:linear-gradient(145deg,var(--ei-navy2),var(--ei-blue))!important;
        color:#fff!important;
        border-radius:0!important;
      }
      #v089-life-modal .v089-list,#v090-life-modal .v090-list,
      .life-activity-modal .activity-list,.activity-modal .activity-list{
        display:grid!important;
        grid-template-columns:1fr!important;
        gap:12px!important;
        padding:14px!important;
      }
      #v089-life-modal .v089-list button,#v090-life-modal .v090-list button,
      .life-activity-modal .activity-list button,.activity-modal .activity-list button{
        min-height:78px!important;
        padding:12px 15px!important;
        border:4px solid var(--ei-line)!important;
        border-radius:0!important;
        background:linear-gradient(165deg,#fff 0 72%,#eaf3ff 72%)!important;
        color:var(--ei-ink)!important;
        box-shadow:0 7px 0 #03183e!important;
        font-size:17px!important;
        font-weight:900!important;
        text-align:left!important;
      }

      .event-modal,.story-modal,.event-overlay,.story-overlay{
        background:rgba(0,16,45,.86)!important;
        backdrop-filter:blur(2px)!important;
      }
      .event-card,.story-card,.event-content,.story-content,
      .event-modal>div,.story-modal>div{
        border-color:var(--ei-line)!important;
        border-radius:0!important;
      }
      .event-title,.story-title,.event-card h2,.story-card h2{
        color:var(--ei-ink)!important;
        font-weight:1000!important;
        letter-spacing:-.04em!important;
      }
      .event-desc,.story-text,.event-description,.event-card p,.story-card p{
        line-height:1.65!important;
      }
      .event-choices button,.choice-list button,.event-choice,.choice-btn,
      .event-card button[data-choice],.story-card button[data-choice]{
        min-height:54px!important;
        border:3px solid var(--ei-line)!important;
        border-radius:0!important;
        background:#f7faff!important;
        color:var(--ei-ink)!important;
        box-shadow:0 4px 0 #03183e!important;
        font-weight:900!important;
        text-align:left!important;
      }
      .event-choices button:active,.choice-list button:active,.event-choice:active,.choice-btn:active{
        transform:translateY(3px)!important;
        box-shadow:0 1px 0 #03183e!important;
      }
      .result-card,.event-result,.result-panel{
        border:4px solid var(--ei-line)!important;
        border-radius:0!important;
        background:#fff!important;
        box-shadow:0 8px 0 #03183e!important;
      }

      body{padding-bottom:env(safe-area-inset-bottom)}
      .bottom-nav{
        z-index:9998!important;
        padding-bottom:env(safe-area-inset-bottom)!important;
      }
      .bottom-nav .nav-btn,.bottom-nav button{
        touch-action:manipulation!important;
        -webkit-tap-highlight-color:transparent!important;
      }
      .bottom-nav .nav-btn>*,.bottom-nav button>*{pointer-events:none!important}
    `;
    d.head.appendChild(style);

    let homeTemplate=null;
    let syncing=false;

    function captureHomeNav(){
      const candidates=[...d.querySelectorAll('.bottom-nav,nav.bottom-nav,#bottom-nav')].filter(isGlobalNav);
      const nav=candidates.find(isHomeActive);
      if(!nav) return false;
      const buttons=navButtons(nav);
      homeTemplate={
        navClass:String(nav.className||''),
        navStyle:nav.getAttribute('style')||'',
        buttons:buttons.slice(0,6).map(b=>({
          html:b.innerHTML,
          baseClass:String(b.className||'').split(/\s+/).filter(x=>x&&!/active|selected|current|\bon\b/i.test(x)).join(' '),
          style:b.getAttribute('style')||''
        }))
      };
      return true;
    }

    function syncNavigation(){
      if(syncing) return;
      syncing=true;
      try{
        if(!homeTemplate) captureHomeNav();
        if(!homeTemplate) return;
        const navs=[...d.querySelectorAll('.bottom-nav,nav.bottom-nav,#bottom-nav')].filter(isGlobalNav);
        navs.forEach(nav=>{
          const buttons=navButtons(nav).slice(0,6);
          if(buttons.length!==6) return;
          nav.className=homeTemplate.navClass;
          if(homeTemplate.navStyle) nav.setAttribute('style',homeTemplate.navStyle); else nav.removeAttribute('style');
          buttons.forEach((btn,i)=>{
            const active=activeTokens(btn);
            const tpl=homeTemplate.buttons[i];
            if(!tpl) return;
            if(btn.innerHTML!==tpl.html) btn.innerHTML=tpl.html;
            btn.className=[tpl.baseClass,...active].filter(Boolean).join(' ');
            if(tpl.style) btn.setAttribute('style',tpl.style); else btn.removeAttribute('style');
          });
        });
      }finally{syncing=false}
    }

    const observer=new w.MutationObserver(()=>{
      syncNavigation();
      const life=d.querySelector('#v089-life-modal,#v090-life-modal,.life-activity-modal,.activity-modal');
      if(life) life.setAttribute('data-v092-styled','1');
    });
    observer.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','aria-selected','aria-current']});

    d.addEventListener('click',()=>setTimeout(syncNavigation,0),true);
    setInterval(syncNavigation,450);
    syncNavigation();
    d.title='EXTRA INNINGS TAKE 2 v0.9.2';
    return true;
  }

  function tick(){
    tries++;
    const w=deepest();
    if(w&&w.__EXTRA_INNINGS_V091_PATCHED__&&install(w)){
      status.textContent='v0.9.2 적용 완료';
      setTimeout(()=>status.style.opacity='0',1100);
      return;
    }
    if(tries<700) setTimeout(tick,100);
    else status.textContent='목업 UI 적용 실패';
  }

  frame.addEventListener('load',()=>setTimeout(tick,260));
  setTimeout(tick,520);
})();
</script>
</body>
</html>
