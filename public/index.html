<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 MLB</title><body style="margin:0;background:#001c3d;color:white;font-family:sans-serif;display:grid;place-items:center;min-height:100vh"><b>오늘의 MLB를 불러오는 중…</b><script>(async()=>{const t=await(await fetch('./app-v2.b64')).text(),b=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0)),s=new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip')));document.open();document.write(await s.text());document.close()})().catch(e=>document.body.innerHTML='<pre>사이트 로딩 실패\n'+e+'</pre>')</script>
