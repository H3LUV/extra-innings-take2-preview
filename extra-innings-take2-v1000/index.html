<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXTRA INNINGS TAKE 2</title><body style="margin:0;background:#071a3f;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh">목업 기반 게임을 불러오는 중…<script>(async()=>{try{const names=Array.from({length:26},(_,i)=>`page-${String(i).padStart(2,'0')}.txt`);const html=(await Promise.all(names.map(n=>fetch(n+'?v=1000').then(r=>{if(!r.ok)throw new Error(n);return r.text()})))).join('');document.open();document.write(html);document.close()}catch(e){document.body.textContent='게임 화면 로딩 실패: '+e.message;console.error(e)}})();</script>
