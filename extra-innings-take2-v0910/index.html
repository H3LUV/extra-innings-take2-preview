 function deepest(){try{let w=frame.contentWindow;for(let i=0;i<32;i++){const f=w?.document?.getElementById('game');if(!f?.contentWindow)break;w=f.contentWindow}return w}catch(e){return null}}
 function textOf(ev){return [ev?.id,ev?.title,ev?.desc,ev?.line,ev?.text,ev?.characterId,ev?.role,ev?.targetRole].filter(Boolean).join(' ')}
 function match(ev,item){const t=textOf(ev);if(item.exclude.some(k=>t.includes(k)))return false;return item.include.some(k=>t.includes(k))}
 function fallbackEvent(category,item){const effects=item.baseball?{'condition.morale':2,'condition.teamStanding':1}:{'condition.morale':2,'condition.stress':-2};return {id:'ei_'+category+'_'+Date.now(),title:item.title,category,weight:1,cooldown:0,desc:item.desc,choices:[{text:'상대의 이야기를 끝까지 듣는다',effects,result:'차분히 대화를 마치며 서로를 조금 더 이해하게 됐다.'},{text:'내 생각을 솔직하게 말한다',effects:{'condition.confidence':2,'condition.stress':-1},result:'내 생각을 숨기지 않고 솔직하게 전했다.'},{text:'오늘은 가볍게 마무리한다',effects:{'condition.morale':1},result:'부담을 남기지 않고 오늘의 시간을 마무리했다.'}]}}
 function injectStyle(w){if(w.document.getElementById('ei-direct-style'))return;const s=w.document.createElement('style');s.id='ei-direct-style';s.textContent=`
 .ei-life-list{display:flex;flex-direction:column;gap:12px}.ei-life-card{width:100%;min-height:84px;text-align:left;border:3px solid #0b438f!important;border-radius:0!important;background:linear-gradient(160deg,#fff 0 75%,#e9f2ff 75%)!important;color:#071c45!important;box-shadow:0 6px 0 #03183e!important;padding:13px 14px!important;font-weight:900!important}.ei-life-card:active{transform:translateY(3px)!important;box-shadow:0 3px 0 #03183e!important}.ei-life-title{display:block;font-size:18px;font-weight:900}.ei-life-desc{display:block;margin-top:4px;color:#63718d;font-size:12px;font-weight:700;line-height:1.45}
 .overlay.ei-event-overlay{background:rgba(2,13,37,.88);align-items:flex-end}.ei-event-overlay .event-box,.ei-event-overlay .result-box{background:#f7f8f4;color:#071c45;border-radius:0;max-width:480px;border-top:8px solid #e23a43;box-shadow:0 -8px 0 #073b81}.ei-event-overlay .overlay-scroll{padding:22px 18px 16px}.ei-event-overlay .event-title,.ei-event-overlay .result-title{color:#073b81;font-size:25px;text-shadow:none;border-bottom:4px solid #e23a43;padding-bottom:8px;margin-bottom:13px}.ei-event-overlay .event-desc{color:#33415e;font-weight:700;line-height:1.65}.ei-event-overlay .choice-btn{background:#fff!important;color:#071c45!important;border:3px solid #0b438f!important;border-radius:0!important;box-shadow:0 4px 0 #03183e!important;font-weight:900!important}.ei-event-overlay .choice-btn:disabled{opacity:.55}.ei-event-overlay .result-line{background:#eaf2ff;color:#071c45;border:2px solid #0b438f;border-radius:0;font-weight:800}.ei-event-overlay .overlay-sticky-footer{background:#f7f8f4;border-top:3px solid #0b438f}.ei-event-overlay .overlay-sticky-footer .btn{background:#e23a43!important;color:#fff!important;border:3px solid #fff!important;border-radius:0!important;font-weight:900!important}
 `;w.document.head.appendChild(s)}
 function finish(w,state){w.Game.Time.advancePart(state);w.Game.Save.autosave(state);if(typeof w.checkGameOverConditions==='function')w.checkGameOverConditions();w.UI.showHub()}
 function showActivity(w,category,fallback){const spec=defs[category],UI=w.UI,state=w.Game.state;if(!spec||!state)return;const root=UI.clear();const cards=spec.items.map(item=>UI.el('button',{class:'btn ei-life-card',onclick:()=>runActivity(w,category,item,fallback)},[UI.el('span',{class:'ei-life-title'},item.label),UI.el('span',{class:'ei-life-desc'},item.desc)]));root.appendChild(UI.screen(spec.title,[UI.el('div',{class:'ei-life-list'},cards)],{footer:[UI.button('← 홈으로',()=>UI.showHub(),'btn btn-ghost')]}));UI.appendNav(root,'relations')}
 function runActivity(w,category,item,fallback){const state=w.Game.state;if(!state||state.__eiActivityBusy)return;state.__eiActivityBusy=1;state.__eiPendingActivity={category,label:item.label,baseball:item.baseball};let pool=[];try{pool=w.Game.Events.eligible(state,category)||[]}catch(e){}let relevant=pool.filter(ev=>match(ev,item));const ev=relevant.length?relevant[Math.floor(Math.random()*relevant.length)]:fallbackEvent(category,item);w.UI.showEventModal(ev,()=>finish(w,state))}
 function install(w){if(!w?.UI||!w?.Game?.Events||!w?.document?.body)return false;if(w.__EI_DIRECT_UI__)return true;w.__EI_DIRECT_UI__=1;injectStyle(w);const UI=w.UI,Game=w.Game;const originalDo=UI.doActionCategory?.bind(UI);UI.doActionCategory=function(category,fallback){if(defs[category])return showActivity(w,category,fallback);return originalDo?originalDo(category,fallback):undefined};
 const originalResolve=Game.Events.resolveChoice.bind(Game.Events);Game.Events.resolveChoice=function(state,event,index){const result=originalResolve(state,event,index);const p=state?.__eiPendingActivity;if(p&&!p.baseball){if(typeof Game.Events.applyDelta==='function')Game.Events.applyDelta(state,'condition.gameSense',-1);else if(state.player?.condition)state.player.condition.gameSense=Math.max(0,(state.player.condition.gameSense||0)-1);result.changeLog=result.changeLog||[];result.changeLog.push('[상태] 경기 감각 -1')}if(state){delete state.__eiPendingActivity;delete state.__eiActivityBusy}return result};
 UI.showEventModal=function(event,onClose){const state=Game.state,overlay=UI.el('div',{class:'overlay ei-event-overlay'});let locked=false;const buttons=[];const box=UI.el('div',{class:'event-box'},[UI.el('div',{class:'overlay-scroll'},[UI.el('div',{class:'event-title'},event.title),UI.el('div',{class:'event-desc'},event.desc),UI.el('div',{class:'event-choices'},event.choices.map((c,idx)=>{const b=UI.button(c.text,()=>{if(locked)return;locked=true;buttons.forEach(x=>x.disabled=true);let result;try{result=Game.Events.resolveChoice(state,event,idx)}catch(err){locked=false;buttons.forEach(x=>x.disabled=false);throw err}overlay.remove();UI.showResultOverlay(event.title,[result.text,...(result.changeLog||[])],onClose)},'btn choice-btn'+(c.risky?' risky':''));buttons.push(b);return b}))])]);overlay.appendChild(box);w.document.body.appendChild(overlay)};
 UI.showResultOverlay=function(title,lines,onClose){const overlay=UI.el('div',{class:'overlay ei-event-overlay'});let closed=false;const close=()=>{if(closed)return;closed=true;overlay.remove();if(onClose)onClose()};const box=UI.el('div',{class:'result-box'},[UI.el('div',{class:'overlay-scroll'},[UI.el('div',{class:'result-title'},title),UI.el('div',{class:'result-lines'},(lines||[]).filter(Boolean).map(l=>UI.el('div',{class:'result-line'},l)))]),UI.el('div',{class:'overlay-sticky-footer'},[UI.button('확인',close,'btn btn-primary btn-lg')])]);overlay.appendChild(box);w.document.body.appendChild(overlay)};
 w.document.title='EXTRA INNINGS TAKE 2 v0.9.1';return true}

})();
