<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.7.5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.88);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0740/?v=0750"></iframe>
<div id="patch-status">고등학교 시작 설정 적용 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<8;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){ return null; }
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.Game||!w.GameData||typeof w.Game.createNewState!=='function') return false;
    if(w.__EXTRA_INNINGS_V075_PATCHED__) return true;
    w.__EXTRA_INNINGS_V075_PATCHED__=true;

    const originalCreateNewState=w.Game.createNewState;
    w.Game.createNewState=function(options){
      const state=originalCreateNewState(options);
      const p=state.player;

      p.age=16;
      p.stageId='hs1';
      p.team='은성고등학교 야구부';
      p.school='은성고등학교';
      p.stageStartDay=0;
      p.seasonStartDay=0;
      p.stageEntrySeasons=p.stageEntrySeasons||{};
      delete p.stageEntrySeasons.ms3;
      p.stageEntrySeasons.hs1=state.currentSeason||1;

      p.competition={id:'highschool',levelId:'HS',leagueName:'고교 야구'};
      p.schedule=null;
      p.scheduleSegments=[];
      p.season=w.GameData.newRecord();
      p.seasonSegments=[];

      state.currentSeason=1;
      state.careerHistory=[];
      state.teamHistory=[];
      state.leagueState=null;

      return state;
    };

    w.document.title='EXTRA INNINGS TAKE 2 v0.7.5';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.7.5 적용 완료';
      setTimeout(()=>status.style.opacity='0',1000);
      return;
    }
    if(attempts<300) setTimeout(tick,100);
    else status.textContent='고등학교 시작 설정 적용 실패';
  }

  rootFrame.addEventListener('load',()=>setTimeout(tick,180));
  setTimeout(tick,350);
})();
</script>
</body>
</html>
