<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.6</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0850/?v=0860"></iframe>
<div id="patch-status">버튼 터치 영역 수정 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<24;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.document||!w.document.head||!w.document.body) return false;
    if(w.__EXTRA_INNINGS_V086_PATCHED__) return true;
    w.__EXTRA_INNINGS_V086_PATCHED__=true;

    const style=w.document.createElement('style');
    style.id='extra-innings-v086-hit-area-fix';
    style.textContent=`
      button,.btn,.nav-btn,.action-btn,.choice-btn,.training-btn,[role="button"]{
        position:relative!important;
        min-height:48px!important;
        touch-action:manipulation!important;
        -webkit-tap-highlight-color:transparent!important;
        cursor:pointer!important;
      }
      .nav-btn,.action-btn,.choice-btn,.training-btn,.btn-lg{
        width:100%!important;
      }
      button>*,.btn>*,.nav-btn>*,.action-btn>*,.choice-btn>*,.training-btn>*,[role="button"]>*{
        pointer-events:none!important;
      }
      .bottom-nav .nav-btn{
        flex:1 1 0!important;
        height:100%!important;
        min-width:0!important;
        padding:6px 2px calc(6px + env(safe-area-inset-bottom))!important;
      }
      .nav-icon,.nav-label,.button-icon,.button-label{
        pointer-events:none!important;
      }
      .choice-btn,.training-btn,.action-btn{
        display:flex!important;
        align-items:center!important;
        box-sizing:border-box!important;
      }
      .overlay-sticky-footer .btn,.screen-footer .btn,.ending-actions .btn,.save-slot-actions .btn{
        min-height:48px!important;
      }
    `;
    w.document.head.appendChild(style);

    function normalize(root){
      if(!root||root.nodeType!==1) return;
      const items=[];
      if(root.matches&&root.matches('button,.btn,.nav-btn,.action-btn,.choice-btn,.training-btn,[role="button"]')) items.push(root);
      if(root.querySelectorAll) items.push(...root.querySelectorAll('button,.btn,.nav-btn,.action-btn,.choice-btn,.training-btn,[role="button"]'));
      items.forEach(el=>{
        el.style.touchAction='manipulation';
        Array.from(el.children||[]).forEach(child=>child.style.pointerEvents='none');
      });
    }
    normalize(w.document.body);
    const observer=new w.MutationObserver(ms=>ms.forEach(m=>m.addedNodes&&m.addedNodes.forEach(normalize)));
    observer.observe(w.document.body,{childList:true,subtree:true});

    w.document.title='EXTRA INNINGS TAKE 2 v0.8.6';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.8.6 적용 완료';
      setTimeout(()=>status.style.opacity='0',1000);
      return;
    }
    if(attempts<540) setTimeout(tick,100);
    else status.textContent='버튼 영역 수정 적용 실패';
  }

  rootFrame.addEventListener('load',()=>setTimeout(tick,220));
  setTimeout(tick,500);
})();
</script>
</body>
</html>
