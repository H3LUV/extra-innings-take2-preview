<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.7.2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#21315c,#0e1324 70%);color:#fff;font-family:system-ui,sans-serif}.box{width:min(88vw,420px);text-align:center;padding:28px}h1{font-size:26px;margin:0 0 12px;color:#ffc04d}p{color:#bfc9df}.bar{height:10px;background:#263252;border-radius:999px;overflow:hidden;margin:18px 0}.fill{height:100%;width:20%;background:linear-gradient(90deg,#f2a93b,#ffcf6b);transition:.25s}.err{color:#ff8b8b;white-space:pre-wrap;margin-top:18px}
</style>
</head>
<body>
<div class="box"><h1>EXTRA INNINGS TAKE 2</h1><p id="status">v0.7.2 수정 엔진을 불러오는 중입니다.</p><div class="bar"><div class="fill" id="fill"></div></div><div class="err" id="err"></div></div>
<script>
(async function(){
  const status=document.getElementById('status');
  const fill=document.getElementById('fill');
  const err=document.getElementById('err');
  try{
    const response=await fetch('../extra-innings-take2-v0710/index.html?v=0720',{cache:'no-store'});
    if(!response.ok) throw new Error('기본 엔진을 불러오지 못했습니다.');
    let html=await response.text();
    fill.style.width='55%';
    status.textContent='포지션 훈련과 인물 등록 시스템을 적용하는 중입니다.';
    html=html.replace('<head>','<head><base href="../extra-innings-take2-v0710/">');
    html=html.replace(/EXTRA INNINGS TAKE 2 v0\.7\.1/g,'EXTRA INNINGS TAKE 2 v0.7.2');

    const patch=`<script>
(function(){
  if(window.__EXTRA_INNINGS_V072_PATCHED__) return;
  window.__EXTRA_INNINGS_V072_PATCHED__=true;

  function updateTraining(id, data){
    var training=GameData.TRAININGS.find(function(t){return t.id===id;});
    if(training) Object.assign(training,data);
  }

  updateTraining('catcher_lead',{
    name:'포수 리드·사인 훈련',positions:['C'],positionExp:[1.2,1.8],
    growth:[['stats.physical.baseballIQ',0.15,0.3],['stats.batting.catching',0.05,0.12]]
  });
  updateTraining('catcher_block',{
    name:'포수 블로킹·포구 훈련',positions:['C'],positionExp:[1.3,1.9],
    growth:[['stats.batting.catching',0.2,0.4],['stats.batting.reaction',0.08,0.18]]
  });
  updateTraining('infield_tr',{
    name:'내야 수비·풋워크 훈련',positions:['1B','2B','3B','SS'],positionExp:[1.1,1.7],
    growth:[['stats.batting.range',0.15,0.35],['stats.batting.catching',0.08,0.18]]
  });
  updateTraining('outfield_tr',{
    name:'외야 타구 판단·수비 훈련',positions:['LF','CF','RF'],positionExp:[1.1,1.7],
    growth:[['stats.batting.range',0.15,0.35],['stats.batting.reaction',0.08,0.18],['stats.batting.speed',0.05,0.1]]
  });
  updateTraining('dp_tr',{
    name:'병살 연결·송구 훈련',positions:['2B','SS'],positionExp:[1.2,1.8],
    growth:[['stats.batting.throwing',0.15,0.3],['stats.batting.reaction',0.05,0.15]]
  });

  var roleTrainings=[
    {id:'sp_role_tr',name:'선발투수 루틴 훈련',group:'position',positions:['SP'],positionExp:[1.1,1.7],intensity:'medium',energyCost:11,growth:[['stats.pitching.stamina',0.15,0.3],['stats.pitching.recovery',0.08,0.18]],resource:{health:[-1,0],fatigue:[3,5],injuryRisk:[1,2]}},
    {id:'rp_role_tr',name:'구원투수 연투 적응 훈련',group:'position',positions:['RP'],positionExp:[1.1,1.7],intensity:'medium',energyCost:10,growth:[['stats.pitching.recovery',0.15,0.3],['stats.pitching.control',0.08,0.18]],resource:{health:[-1,0],fatigue:[2,5],injuryRisk:[1,2]}},
    {id:'cl_role_tr',name:'마무리투수 압박 상황 훈련',group:'position',positions:['CL'],positionExp:[1.1,1.7],intensity:'medium',energyCost:10,growth:[['stats.pitching.crisis',0.15,0.3],['stats.pitching.mental',0.1,0.2]],resource:{health:[0,0],fatigue:[2,4],injuryRisk:[1,2]}}
  ];
  roleTrainings.forEach(function(training){
    if(!GameData.TRAININGS.some(function(t){return t.id===training.id;})) GameData.TRAININGS.push(training);
  });

  Object.assign(GameData.TRAINING_POSITION_MAP,{
    sp_role_tr:['SP'],rp_role_tr:['RP'],cl_role_tr:['CL']
  });

  GameData.positionExperienceGain=function(state,trainingId){
    var p=state.player;
    var group=GameData.profileGroupForPosition(p.primaryPos);
    var training=GameData.TRAININGS.find(function(t){return t.id===trainingId;});
    var mult=1;
    mult*=GameData.PERSONALITY_EFFECTS[p.personality]?.positionExpMult||1;
    mult*=GameData.TRAIT_EFFECTS[p.trait]?.positionExpMult||1;
    var gains=[];
    var mapped=(training&&training.positions)||GameData.TRAINING_POSITION_MAP[trainingId]||[];
    var range=(training&&training.positionExp)||[0.8,1.2];
    var focused=(range[0]+Math.random()*(range[1]-range[0]))*mult;
    if(mapped.includes(p.primaryPos)) gains.push([p.primaryPos,focused]);
    else if(group==='pitcher'&&['velocity_tr','control_tr','breaking_tr','stuff_tr','form_tr','pickoff_tr','crisis_tr','bullpen_tr','lowerbody_tr'].includes(trainingId)) gains.push([p.primaryPos,0.65*mult]);
    else if(group==='fielder'&&['contact_tr','power_tr','eye_tr','vs_breaking_tr','bunt_tr','baserun_tr','steal_tr'].includes(trainingId)) gains.push([p.primaryPos,0.35*mult]);
    if(group==='fielder'&&p.secondaryPos!=='NONE'&&mapped.includes(p.secondaryPos)) gains.push([p.secondaryPos,focused*0.75]);
    return gains;
  };

  var originalPerform=Game.Training.perform;
  Game.Training.perform=function(state,trainingId){
    var before=Object.assign({},state.player.positionExp||{});
    var result=originalPerform(state,trainingId);
    if(result&&!result.fail){
      var lines=[];
      Object.keys(state.player.positionExp||{}).forEach(function(posId){
        var gain=Math.round(((state.player.positionExp[posId]||0)-(before[posId]||0))*100)/100;
        if(gain>0){
          var posName=GameData.POSITIONS.find(function(p){return p.id===posId;})?.name||posId;
          lines.push('[포지션 숙련] '+posName+' +'+gain);
        }
      });
      if(lines.length){
        result.growthLog=(result.growthLog||[]).concat(lines);
        result.changeLog=(result.changeLog||[]).concat(lines);
      }
    }
    return result;
  };

  UI.showTrainingMenu=function(){
    var state=Game.state;
    var root=UI.clear();
    var groups=[['common','공통 훈련'],['batter','타자 훈련'],['pitcher','투수 훈련'],['position','포지션 숙련 훈련']];
    var posGroup=GameData.POSITIONS.find(function(p){return p.id===state.player.primaryPos;})?.group;
    var activePositions=[state.player.primaryPos,state.player.secondaryPos].filter(function(id){return id&&id!=='NONE';});
    var content=[];
    groups.forEach(function(groupInfo){
      var g=groupInfo[0],label=groupInfo[1];
      if(g==='batter'&&posGroup==='pitcher') return;
      if(g==='pitcher'&&posGroup==='fielder') return;
      var items=GameData.TRAININGS.filter(function(t){return t.group===g;});
      if(g==='position'){
        items=items.filter(function(t){
          var mapped=t.positions||GameData.TRAINING_POSITION_MAP[t.id]||[];
          return mapped.some(function(id){return activePositions.includes(id);});
        });
      }
      if(!items.length) return;
      content.push(UI.el('div',{class:'group-label'},label));
      content.push(UI.el('div',{class:'training-list'},items.map(function(t){
        var targets='';
        if(g==='position'){
          targets=(t.positions||GameData.TRAINING_POSITION_MAP[t.id]||[])
            .filter(function(id){return activePositions.includes(id);})
            .map(function(id){return GameData.POSITIONS.find(function(p){return p.id===id;})?.name||id;}).join('·');
        }
        var targetText=targets?' · '+targets+' 숙련':'';
        var labelText=t.name+targetText+' (에너지 -'+t.energyCost+(t.intensity==='high'?' · 고강도':'')+')';
        return UI.button(labelText,function(){UI.doTraining(t.id);},'btn training-btn');
      })));
    });
    root.appendChild(UI.screen('훈련 선택',content,{footer:[UI.button('← 홈으로',function(){UI.showHub();},'btn btn-ghost')]}));
    UI.appendNav(root,'train');
  };

  function syncLegacyRomance(state){
    if(!state) return;
    state.encounteredCharacters=state.encounteredCharacters||{};
    var defaults=GameData.newRomance();
    GameData.ROMANCE_CHARS.forEach(function(c){
      var relation=state.romance&&state.romance[c.id];
      if(!relation) return;
      var progressed=relation.stage!==defaults.stage||(relation.affection||0)>0||(relation.trust||0)>0;
      if(progressed&&!state.encounteredCharacters[c.id]) state.encounteredCharacters[c.id]=1;
    });
  }

  UI.knownRomanceCharacters=function(state){
    syncLegacyRomance(state);
    return GameData.ROMANCE_CHARS.filter(function(c){return (state.encounteredCharacters?.[c.id]||0)>0;});
  };

  UI.pickRomanceIntroduction=function(state){
    var pool=Game.Events.eligible(state,'romance').filter(function(ev){
      var character=GameData.ROMANCE_CHARS.find(function(c){return ev.id==='ro_'+c.id+'_meet';});
      return character&&!(state.encounteredCharacters?.[character.id]>0);
    });
    return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  };

  var originalResolveChoice=Game.Events.resolveChoice;
  Game.Events.resolveChoice=function(state,event,index){
    var result=originalResolveChoice(state,event,index);
    if(event&&event.category==='romance'){
      var character=GameData.ROMANCE_CHARS.find(function(c){return event.id.startsWith('ro_'+c.id+'_');});
      if(character) Game.Meta.discoverCharacter(state,character.id,{level:1,eventId:event.id,route:'romance'});
    }
    return result;
  };

  UI.showRomanceMenu=function(){
    var state=Game.state;
    var root=UI.clear();
    var known=UI.knownRomanceCharacters(state);
    var items=known.length?known.map(function(c){
      var r=state.romance[c.id];
      return UI.el('div',{class:'romance-card'},[
        UI.el('div',{class:'romance-name'},c.name+' · '+c.archetype),
        UI.el('div',{class:'romance-role'},c.role),
        UI.el('div',{class:'romance-stage'},'관계: '+(GameData.ROMANCE_OUTCOMES[r.stage]?.name||r.stage)),
        UI.button('만나러 가기',function(){UI.doRomanceVisit(c.id);},'btn btn-sm')
      ]);
    }):[UI.el('div',{class:'empty-msg'},'아직 특별한 관계가 생긴 사람이 없다. 일상과 훈련 중 첫 만남 이벤트가 발생하면 이곳에 한 명씩 등록된다.')];
    root.appendChild(UI.screen('연애·데이트',items,{footer:[UI.button('← 홈으로',function(){UI.showHub();},'btn btn-ghost')]}));
    UI.appendNav(root,'relations');
  };

  UI.doRomanceVisit=function(charId){
    var state=Game.state;
    if(!(state.encounteredCharacters?.[charId]>0)){
      UI.toast('아직 만나지 않은 인물이다.');
      UI.showRomanceMenu();
      return;
    }
    var pool=Game.Events.eligible(state,'romance').filter(function(ev){
      return ev.id.includes('ro_'+charId+'_')&&ev.id!=='ro_'+charId+'_meet';
    });
    var ev=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
    if(ev){
      UI.showEventModal(ev,function(){Game.Time.advancePart(state);Game.Save.autosave(state);checkGameOverConditions();UI.showHub();});
    }else{
      Game.Events.applyDelta(state,'romance.'+charId+'.affection',3);
      UI.toast('함께 시간을 보내며 조금 더 가까워졌다.');
      Game.Time.advancePart(state);
      Game.Save.autosave(state);
      checkGameOverConditions();
      UI.showHub();
    }
  };

  var originalShowHub=UI.showHub;
  UI.showHub=function(){
    var state=Game.state;
    if(state){
      syncLegacyRomance(state);
      var day=state.player.totalDays||0;
      var gameDay=Game.Time.isGameDay(state);
      if(day>0&&!gameDay&&state.lastRomanceIntroCheckDay!==day){
        state.lastRomanceIntroCheckDay=day;
        var intro=UI.pickRomanceIntroduction(state);
        if(intro&&Math.random()<0.22){
          UI.showEventModal(intro,function(){Game.Save.autosave(state);originalShowHub();});
          return;
        }
      }
    }
    return originalShowHub();
  };
})();
<\/script>`;

    html=html.replace('</body>',patch+'</body>');
    fill.style.width='100%';
    status.textContent='게임을 시작합니다.';
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    status.textContent='로딩에 실패했습니다.';
    err.textContent=e&&e.message?e.message:String(e);
  }
})();
</script>
</body>
</html>
