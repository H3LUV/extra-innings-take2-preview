<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0830/?v=0840"></iframe>
<div id="patch-status">훈련 성장 표시 수정 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<20;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function formatGrowthLine(line){
    if(typeof line!=='string'||!line.includes('[장기성장]')) return line;
    return line.replace(/([+-])(\d+(?:\.\d+)?)/g,function(_,sign,num){
      const value=Number(num);
      return Number.isFinite(value)?sign+value.toFixed(1):_;
    });
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.Game||!w.Game.Training||typeof w.Game.Training.perform!=='function') return false;
    if(w.__EXTRA_INNINGS_V084_PATCHED__) return true;
    w.__EXTRA_INNINGS_V084_PATCHED__=true;

    const originalPerform=w.Game.Training.perform.bind(w.Game.Training);
    w.Game.Training.perform=function(state,trainingId){
      const result=originalPerform(state,trainingId);
      if(result&&!result.fail){
        if(Array.isArray(result.growthLog)) result.growthLog=result.growthLog.map(formatGrowthLine);
        if(Array.isArray(result.changeLog)) result.changeLog=result.changeLog.map(formatGrowthLine);
      }
      return result;
    };

    w.document.title='EXTRA INNINGS TAKE 2 v0.8.4';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.8.4 적용 완료';
      setTimeout(()=>status.style.opacity='0',1000);
      return;
    }
    if(attempts<500) setTimeout(tick,100);
    else status.textContent='훈련 표시 수정 적용 실패';
  }

  rootFrame.addEventListener('load',()=>setTimeout(tick,220));
  setTimeout(tick,500);
})();
</script>
</body>
</html>
