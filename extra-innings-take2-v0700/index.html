<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EXTRA INNINGS TAKE 2 v0.7.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#21315c,#0e1324 70%);color:#fff;font-family:system-ui,sans-serif}.box{width:min(88vw,420px);text-align:center;padding:28px}h1{font-size:26px;margin:0 0 12px;color:#ffc04d}p{color:#bfc9df}.bar{height:10px;background:#263252;border-radius:999px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#f2a93b,#ffcf6b);transition:.2s}small{color:#8290ad}.err{color:#ff8b8b;white-space:pre-wrap;margin-top:18px}</style></head><body><div class="box"><h1>EXTRA INNINGS TAKE 2</h1><p id="status">v0.7.0 엔진을 불러오는 중입니다.</p><div class="bar"><div class="fill" id="fill"></div></div><small id="pct">0%</small><div class="err" id="err"></div></div>
<script>(async()=>{const names=["chunk00.txt","chunk01.txt","chunk02a.txt","chunk02b.txt","chunk02c.txt","chunk02d.txt","chunk02e.txt","chunk03a.txt","chunk03b.txt","chunk03c.txt","chunk03d.txt","chunk03e.txt","chunk04.txt","chunk05a.txt","chunk05b.txt","chunk05c.txt","chunk05d0.txt","chunk05d1.txt","chunk05d2.txt","chunk05e0.txt","chunk05e1.txt","chunk05e2.txt","chunk06.txt","chunk07.txt"];const fill=document.getElementById('fill'),pct=document.getElementById('pct'),status=document.getElementById('status');try{if(!('DecompressionStream'in window))throw new Error('최신 Chrome 또는 Samsung Internet에서 열어주세요.');const parts=[];for(let i=0;i<names.length;i++){const r=await fetch(names[i]+'?v=0703',{cache:'no-store'});if(!r.ok)throw new Error('데이터 다운로드 실패: '+names[i]);const clean=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');if(!clean||clean.length%4!==0)throw new Error('데이터 형식 오류: '+names[i]+' ('+clean.length+')');const bin=atob(clean);const bytes=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);parts.push(bytes);const n=Math.round((i+1)/names.length*88);fill.style.width=n+'%';pct.textContent=n+'%';}status.textContent='게임 엔진을 해제하는 중입니다.';const stream=new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('<html')&&!html.includes('<!DOCTYPE'))throw new Error('게임 데이터 해제 결과가 올바르지 않습니다.');fill.style.width='100%';pct.textContent='100%';document.open();document.write(html);document.close();}catch(e){document.getElementById('err').textContent=e.message;status.textContent='로딩에 실패했습니다.';}})();</script></body></html>
