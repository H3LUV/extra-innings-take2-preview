<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EXTRA INNINGS TAKE 2 v0.7.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#21315c,#0e1324 70%);color:#fff;font-family:system-ui,sans-serif}.box{width:min(88vw,420px);text-align:center;padding:28px}h1{font-size:26px;margin:0 0 12px;color:#ffc04d}p{color:#bfc9df}.bar{height:10px;background:#263252;border-radius:999px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#f2a93b,#ffcf6b);transition:.2s}small{color:#8290ad}.err{color:#ff8b8b;white-space:pre-wrap;margin-top:18px}</style></head><body><div class="box"><h1>EXTRA INNINGS TAKE 2</h1><p id="status">v0.7.0 엔진을 불러오는 중입니다.</p><div class="bar"><div class="fill" id="fill"></div></div><small id="pct">0%</small><div class="err" id="err"></div></div>
<script>(async()=>{const names=["chunk00.txt","chunk01.txt","chunk02.txt","chunk03.txt","chunk04.txt","chunk05.txt","chunk06.txt","chunk07.txt"];const fill=document.getElementById('fill'),pct=document.getElementById('pct'),status=document.getElementById('status');try{if(!('DecompressionStream'in window))throw new Error('최신 Chrome 또는 Samsung Internet에서 열어주세요.');let s='';for(let i=0;i<names.length;i++){const r=await fetch(names[i]+'?v=0700',{cache:'no-store'});if(!r.ok)throw new Error('데이터 다운로드 실패: '+names[i]);s+=await r.text();const n=Math.round((i+1)/names.length*88);fill.style.width=n+'%';pct.textContent=n+'%';}status.textContent='게임 엔진을 해제하는 중입니다.';const clean=s.replace(/[^A-Za-z0-9+/=]/g,'');const bytes=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();fill.style.width='100%';pct.textContent='100%';document.open();document.write(html);document.close();}catch(e){document.getElementById('err').textContent=e.message;status.textContent='로딩에 실패했습니다.';}})();</script></body></html>
