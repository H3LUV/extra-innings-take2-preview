<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.7.7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0760/?v=0770"></iframe>
<div id="patch-status">스토리 콘텐츠 확장 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<12;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function walk(value,visitor,seen=new WeakSet()){
    if(!value||typeof value!=='object'||seen.has(value)) return;
    seen.add(value); visitor(value);
    if(Array.isArray(value)) value.forEach(v=>walk(v,visitor,seen));
    else Object.values(value).forEach(v=>walk(v,visitor,seen));
  }

  function replaceStrings(value,from,to,seen=new WeakSet()){
    if(!value||typeof value!=='object'||seen.has(value)) return;
    seen.add(value);
    Object.keys(value).forEach(key=>{
      const v=value[key];
      if(typeof v==='string') value[key]=v.split(from).join(to);
      else if(v&&typeof v==='object') replaceStrings(v,from,to,seen);
    });
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.Game||!w.GameData||!w.UI||!w.__EXTRA_INNINGS_V076_PATCHED__) return false;
    if(w.__EXTRA_INNINGS_V077_PATCHED__) return true;
    w.__EXTRA_INNINGS_V077_PATCHED__=true;
    const GD=w.GameData, UI=w.UI, doc=w.document;

    // 1) 연애 캐릭터 하은 -> 유나. 동생 하은은 유지한다.
    let romanceId=null;
    if(Array.isArray(GD.ROMANCE_CHARS)){
      const target=GD.ROMANCE_CHARS.find(c=>c&&c.name==='하은'&&String(c.role||c.desc||'').match(/매니저|데이터|기록/));
      if(target){ romanceId=target.id; target.name='유나'; }
    }
    if(romanceId){
      walk(GD,obj=>{
        const linked=obj.characterId===romanceId||obj.charId===romanceId||obj.romanceId===romanceId||obj.routeId===romanceId||obj.id===romanceId;
        if(linked) replaceStrings(obj,'하은','유나');
      });
    }

    // 2) 업로드 문서의 이벤트 전부를 서사형 문장으로 확장한다.
    const titleLead={
      '중간고사 기간':'교실에는 문제집 넘기는 소리만 남았지만, 야구부 일정은 시험이라고 멈춰주지 않았다. 담임의 걱정과 감독의 기대가 동시에 어깨를 눌렀다.',
      '진로 상담':'담임은 기록표보다 네 얼굴을 오래 바라봤다. 야구가 꿈인지, 도망칠 곳인지 스스로도 답해야 하는 순간이었다.',
      '학교 축제':'운동장 바깥의 학교생활은 늘 남의 일처럼 느껴졌다. 하지만 같은 반 친구들은 네가 야구선수이기 전에 같은 반 친구이길 바랐다.',
      '슬럼프의 조짐':'훈련량은 줄지 않았는데 타구음만 달라졌다. 남들은 모를 작은 어긋남이 선수에게는 가장 먼저 들린다.',
      '중요 경기 전날 밤':'내일의 한 경기로 주전 경쟁과 팀 분위기가 달라질 수 있었다. 눈을 감아도 타석과 마운드가 반복해서 떠올랐다.',
      '끝내기의 순간':'관중의 소리가 멀어지고 투수의 손끝만 보였다. 지금 선택한 한 구가 오늘 경기뿐 아니라 팀 안에서의 위치까지 바꿀 수 있었다.',
      '결정적 실책':'공이 글러브를 벗어난 순간 시간이 멈춘 듯했다. 전광판의 실점보다 동료들의 표정을 보는 일이 더 두려웠다.',
      '감독 면담':'문이 닫히자 감독은 한동안 기록지를 넘기기만 했다. 기다릴 것인지, 요구할 것인지, 다른 길을 택할 것인지 네 태도도 평가 대상이었다.',
      '라이벌의 도발':'윤도현의 말은 농담처럼 들렸지만 주변의 시선은 그렇지 않았다. 같은 포지션에 자리는 하나뿐이었다.',
      '동료와의 갈등':'작전 실패보다 더 오래 남는 것은 서로에게 던진 말이었다. 팀 스포츠에서 관계는 기록되지 않는 또 하나의 성적표였다.',
      '훈련비 부담':'새 장비 가격표와 부모님의 굳은 표정이 겹쳐 보였다. 야구를 계속한다는 선택은 가족 전체가 함께 치르는 비용이기도 했다.',
      '아버지의 기대':'아버지가 말하는 꿈에는 네 미래와 자신의 과거가 뒤섞여 있었다. 이해와 부담 사이에서 선을 정해야 했다.',
      '친구와의 다툼':'민재는 네가 바쁜 걸 몰라서 화난 것이 아니었다. 늘 다음으로 미뤄지는 사람이 된 기분이 싫었던 것이다.',
      '심각한 부상 발생':'통증보다 먼저 든 생각은 자리를 빼앗길지 모른다는 두려움이었다. 그러나 서두른 복귀는 두 번째 인생마저 같은 방식으로 망칠 수 있었다.',
      '드래프트 발표 - 미지명':'마지막 구단의 호명이 끝났는데도 네 이름은 나오지 않았다. 첫 번째 인생에서 느꼈던 막막함이 다시 목을 조여왔다.',
      '1군 콜업 통보':'짧은 전화 한 통이 낡은 2군 숙소를 전혀 다른 장소로 바꿔놓았다. 기쁨 뒤에는 이제 실패할 핑계가 없다는 두려움도 따라왔다.',
      '방출 통보':'익숙해지고 싶지 않았던 말이 다시 들렸다. 이번에도 끝으로 받아들일지, 가장 낮은 곳에서 다시 시작할지 선택해야 했다.',
      '은퇴에 대한 결심':'유니폼을 벗는다는 것은 경기를 그만두는 일만이 아니었다. 평생 자신을 설명해주던 이름 하나를 내려놓는 일이었다.',
      '연습실에서 들려온 피아노 소리':'훈련이 끝난 학교는 낯설 만큼 조용했다. 빈 복도 끝에서 들려온 피아노 소리는 야구와 전혀 다른 리듬으로 너를 멈춰 세웠다.',
      '기록지를 든 후배':'유나는 네가 기억하지 못한 타석까지 기록하고 있었다. 숫자 뒤에 숨은 변화까지 알아보는 사람을 만난 것은 처음이었다.',
      '합동훈련에서 만난 소프트볼 에이스':'소민은 첫 인사보다 공을 먼저 던졌다. 말보다 실력으로 상대를 판단하는 사람이라는 걸 한 구 만에 알 수 있었다.',
      '우연히 마주친 연습생':'촬영장 조명 속의 지우는 완벽해 보였지만, 쉬는 시간이 되자 누구보다 평범한 표정으로 혼자 앉아 있었다.',
      '재활실에서의 첫 만남':'은지는 네 기록보다 걸음걸이와 통증을 먼저 봤다. 선수가 아니라 환자로 대하는 시선이 낯설고도 불편했다.'
    };
    const categoryLead={
      school:'교실과 운동장은 서로 다른 규칙으로 움직였다. 어느 한쪽을 외면한 대가는 결국 다른 쪽에서도 돌아왔다.',
      training:'반복되는 훈련 속에서도 오늘의 선택은 남았다. 몸을 밀어붙일지, 약점을 인정할지에 따라 성장의 방향이 달라졌다.',
      game:'경기에서는 준비해온 것과 숨겨온 약점이 동시에 드러난다. 짧은 순간의 판단이 기록과 관계를 함께 바꿨다.',
      team:'팀 안의 자리는 실력만으로 정해지지 않았다. 신뢰와 태도, 말 한마디가 출전 기회만큼 중요했다.',
      family:'가족은 가장 가까운 응원자이면서 가장 쉽게 상처받는 사람들이었다. 야구를 선택할수록 그들의 희생도 커졌다.',
      friend:'오래된 관계는 저절로 유지되지 않았다. 야구를 이유로 미뤄온 시간에도 상대의 하루는 흘러갔다.',
      injury:'몸이 보내는 신호를 무시하면 언젠가 더 큰 대가로 돌아온다. 첫 번째 인생의 실패를 반복하지 않으려면 멈출 용기도 필요했다.',
      career:'한 단계 올라설 때마다 선택지는 줄어들고 책임은 커졌다. 프로의 세계에서는 기다림과 결단 모두 기록으로 남았다.',
      media:'사람들은 경기보다 짧은 영상과 한 문장을 더 오래 기억하기도 했다. 유명해진다는 것은 플레이 밖의 삶도 평가받는 일이었다.',
      romance:'야구 일정표에는 사람의 마음이 적혀 있지 않았다. 그래서 약속과 타이밍을 지키는 일은 경기보다 어려웠다.'
    };
    const resultTail={
      school:'그날의 선택은 성적표보다 오래 남아 학교생활의 분위기를 바꿨다.',
      training:'작은 변화는 당장 기록에 보이지 않았지만 다음 훈련과 경기에서 서서히 드러날 것이다.',
      game:'전광판이 꺼진 뒤에도 동료와 감독은 그 순간의 판단을 기억했다.',
      team:'관계의 온도는 눈에 보이지 않지만 다음 기회가 왔을 때 분명한 차이를 만들 것이다.',
      family:'집으로 돌아온 뒤에도 짧은 대화의 여운은 쉽게 사라지지 않았다.',
      friend:'야구가 끝난 뒤에도 남을 사람인지, 이 선택이 조금씩 답을 만들어갔다.',
      injury:'몸은 선택의 결과를 정직하게 기억했다. 회복과 후유증은 앞으로의 커리어에 이어질 것이다.',
      career:'이 결정은 다음 시즌의 소속과 역할, 그리고 은퇴 이후의 평가까지 이어질 수 있다.',
      media:'반응은 빠르게 퍼졌고, 만들어진 이미지는 쉽게 되돌릴 수 없었다.',
      romance:'말하지 않은 감정까지 상대는 기억했다. 두 사람의 다음 장면은 오늘의 선택 위에서 시작된다.'
    };

    let expanded=0;
    walk(GD,obj=>{
      if(!obj||typeof obj!=='object'||!obj.title||!obj.desc||!Array.isArray(obj.choices)||obj.__storyExpanded077) return;
      obj.__storyExpanded077=true;
      const cat=String(obj.category||'').toLowerCase();
      const isRomance=cat.includes('romance')||obj.characterId||obj.charId||obj.romanceId;
      const group=isRomance?'romance':(cat.includes('school')?'school':cat.includes('train')?'training':cat.includes('game')?'game':cat.includes('team')||cat.includes('coach')?'team':cat.includes('family')?'family':cat.includes('friend')?'friend':cat.includes('injur')||cat.includes('rehab')?'injury':cat.includes('career')?'career':cat.includes('sns')||cat.includes('media')?'media':'');
      const lead=titleLead[obj.title]||categoryLead[group];
      if(lead&&!String(obj.desc).includes(lead)) obj.desc=lead+'\n\n'+obj.desc;
      obj.choices.forEach(choice=>{
        if(!choice||typeof choice.result!=='string') return;
        const tail=resultTail[group];
        if(tail&&!choice.result.includes(tail)) choice.result=choice.result+'\n\n'+tail;
      });
      expanded++;
    });

    // 3) 회귀 설정을 중심으로 인트로 전면 교체
    UI.showStoryIntro=function(){
      const state=w.Game.state;
      if(!state||!state.player){ UI.showHub(); return; }
      const name=state.player.name||'주인공';
      const pages=[
        {kicker:'끝난 줄 알았던 첫 번째 인생',title:'야구도, 사람도 지키지 못했다',copy:`프로의 문턱에서 무너진 뒤에도 ${name}은 오랫동안 야구를 놓지 못했다.\n\n부상을 숨겼고, 조급한 선택을 반복했고, 곁에 있던 사람들을 계속 다음으로 미뤘다. 결국 남은 것은 짧은 커리어와 긴 후회뿐이었다.`},
        {kicker:'다시 열린 3월',title:'눈을 뜨자 열여섯 살이었다',copy:'책상 위에는 은성고 입학 안내서와 오래된 글러브가 놓여 있었다.\n\n달력은 모든 것이 어긋나기 전의 봄을 가리키고 있었다. 이유는 알 수 없었지만, 한 가지는 분명했다. 야구 인생이 다시 시작됐다.'},
        {kicker:'두 번째 기회',title:'실력만 바꾸면 같은 실패가 반복된다',copy:'더 강한 선수가 되는 것만으로는 부족하다.\n\n몸의 신호를 듣고, 가족과 친구의 시간을 지키고, 팀 안에서 신뢰를 쌓아야 한다. 이번 인생의 선택은 경기장 밖에서도 계속될 것이다.'},
        {kicker:'새로운 사람들',title:'만남도 우연도 이번에는 다른 이야기가 된다',copy:'동료와 라이벌, 감독과 스카우트, 그리고 앞으로 만나게 될 사람들.\n\n누구를 믿고 누구에게 마음을 열지에 따라 같은 시즌도 전혀 다른 기억으로 남는다.'},
        {kicker:'EXTRA INNINGS',title:'끝난 인생에 주어진 추가 이닝',copy:`프로가 되는 것만이 정답은 아니다. 성공하고도 외로울 수 있고, 실패하고도 후회 없이 살 수 있다.\n\n${name}은 이번 타석에서 야구와 삶을 모두 지켜낼 수 있을까.`}
      ];
      let index=0;
      const app=doc.getElementById('app');
      if(!app) return;
      function finish(){state.flags=state.flags||{};state.flags.storyIntroPending=false;state.flags.storyIntroSeen=true;const original=w.__V077_ORIGINAL_SHOW_HUB__;original();}
      function render(){
        app.innerHTML='';
        const shell=doc.createElement('div');shell.className='story-intro';
        shell.innerHTML='<div class="story-skyline"><div class="story-sun"></div><div class="story-cloud c1"></div><div class="story-cloud c2"></div><div class="story-school"></div></div><div class="story-card"><div class="story-brand">EXTRA INNINGS TAKE 2</div><div class="story-kicker"></div><h1 class="story-title"></h1><p class="story-copy"></p><div class="story-progress"></div><div class="story-actions"><button class="story-skip" type="button">건너뛰기</button><button class="story-next" type="button"></button></div></div>';
        shell.querySelector('.story-kicker').textContent=pages[index].kicker;
        shell.querySelector('.story-title').textContent=pages[index].title;
        shell.querySelector('.story-copy').textContent=pages[index].copy;
        const progress=shell.querySelector('.story-progress');pages.forEach((_,i)=>{const dot=doc.createElement('div');dot.className='story-dot'+(i<=index?' active':'');progress.appendChild(dot);});
        const next=shell.querySelector('.story-next');next.textContent=index===pages.length-1?'두 번째 야구 인생 시작':'다음';next.onclick=()=>{if(index<pages.length-1){index++;render();}else finish();};
        shell.querySelector('.story-skip').onclick=finish;app.appendChild(shell);
      }
      render();
    };

    // v0.7.6에서 감싼 showHub의 원본을 안전하게 보관해 인트로 종료 시 재귀를 막는다.
    if(!w.__V077_ORIGINAL_SHOW_HUB__){
      const currentShowHub=UI.showHub;
      w.__V077_ORIGINAL_SHOW_HUB__=function(){
        const st=w.Game.state;
        if(st&&st.flags){st.flags.storyIntroPending=false;st.flags.storyIntroSeen=true;}
        currentShowHub();
      };
    }

    // 기존 저장의 연애 표시 이름도 즉시 정리
    if(w.Game.state&&romanceId&&w.Game.state.romance&&w.Game.state.romance[romanceId]){
      w.Game.state.romance[romanceId].displayName='유나';
    }

    doc.title='EXTRA INNINGS TAKE 2 v0.7.7';
    w.__V077_EXPANDED_EVENT_COUNT__=expanded;
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      const w=deepestWindow();
      status.textContent='v0.7.7 적용 완료 · 이벤트 '+(w&&w.__V077_EXPANDED_EVENT_COUNT__||0)+'개 확장';
      setTimeout(()=>status.style.opacity='0',1400);return;
    }
    if(attempts<420) setTimeout(tick,100); else status.textContent='스토리 확장 적용 실패';
  }
  rootFrame.addEventListener('load',()=>setTimeout(tick,250));setTimeout(tick,450);
})();
</script>
