<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0810/?v=0820"></iframe>
<div id="patch-status">하단 메뉴 클릭 영역 수정 중</div>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<16;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function applyPatch(){
    const w=deepestWindow();
    if(!w||!w.document||!w.UI) return false;
    if(w.__EXTRA_INNINGS_V082_PATCHED__) return true;
    w.__EXTRA_INNINGS_V082_PATCHED__=true;

    const style=w.document.createElement('style');
    style.textContent=`
      .bottom-nav .nav-btn{
        position:relative!important;
        min-width:0!important;
        min-height:64px!important;
        padding:0!important;
        touch-action:manipulation!important;
        -webkit-tap-highlight-color:transparent!important;
      }
      .bottom-nav .nav-btn > *,
      .bottom-nav .nav-icon,
      .bottom-nav .nav-label,
      .bottom-nav img,
      .bottom-nav span{
        pointer-events:none!important;
      }
    `;
    w.document.head.appendChild(style);

    // 아이콘이나 자식 요소가 탭 이벤트를 가로채는 경우를 막고,
    // 항상 실제 nav 버튼으로 클릭을 전달한다.
    w.document.addEventListener('click',function(e){
      const nav=e.target&&e.target.closest?e.target.closest('.bottom-nav'):null;
      if(!nav) return;
      const btn=e.target.closest('.nav-btn');
      if(btn) return;
      const x=e.clientX;
      const buttons=[...nav.querySelectorAll('.nav-btn')];
      const target=buttons.find(b=>{const r=b.getBoundingClientRect();return x>=r.left&&x<=r.right;});
      if(target){
        e.preventDefault();
        target.click();
      }
    },true);

    // touchend에서도 동일하게 버튼 전체 영역을 인식한다.
    w.document.addEventListener('touchend',function(e){
      const touch=e.changedTouches&&e.changedTouches[0];
      if(!touch) return;
      const nav=w.document.elementFromPoint(touch.clientX,touch.clientY)?.closest?.('.bottom-nav');
      if(!nav) return;
      const buttons=[...nav.querySelectorAll('.nav-btn')];
      const target=buttons.find(b=>{const r=b.getBoundingClientRect();return touch.clientX>=r.left&&touch.clientX<=r.right;});
      if(target&&!e.target.closest?.('.nav-btn')){
        e.preventDefault();
        target.click();
      }
    },{capture:true,passive:false});

    w.document.title='EXTRA INNINGS TAKE 2 v0.8.2';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.8.2 적용 완료';
      setTimeout(()=>status.style.opacity='0',1000);
      return;
    }
    if(attempts<420) setTimeout(tick,100);
    else status.textContent='하단 메뉴 수정 적용 실패';
  }
  rootFrame.addEventListener('load',()=>setTimeout(tick,220));
  setTimeout(tick,450);
})();
</script>
</body>
</html>
