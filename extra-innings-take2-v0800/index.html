<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}
#game{display:block;width:100%;height:100%;border:0;background:#10121c}
#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#f5efe6;font:12px system-ui,sans-serif;pointer-events:none;opacity:1;transition:opacity .25s}
</style>
</head>
<body>
<iframe id="game" title="EXTRA INNINGS TAKE 2" src="../extra-innings-take2-v0770/?v=0801"></iframe>
<div id="patch-status">프로 커리어 스토리 확장 중</div>
<script>window.EXTRA_INNINGS_V080_EVENTS=[];</script>
<script src="events-1.js?v=0801"></script>
<script src="events-2.js?v=0801"></script>
<script src="events-3.js?v=0801"></script>
<script src="events-4.js?v=0801"></script>
<script src="events-5.js?v=0801"></script>
<script src="events-6.js?v=0801"></script>
<script src="events-7.js?v=0801"></script>
<script src="events-8.js?v=0801"></script>
<script>
(function(){
  const rootFrame=document.getElementById('game');
  const status=document.getElementById('patch-status');
  let attempts=0;

  function deepestWindow(){
    try{
      let w=rootFrame.contentWindow;
      for(let i=0;i<14;i++){
        if(!w||!w.document) break;
        const child=w.document.getElementById('game');
        if(!child||!child.contentWindow) break;
        w=child.contentWindow;
      }
      return w;
    }catch(e){return null;}
  }

  function flagHas(state,key){
    if(!key) return true;
    const flags=state.flags;
    if(flags&&typeof flags.has==='function'&&flags.has(key)) return true;
    if(flags&&flags[key]) return true;
    const ec=state.encounteredCharacters||{};
    const aliases={yuna_met:['haeun','yuna'],yerin_met:['yerin'],somin_met:['somin'],jiwoo_met:['jiwoo'],eunji_met:['eunji']};
    if(aliases[key]&&aliases[key].some(id=>(ec[id]||0)>0)) return true;
    if(key==='major_injury'&&state.player&&state.player.activeInjury&&state.player.activeInjury.severity==='major') return true;
    if(key==='champion'&&(state.championships||state.player?.record?.championships||0)>0) return true;
    if(key==='retire_decided'&&state.player?.stageId==='retired') return true;
    return false;
  }

  function convert(spec){
    return {
      id:spec.id,title:spec.title,category:spec.category||'career',weight:spec.weight||6,cooldown:spec.cooldown||60,once:!!spec.once,
      cond:function(state){
        const stage=state.player&&state.player.stageId;
        if(spec.stages&&spec.stages.length&&!spec.stages.includes(stage)) return false;
        if(spec.requires&&spec.requires.some(k=>!flagHas(state,k))) return false;
        if(spec.excludes&&spec.excludes.some(k=>flagHas(state,k))) return false;
        return true;
      },
      desc:spec.desc,
      choices:spec.choices.map(c=>({text:c[0],effects:c[1],result:c[2]}))
    };
  }

  function applyPatch(){
    const w=deepestWindow();
    const specs=window.EXTRA_INNINGS_V080_EVENTS;
    if(!Array.isArray(specs)||specs.length!==47) return false;
    if(!w||!w.Game||!w.Game.Events||!w.GameData) return false;
    if(w.__EXTRA_INNINGS_V080_PATCHED__) return true;
    w.__EXTRA_INNINGS_V080_PATCHED__=true;

    const extra=specs.map(convert);
    w.GameData.EVENTS_POST_HIGHSCHOOL=extra;

    const originalEligible=w.Game.Events.eligible.bind(w.Game.Events);
    w.Game.Events.eligible=function(state,category,filterFn){
      const base=originalEligible(state,category,filterFn);
      const today=state.player?.totalDays||0;
      state.extraEventLastDay=state.extraEventLastDay||{};
      const added=extra.filter(function(ev){
        if(category&&ev.category!==category) return false;
        if(filterFn&&!filterFn(ev)) return false;
        if(!ev.cond(state)) return false;
        if(ev.once&&flagHas(state,'done_'+ev.id)) return false;
        const last=state.extraEventLastDay[ev.id];
        if(typeof last==='number'&&today-last<(ev.cooldown||0)) return false;
        return true;
      });
      return base.concat(added);
    };

    const originalResolve=w.Game.Events.resolveChoice.bind(w.Game.Events);
    w.Game.Events.resolveChoice=function(state,event,index){
      const result=originalResolve(state,event,index);
      if(event&&event.id&&event.id.startsWith('ex_')){
        state.extraEventLastDay=state.extraEventLastDay||{};
        state.extraEventLastDay[event.id]=state.player?.totalDays||0;
        state.storyTimeline=state.storyTimeline||[];
        state.storyTimeline.push({day:state.player?.totalDays||0,season:state.currentSeason||1,stage:state.player?.stageId||'',eventId:event.id,title:event.title,choice:event.choices?.[index]?.text||'',result:event.choices?.[index]?.result||''});
        if(state.storyTimeline.length>200) state.storyTimeline=state.storyTimeline.slice(-200);
      }
      return result;
    };

    w.document.title='EXTRA INNINGS TAKE 2 v0.8.0';
    return true;
  }

  function tick(){
    attempts++;
    if(applyPatch()){
      status.textContent='v0.8.0 적용 완료 · 신규 이벤트 47개';
      setTimeout(()=>status.style.opacity='0',1300);
      return;
    }
    if(attempts<420) setTimeout(tick,100);
    else status.textContent='프로 스토리 확장 적용 실패';
  }

  rootFrame.addEventListener('load',()=>setTimeout(tick,220));
  setTimeout(tick,450);
})();
</script>
</body>
</html>
