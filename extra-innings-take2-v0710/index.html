  { id: "opposite", name: "밀어치기", risk: "일반적", statKeys: ["contact", "vsBreaking"] },
  { id: "wait_breaking", name: "변화구 대기", risk: "일반적", statKeys: ["vsBreaking", "eye"] },
  { id: "wait_fastball", name: "직구 대기", risk: "일반적", statKeys: ["batSpeed", "eye"] },
  { id: "bunt", name: "번트", risk: "안정적", statKeys: ["bunt"], sacrifice: true },
  { id: "walk", name: "볼넷 유도", risk: "안정적", statKeys: ["eye"], walkType: true },
  { id: "steal", name: "도루 시도", risk: "고위험", statKeys: ["speed", "steal"], stealType: true },
];
GameData.PITCHER_CARDS = [
  { id: "full_power", name: "전력 투구", risk: "공격적", statKeys: ["velocity", "stuff"], energyCost: 8 },
  { id: "control_focus", name: "제구 중심", risk: "안정적", statKeys: ["control"], energyCost: 4 },
  { id: "bait", name: "유인구", risk: "일반적", statKeys: ["breakingBall", "control"], energyCost: 5 },
  { id: "inside", name: "몸쪽 승부", risk: "고위험", statKeys: ["control", "stuff"], energyCost: 6 },
  { id: "outside", name: "바깥쪽 승부", risk: "일반적", statKeys: ["control"], energyCost: 5 },
  { id: "high", name: "높은 공", risk: "일반적", statKeys: ["velocity", "stuff"], energyCost: 5 },
  { id: "low", name: "낮은 공", risk: "일반적", statKeys: ["breakingBall", "control"], energyCost: 5 },
  { id: "breaking_duel", name: "변화구 승부", risk: "안정적", statKeys: ["breakingBall"], energyCost: 6 },
  { id: "quick", name: "빠른 승부", risk: "공격적", statKeys: ["control", "velocity"], energyCost: 7 },
  { id: "pickoff", name: "주자 견제", risk: "안정적", statKeys: ["pickoff"], energyCost: 3, pickoffType: true },
];

Game.GameSim = (function () {
  function role(state) {
    return GameData.POSITIONS.find(p => p.id === state.player.primaryPos)?.group === "pitcher" ? "pitcher" : "batter";
  }
  function statAvg(state, keys, table) {
    const src = table === "pitching" ? state.player.stats.pitching : state.player.stats.batting;
    const vals = keys.map(k => src[k] ?? 30);
    return vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length);
  }
  function opponentLevel(state) {
    const comp = GameData.competitionForState(state);
    return comp.opponentBase + (Math.random() - 0.5) * 8;
  }
  function clampProb(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
  function normalizeWeights(weights) {
    const out = {};
    Object.entries(weights).forEach(([k, v]) => { out[k] = Math.max(0, v); });
    const total = Object.values(out).reduce((a, b) => a + b, 0) || 1;
    Object.keys(out).forEach(k => { out[k] /= total; });
    return out;
  }
  function chooseWeighted(weights, rng = Math.random) {
    let r = rng();
    for (const [key, p] of Object.entries(normalizeWeights(weights))) {
      r -= p;
      if (r <= 0) return key;
    }
    return Object.keys(weights).pop();
  }
  function bump(state, field, amount) {
    if (Game.Season?.bump) Game.Season.bump(state, field, amount);
    else [state.player.record, state.player.season].forEach(r => { r[field] = (r[field] ?? 0) + amount; });
  }
  function scoreRef(game, side) { return side === "player" ? "player" : "opponent"; }
  function runsOnBases(game) { return game.bases.filter(Boolean).length; }
  function addRuns(game, side, amount) { game.score[scoreRef(game, side)] += Math.max(0, amount); }
  function clearBases(game) { game.bases = [false, false, false]; }

  function createGameState(state, options = {}, rng = Math.random) {
    const r = role(state);
    const pos = state.player.primaryPos;
    let inning = 1;
    let playerScore = 0;
    let opponentScore = 0;
    if (r === "pitcher" && pos !== "SP") {
      inning = pos === "CL" ? 9 : 6 + Math.floor(rng() * 3);
      const scenario = rng();
      if (scenario < 0.45) { playerScore = 3; opponentScore = 2; }
      else if (scenario < 0.72) { playerScore = 2; opponentScore = 2; }
      else { playerScore = 2; opponentScore = 3; }
    }
    const lead = playerScore - opponentScore;
    const saveSituation = r === "pitcher" && pos !== "SP" && inning >= 6 && lead > 0 && lead <= 3;
    return {
      id: `g_${state.currentSeason}_${state.player.totalDays}_${Math.floor(rng() * 1e6)}`,
      dayInSeason: Game.League ? Game.League.dayInSeason(state) : 0,
      opponent: options.opponent || (Game.League ? Game.League.opponentFor(state) : "상대팀"),
      competitionId: GameData.competitionForState(state).id,
      inningsScheduled: GameData.competitionForState(state).innings,
      role: r,
      position: pos,
      inning,
      half: "top",
      outs: 0,
      balls: 0,
      strikes: 0,
      bases: [false, false, false],
      score: { player: playerScore, opponent: opponentScore },
      entry: { inning, lead, saveSituation, tied: lead === 0, trailing: lead < 0 },
      leadLost: false,
      teamTookLeadDuringAppearance: false,
      chargedGoAheadRun: false,
      finishedGame: pos === "CL",
      playerRunsAllowed: 0,
      playerEarnedRuns: 0,
      plateAppearances: 0,
      battersFaced: 0,
      log: [],
      statBaseline: { ...(state.player.season || {}) },
    };
  }

  function batterWeights(state, card, game) {
    const avg = statAvg(state, card.statKeys, "batting");
    const opp = opponentLevel(state);
    const cond = Game.Condition.calculate(state).battingModifier;
    const quality = GameData.CLAMP((avg - opp) / 100 + cond / 100, -0.25, 0.25);
    const w = { BB: 0.082, HBP: 0.010, HR: 0.024, "3B": 0.005, "2B": 0.045, "1B": 0.145, K: 0.225, OUT: 0.464 };
    w["1B"] += quality * 0.20; w["2B"] += quality * 0.07; w.HR += quality * 0.045;
    w.K -= quality * 0.16; w.OUT -= quality * 0.155;
    if (card.id === "contact") { w["1B"] += 0.025; w.K -= 0.030; w.HR -= 0.006; }
    if (card.id === "aggressive") { w.HR += 0.010; w["2B"] += 0.008; w.K += 0.035; w.BB -= 0.018; }
    if (card.id === "pull_power") { w.HR += 0.025; w["2B"] += 0.012; w.K += 0.065; w["1B"] -= 0.025; w.BB -= 0.012; }
    if (card.id === "opposite") { w["1B"] += 0.018; w.K -= 0.018; w.HR -= 0.005; }
    if (card.id === "wait_breaking" || card.id === "wait_fastball") { w.BB += 0.012; w.K -= 0.008; }
    if (card.walkType) { w.BB += 0.070; w["1B"] -= 0.025; w["2B"] -= 0.012; w.HR -= 0.010; w.K += 0.008; }

    const p = state.player;
    const style = p.playStyle;
    if (style === "교타형" && ["contact", "opposite", "wait_breaking", "wait_fastball", "walk"].includes(card.id)) {
      w["1B"] += 0.018; w.BB += 0.008; w.K -= 0.018; w.OUT -= 0.008;
    }
    if (style === "장타형" && ["aggressive", "pull_power"].includes(card.id)) {
      w.HR += 0.018; w["2B"] += 0.012; w.K += 0.020; w["1B"] -= 0.012; w.OUT -= 0.006;
    }
    const closeGame = !!game && (Math.abs(game.score.player - game.score.opponent) <= 1 || game.inning >= 7);
    const trailing = !!game && game.score.player < game.score.opponent;
    const personality = GameData.PERSONALITY_EFFECTS?.[p.personality] || {};
    if (p.personality === "hotblood" && (trailing || closeGame)) {
      const b = trailing ? personality.trailingBonus : personality.closeBonus;
      w["1B"] += b; w.HR += b * 0.45; w.K -= b * 0.8; w.OUT -= b * 0.65;
    }
    if (p.personality === "cool" && card.risk === "고위험") {
      const b = personality.riskSuppression || 0; w.K -= b; w.OUT += b * 0.35; w["1B"] += b * 0.45; w.BB += b * 0.20;
    }
    const trait = GameData.TRAIT_EFFECTS?.[p.trait] || {};
    if (p.trait === "클러치 본능" && (closeGame || card.risk === "고위험")) {
      const b = trait.clutchWeightBonus || 0; w["1B"] += b * 0.55; w["2B"] += b * 0.20; w.HR += b * 0.15; w.BB += b * 0.10; w.K -= b * 0.55; w.OUT -= b * 0.45;
    }
    if (p.trait === "위기에 강함" && closeGame) {
      const b = trait.crisisWeightBonus || 0; w["1B"] += b * 0.50; w.BB += b * 0.20; w.K -= b * 0.35; w.OUT -= b * 0.35;
    }
    const weakness = GameData.WEAKNESS_EFFECTS?.[p.weakness] || {};
    if (weakness.batterCardIds?.includes(card.id)) {
      const b = weakness.adverseWeight || 0; w.K += b * 0.55; w.OUT += b * 0.45; w["1B"] -= b * 0.55; w.BB -= b * 0.20; w["2B"] -= b * 0.15;
    }
    if (weakness.batterRisk && weakness.batterRisk === card.risk) {
      const b = weakness.adverseWeight || 0; w.K += b * 0.60; w.OUT += b * 0.40; w.HR -= b * 0.25; w["2B"] -= b * 0.25; w["1B"] -= b * 0.30;
    }
    return normalizeWeights(w);
  }
  function pitcherWeights(state, card, game) {
    const avg = statAvg(state, card.statKeys, "pitching");
    const opp = opponentLevel(state);
    const cond = Game.Condition.calculate(state).pitchingModifier;
    const quality = GameData.CLAMP((avg - opp) / 100 + cond / 100, -0.25, 0.25);
    const w = { K: 0.215, OUT: 0.465, BB: 0.082, HBP: 0.010, HR: 0.024, "2B": 0.050, "1B": 0.154 };
    w.K += quality * 0.22; w.OUT += quality * 0.18;
    w.BB -= quality * 0.10; w.HR -= quality * 0.04; w["2B"] -= quality * 0.08; w["1B"] -= quality * 0.18;
    if (card.id === "full_power") { w.K += 0.035; w.BB += 0.020; w.HR += 0.006; w.OUT -= 0.020; }
    if (card.id === "control_focus") { w.BB -= 0.035; w.OUT += 0.025; w.K -= 0.010; }
    if (card.id === "bait" || card.id === "breaking_duel") { w.K += 0.020; w.BB += 0.010; w["1B"] -= 0.012; }
    if (card.id === "inside") { w.K += 0.018; w.HBP += 0.015; w.HR += 0.008; w.BB += 0.010; }
    if (card.id === "outside" || card.id === "low") { w.OUT += 0.025; w.HR -= 0.010; }
    if (card.id === "high") { w.K += 0.018; w.HR += 0.010; }
    if (card.id === "quick") { w.OUT += 0.018; w["1B"] += 0.010; w.K -= 0.010; }

    const p = state.player;
    if (p.playStyle === "파워피처형" && ["full_power", "high", "quick"].includes(card.id)) {
      w.K += 0.022; w.BB += 0.012; w.OUT -= 0.004; w["1B"] -= 0.010;
    }
    if (p.playStyle === "제구형") { w.BB -= 0.020; w.HBP -= 0.006; w.OUT += 0.016; w.K += 0.010; }
    if (p.playStyle === "기교형" && ["bait", "breaking_duel", "low", "pickoff"].includes(card.id)) { w.K += 0.018; w.OUT += 0.012; w["1B"] -= 0.016; w.HR -= 0.006; }
    if (p.playStyle === "땅볼유도형" && ["low", "outside", "control_focus"].includes(card.id)) { w.OUT += 0.028; w.HR -= 0.014; w["2B"] -= 0.010; w.K -= 0.004; }

    const closeGame = !!game && (Math.abs(game.score.player - game.score.opponent) <= 1 || game.inning >= 7);
    const trailing = !!game && game.score.player < game.score.opponent;
    const runnersOn = !!game && game.bases.some(Boolean);
    const personality = GameData.PERSONALITY_EFFECTS?.[p.personality] || {};
    if (p.personality === "hotblood" && (trailing || closeGame)) {
      const b = trailing ? personality.trailingBonus : personality.closeBonus; w.K += b; w.OUT += b * 0.55; w.BB -= b * 0.45; w["1B"] -= b * 0.55; w.HR -= b * 0.20;
    }
    if (p.personality === "cool" && card.risk === "고위험") {
      const b = personality.riskSuppression || 0; w.BB -= b * 0.55; w.HBP -= b * 0.20; w.HR -= b * 0.25; w.OUT += b * 0.65; w.K += b * 0.35;
    }
    const trait = GameData.TRAIT_EFFECTS?.[p.trait] || {};
    if (p.trait === "클러치 본능" && (closeGame || card.risk === "고위험")) {
      const b = trait.clutchWeightBonus || 0; w.K += b * 0.55; w.OUT += b * 0.45; w.BB -= b * 0.35; w["1B"] -= b * 0.40; w.HR -= b * 0.25;
    }
    if (p.trait === "위기에 강함" && (closeGame || runnersOn)) {
      const b = trait.crisisWeightBonus || 0; w.K += b * 0.50; w.OUT += b * 0.50; w.BB -= b * 0.30; w["1B"] -= b * 0.45; w.HR -= b * 0.25;
    }
    const weakness = GameData.WEAKNESS_EFFECTS?.[p.weakness] || {};
    if (weakness.pitcherWalkWeight) { w.BB += weakness.pitcherWalkWeight; w.HBP += weakness.pitcherHbpWeight || 0; w.OUT -= weakness.pitcherWalkWeight * 0.6; w.K -= weakness.pitcherWalkWeight * 0.4; }
    if (runnersOn && weakness.runnersOnAdverseWeight) {
      const b = weakness.runnersOnAdverseWeight; w.BB += b * 0.35; w["1B"] += b * 0.40; w["2B"] += b * 0.15; w.HR += b * 0.10; w.K -= b * 0.45; w.OUT -= b * 0.55;
    }
    return normalizeWeights(w);
  }

  function forceWalk(game) {
    if (game.bases[0] && game.bases[1] && game.bases[2]) addRuns(game, "player", 1);
    game.bases[2] = game.bases[2] || (game.bases[1] && game.bases[0]);
    game.bases[1] = game.bases[1] || game.bases[0];
    game.bases[0] = true;
  }
  function advanceHit(game, bases, battingSide, rng) {
    const side = battingSide;
    if (bases === 4) {
      const runs = runsOnBases(game) + 1;
      addRuns(game, side, runs); clearBases(game); return runs;
    }
    let runs = 0;
    const [b1, b2, b3] = game.bases;
    if (bases === 3) {
      runs += Number(b1) + Number(b2) + Number(b3);
      game.bases = [false, false, true];
    } else if (bases === 2) {
      runs += Number(b3) + Number(b2) + Number(b1 && rng() < 0.55);
      game.bases = [false, true, Boolean(b1 && runs === Number(b3) + Number(b2))];
    } else {
      runs += Number(b3) + Number(b2 && rng() < 0.58);
      const new3 = Boolean((b2 && runs === Number(b3)) || (b1 && rng() < 0.22));
      game.bases = [true, Boolean(b1), new3];
    }
    addRuns(game, side, runs);
    return runs;
  }
  function pitcherWalk(game) {
    if (game.bases[0] && game.bases[1] && game.bases[2]) {
      addRuns(game, "opponent", 1); return 1;
    }
    game.bases[2] = game.bases[2] || (game.bases[1] && game.bases[0]);
    game.bases[1] = game.bases[1] || game.bases[0];
    game.bases[0] = true;
    return 0;
  }
  function endHalfIfNeeded(game) {
    if (game.outs < 3) return;
    game.outs = 0; clearBases(game);
    game.inning += 1;
  }

  function resolveSteal(state, card, game, rng) {
    const hasRunner = game.bases[0] || game.bases[1];
    if (!hasRunner) return { outcome: "NO_RUNNER", success: false, chance: 0, text: "도루할 주자가 없다." };
    const speed = statAvg(state, card.statKeys, "batting");
    const styleBonus = GameData.PLAYSTYLE_PROFILES?.[state.player.playStyle]?.stealChanceBonus || 0;
    const chance = GameData.CLAMP(55 + (speed - opponentLevel(state)) * 0.75 + Game.Condition.calculate(state).runningModifier + styleBonus, 18, 90);
    const success = rng() * 100 < chance;
    if (success) {
      if (game.bases[1]) { game.bases[1] = false; game.bases[2] = true; }
      else { game.bases[0] = false; game.bases[1] = true; }
      bump(state, "stolenBases", 1);
    } else { bump(state, "caughtStealing", 1); game.outs += 1; }
    endHalfIfNeeded(game);
    return { outcome: success ? "SB" : "CS", success, chance: Math.round(chance), text: success ? "스타트를 끊어 도루에 성공했다!" : "도루를 시도했지만 태그 아웃됐다." };
  }
  function resolveBunt(state, card, game, rng) {
    bump(state, "plateAppearances", 1); game.plateAppearances += 1;
    const runner = game.bases[0] || game.bases[1];
    const skill = statAvg(state, card.statKeys, "batting");
    const chance = GameData.CLAMP(58 + (skill - opponentLevel(state)) * 0.7, 25, 90);
    const success = rng() * 100 < chance;
    if (runner) {
      if (success) {
        bump(state, "sacrificeBunts", 1); game.outs += 1;
        if (game.bases[1]) { game.bases[2] = true; game.bases[1] = false; }
        if (game.bases[0]) { game.bases[1] = true; game.bases[0] = false; }
      } else { bump(state, "atBats", 1); game.outs += 1; }
    } else {
      bump(state, "atBats", 1);
      if (success && rng() < 0.35) { bump(state, "hits", 1); game.bases[0] = true; }
      else game.outs += 1;
    }
    endHalfIfNeeded(game);
    return { outcome: success ? "SH" : "OUT", success, chance: Math.round(chance), text: success ? "정확한 번트로 주자를 진루시켰다." : "번트 타구가 수비 정면으로 향했다." };
  }
  function applyBatterOutcome(state, outcome, game, rng) {
    bump(state, "plateAppearances", 1); game.plateAppearances += 1;
    let success = false; let text = "";
    if (outcome === "BB") { bump(state, "walks", 1); forceWalk(game); success = true; text = "볼넷을 골라 출루했다."; }
    else if (outcome === "HBP") { bump(state, "hbp", 1); forceWalk(game); success = true; text = "몸에 맞는 공으로 출루했다."; }
    else {
      bump(state, "atBats", 1);
      if (["1B", "2B", "3B", "HR"].includes(outcome)) {
        bump(state, "hits", 1); success = true;
        if (outcome === "2B") bump(state, "doubles", 1);
        if (outcome === "3B") bump(state, "triples", 1);
        if (outcome === "HR") bump(state, "hr", 1);
        const before = game.score.player;
        advanceHit(game, outcome === "HR" ? 4 : Number(outcome[0]), "player", rng);
        const rbi = game.score.player - before;
        if (rbi > 0) bump(state, "rbi", rbi);
        if (outcome === "HR") bump(state, "runs", 1);
        text = outcome === "HR" ? "담장을 넘기는 홈런!" : outcome === "3B" ? "외야를 가르는 3루타!" : outcome === "2B" ? "장타 코스로 빠지는 2루타!" : "깨끗한 안타를 만들어냈다.";
      } else {
        game.outs += 1;
        if (outcome === "K") { bump(state, "strikeouts", 1); text = "승부 끝에 삼진으로 물러났다."; }
        else { text = "타구가 야수 정면으로 향해 아웃됐다."; }
      }
    }
    endHalfIfNeeded(game);
    return { success, text };
  }
  function applyPitcherOutcome(state, outcome, game, rng) {
    bump(state, "battersFaced", 1); game.battersFaced += 1;
    const before = game.score.opponent;
    let success = false; let text = "";
    if (outcome === "K") { bump(state, "outsRecorded", 1); bump(state, "strikeoutsPitched", 1); game.outs += 1; success = true; text = "결정구로 삼진을 잡아냈다!"; }
    else if (outcome === "OUT") { bump(state, "outsRecorded", 1); game.outs += 1; success = true; text = "범타를 유도해 아웃카운트를 잡았다."; }
    else if (outcome === "BB") { bump(state, "walksAllowed", 1); pitcherWalk(game); text = "제구가 흔들리며 볼넷을 허용했다."; }
    else if (outcome === "HBP") { bump(state, "hbpAllowed", 1); pitcherWalk(game); text = "몸에 맞는 공을 허용했다."; }
    else {
      bump(state, "hitsAllowed", 1);
      if (outcome === "HR") bump(state, "hrAllowed", 1);
      advanceHit(game, outcome === "HR" ? 4 : outcome === "2B" ? 2 : 1, "opponent", rng);
      text = outcome === "HR" ? "실투가 담장을 넘어갔다." : outcome === "2B" ? "장타를 허용했다." : "안타를 허용했다.";
    }
    const runs = game.score.opponent - before;
    if (runs > 0) {
      bump(state, "runsAllowed", runs); bump(state, "earnedRuns", runs);
      game.playerRunsAllowed += runs; game.playerEarnedRuns += runs;
      if (game.entry.lead > 0 && game.score.opponent >= game.score.player) game.leadLost = true;
      if (game.score.opponent > game.score.player) game.chargedGoAheadRun = true;
    }
    endHalfIfNeeded(game);
    return { success, text };
  }
  function advanceGameMoment(game, state, rng) {
    const beforeLead = game.score.player - game.score.opponent;
    // 플레이어 외 타선/상대 타선의 득점을 간단히 진행한다.
    if (role(state) === "pitcher") {
      if (rng() < 0.24 + Game.League.teamStrength(state) / 500) addRuns(game, "player", rng() < 0.18 ? 2 : 1);
    } else {
      if (rng() < 0.28) addRuns(game, "opponent", rng() < 0.15 ? 2 : 1);
    }
    const afterLead = game.score.player - game.score.opponent;
    if (beforeLead <= 0 && afterLead > 0) game.teamTookLeadDuringAppearance = true;
    game.inning = Math.min(game.inningsScheduled, game.inning + 1);
    game.outs = Math.floor(rng() * 3); clearBases(game);
  }

  function applyProfileMomentum(state, result, card) {
    const p = state.player;
    const trait = GameData.TRAIT_EFFECTS?.[p.trait] || {};
    const weakness = GameData.WEAKNESS_EFFECTS?.[p.weakness] || {};
    const personality = GameData.PERSONALITY_EFFECTS?.[p.personality] || {};
    if (result.success) {
      const gain = Math.max(1, Math.round(2 * (weakness.successConfidenceMult || 1)));
      Game.Events.applyDelta(state, "condition.confidence", gain);
      Game.Events.applyDelta(state, "condition.focus", 1);
    } else if (!["NO_RUNNER", "NO_PO"].includes(result.outcome)) {
      const lossMult = (trait.failureConfidenceMult || 1) * (weakness.failureConfidenceMult || 1);
      Game.Events.applyDelta(state, "condition.confidence", -Math.max(1, Math.round(2 * lossMult)));
      Game.Events.applyDelta(state, "condition.focus", -1);
      if (weakness.failureStress) Game.Events.applyDelta(state, "condition.stress", weakness.failureStress);
    }
    if (p.personality === "hotblood" && card.risk === "고위험" && personality.highRiskStress) {
      Game.Events.applyDelta(state, "condition.stress", personality.highRiskStress);
    }
  }

  function simulateStep(state, cardId, gameState, rngFn) {
    const rng = rngFn || Math.random;
    const game = gameState || createGameState(state, {}, rng);
    const r = role(state);
    const cards = r === "pitcher" ? GameData.PITCHER_CARDS : GameData.BATTER_CARDS;
    const card = cards.find(c => c.id === cardId) || cards[0];
    let result;
    if (r === "batter") {
      if (card.stealType) result = resolveSteal(state, card, game, rng);
      else if (card.sacrifice) result = resolveBunt(state, card, game, rng);
      else {
        const weights = batterWeights(state, card, game);
        const outcome = chooseWeighted(weights, rng);
        const applied = applyBatterOutcome(state, outcome, game, rng);
        const chance = Math.round((["BB", "HBP", "1B", "2B", "3B", "HR"].reduce((a, k) => a + (weights[k] || 0), 0)) * 100);
        result = { outcome, success: applied.success, chance, text: applied.text };
      }
      Game.Events.applyDelta(state, "condition.energy", -Math.max(1, Math.round(3 * Game.Training.energyCostMultiplier(state))));
    } else {
      if (card.pickoffType) {
        const hasRunner = game.bases.some(Boolean);
        const chance = hasRunner ? GameData.CLAMP(20 + statAvg(state, card.statKeys, "pitching") * 0.55, 12, 72) : 0;
        const success = hasRunner && rng() * 100 < chance;
        if (success) { const idx = game.bases.findIndex(Boolean); game.bases[idx] = false; game.outs += 1; bump(state, "outsRecorded", 1); }
        result = { outcome: success ? "PO" : "NO_PO", success, chance: Math.round(chance), text: !hasRunner ? "견제할 주자가 없다." : success ? "빠른 견제로 주자를 잡아냈다!" : "주자가 재빨리 귀루했다." };
      } else {
        const weights = pitcherWeights(state, card, game);
        const outcome = chooseWeighted(weights, rng);
        const applied = applyPitcherOutcome(state, outcome, game, rng);
        const chance = Math.round(((weights.K || 0) + (weights.OUT || 0)) * 100);
        result = { outcome, success: applied.success, chance, text: applied.text };
      }
      Game.Events.applyDelta(state, "condition.energy", -Math.max(2, Math.round((card.energyCost || 5) * Game.Training.energyCostMultiplier(state))));
    }
    applyProfileMomentum(state, result, card);
    result.role = r; result.cardId = card.id; result.gameState = game;
    game.log.push(result); advanceGameMoment(game, state, rng);
    Game.Season.recalcAll(state);
    return result;
  }

  function simulateNeutralPA(state, game, r, rng) {
    if (r === "batter") {
      const card = GameData.BATTER_CARDS.find(c => c.id === "contact");
      const outcome = chooseWeighted(batterWeights(state, card, game), rng);
      return applyBatterOutcome(state, outcome, game, rng);
    }
    const card = GameData.PITCHER_CARDS.find(c => c.id === "control_focus");
    const outcome = chooseWeighted(pitcherWeights(state, card, game), rng);
    return applyPitcherOutcome(state, outcome, game, rng);
  }
  function targetBattersFaced(state, rng) {
    const p = state.player;
    if (p.primaryPos === "SP") {
      const stamina = p.stats.pitching.stamina ?? 30;
      // 평균 선발은 약 5~7이닝, 최상급 내구도 선수만 7이닝 이상을 노리도록 제한한다.
      return Math.round(GameData.CLAMP(18 + stamina * 0.10 + rng() * 4, 19, 28));
    }
    if (p.primaryPos === "CL") return 3 + Math.floor(rng() * 3);
    return 4 + Math.floor(rng() * 4);
  }
  function classifyReliefDecision(ctx) {
    const blownSave = !!(ctx.saveSituation && ctx.leadLost);
    if (ctx.chargedGoAheadRun && !ctx.teamWon) return { decision: "L", blownSave };
    if (ctx.saveSituation && !ctx.leadLost && ctx.teamWon && ctx.finishedGame) return { decision: "SV", blownSave: false };
    if (ctx.saveSituation && !ctx.leadLost && ctx.teamWon && !ctx.finishedGame) return { decision: "HLD", blownSave: false };
    if (ctx.teamWon && ctx.teamTookLeadDuringAppearance) return { decision: "W", blownSave };
    return { decision: "ND", blownSave };
  }
  function finalizeScore(game, state, rng) {
    const maxInn = game.inningsScheduled;
    while (game.inning <= maxInn) {
      if (rng() < 0.27 + Game.League.teamStrength(state) / 700) addRuns(game, "player", rng() < 0.13 ? 2 : 1);
      if (rng() < 0.27) addRuns(game, "opponent", rng() < 0.13 ? 2 : 1);
      game.inning += 1;
    }
    if (game.score.player === game.score.opponent) {
      if (rng() < 0.52) game.score.player += 1; else game.score.opponent += 1;
    }
  }
  function statDelta(state, game, key) {
    const current = state.player.season?.[key] || 0;
    const before = game.statBaseline?.[key] || 0;
    return Math.max(0, current - before);
  }
  function formatInningsFromOuts(outs) {
    return `${Math.floor(outs / 3)}.${outs % 3}`;
  }
  function buildPersonalStats(state, game, decision) {
    if (role(state) === "batter") {
      const pa = statDelta(state, game, "plateAppearances");
      const ab = statDelta(state, game, "atBats");
      const h = statDelta(state, game, "hits");
      const doubles = statDelta(state, game, "doubles");
      const triples = statDelta(state, game, "triples");
      const hr = statDelta(state, game, "hr");
      const rbi = statDelta(state, game, "rbi");
      const bb = statDelta(state, game, "walks");
      const so = statDelta(state, game, "strikeouts");
      const sb = statDelta(state, game, "stolenBases");
      const detail = [`${pa}타석`, `${ab}타수`, `${h}안타`];
      if (doubles) detail.push(`${doubles} 2루타`);
      if (triples) detail.push(`${triples} 3루타`);
      if (hr) detail.push(`${hr}홈런`);
      if (rbi) detail.push(`${rbi}타점`);
      if (bb) detail.push(`${bb}볼넷`);
      if (so) detail.push(`${so}삼진`);
      if (sb) detail.push(`${sb}도루`);
      return { role: "batter", lines: [`개인 성적 · ${detail.join(" ")}`] };
    }

    const outs = statDelta(state, game, "outsRecorded");
    const h = statDelta(state, game, "hitsAllowed");
    const r = statDelta(state, game, "runsAllowed");
    const er = statDelta(state, game, "earnedRuns");
    const bb = statDelta(state, game, "walksAllowed");
    const k = statDelta(state, game, "strikeoutsPitched");
    const hr = statDelta(state, game, "hrAllowed");
    const detail = [`${formatInningsFromOuts(outs)}이닝`, `${h}피안타`, `${r}실점`, `${er}자책`, `${bb}볼넷`, `${k}탈삼진`];
    if (hr) detail.push(`${hr}피홈런`);
    if (decision) detail.push(decision === "ND" ? "승패 없음" : decision);
    return { role: "pitcher", lines: [`개인 성적 · ${detail.join(" ")}`] };
  }

  function finalizeGame(state, results, gameStateOrRng, rngMaybe) {
    let game; let rng;
    if (typeof gameStateOrRng === "function" || gameStateOrRng == null) {
      rng = gameStateOrRng || Math.random;
      game = results?.[0]?.gameState || createGameState(state, {}, rng);
    } else {
      game = gameStateOrRng;
      rng = rngMaybe || Math.random;
    }
    const r = role(state);
    if (r === "batter") {
      const targetPA = Math.max(game.plateAppearances, 4 + (rng() < 0.22 ? 1 : 0));
      while (game.plateAppearances < targetPA) simulateNeutralPA(state, game, r, rng);
      bump(state, "games", 1);
    } else {
      const target = Math.max(game.battersFaced, targetBattersFaced(state, rng));
      while (game.battersFaced < target) simulateNeutralPA(state, game, r, rng);
      bump(state, "pGames", 1);
      if (state.player.primaryPos === "SP") bump(state, "pStarts", 1);
    }
    finalizeScore(game, state, rng);
    const teamWon = game.score.player > game.score.opponent;
    const positive = (results || []).filter(x => x.success).length;
    const ratio = results?.length ? positive / results.length : 0.5;

    Game.Events.applyDelta(state, "condition.teamStanding", teamWon ? 2 : -1);
    Game.Events.applyDelta(state, "fame.baseball", ratio > 0.7 ? 2 : ratio < 0.3 ? -1 : 0);
    Game.Events.applyDelta(state, "fame.team", teamWon ? 1 : 0);
    const personalityFx = GameData.PERSONALITY_EFFECTS?.[state.player.personality] || {};
    const traitFx = GameData.TRAIT_EFFECTS?.[state.player.trait] || {};
    const weaknessFx = GameData.WEAKNESS_EFFECTS?.[state.player.weakness] || {};
    const trustDelta = (ratio > 0.55 ? 2 : ratio < 0.3 ? -2 : 0) + (personalityFx.coachTrustBonus || 0) + (traitFx.coachTrustBonus || 0);
    Game.Careers.addCoachTrust(state, trustDelta);
    const baseFatigue = state.player.primaryPos === "SP" ? 28 : 13;
    Game.Events.applyDelta(state, "condition.fatigue", Math.round(baseFatigue * (weaknessFx.gameFatigueMult || 1)));
    Game.Events.applyDelta(state, "condition.gameSense", 3 + Math.round(ratio * 2));
    const moraleBonus = (personalityFx.moraleBonus || 0) + (traitFx.postGameMorale || 0);
    if (moraleBonus) Game.Events.applyDelta(state, "condition.morale", moraleBonus);

    let decision = "";
    if (r === "pitcher") {
      if (state.player.primaryPos === "SP") {
        if (teamWon && game.playerEarnedRuns <= 3 && game.battersFaced >= 15) decision = "W";
        else if (!teamWon && game.chargedGoAheadRun) decision = "L";
        else decision = "ND";
      } else {
        const classified = classifyReliefDecision({
          saveSituation: game.entry.saveSituation, leadLost: game.leadLost,
          teamWon, finishedGame: state.player.primaryPos === "CL" || game.finishedGame,
          teamTookLeadDuringAppearance: game.teamTookLeadDuringAppearance,
          chargedGoAheadRun: game.chargedGoAheadRun,
        });
        decision = classified.decision;
        if (classified.blownSave) bump(state, "blownSaves", 1);
      }
      const map = { W: "wins", L: "losses", SV: "saves", HLD: "holds", ND: "noDecisions" };
      if (map[decision]) bump(state, map[decision], 1);
    }
    Game.Season.recalcAll(state);
    const naturalInjury = Game.Injuries.maybeNaturalInjury(state, { source: "game" });
    const summary = { teamWon, ratio, naturalInjury, decision, score: { ...game.score }, gameState: game, personalStats: buildPersonalStats(state, game, decision) };
    if (Game.League) Game.League.markDirectResult(state, game, summary);
    return summary;
  }

  function lineupChance(state) {
    const trust = GameData.CLAMP(Game.Careers.getCoachTrust(state), 0, 100);
    const profileBonus = GameData.lineupProfileBonus ? GameData.lineupProfileBonus(state) : 0;
    return GameData.CLAMP(0.28 + trust / 250 + state.player.condition.teamStanding / 300 + profileBonus, 0.25, 0.95);
  }
  function simulateBackgroundGame(state, info = {}, rngFn) {
    const rng = rngFn || Math.random;
    const r = role(state); const pos = state.player.primaryPos;
    let appears = false;
    if (r === "batter") appears = rng() < lineupChance(state);
    else if (pos === "RP") appears = rng() < 0.43 && state.player.condition.energy > 25;
    else if (pos === "CL") appears = rng() < 0.30 && state.player.condition.energy > 28;
    // 선발 등판은 직접 경기 일정으로 편성하므로 비주요 팀 경기에는 원칙적으로 등판하지 않는다.
    else appears = false;

    let game = null; let summary = null;
    if (appears) {
      game = createGameState(state, { opponent: info.opponent }, rng);
      if (r === "batter") {
        const target = 3 + Math.floor(rng() * 3);
        while (game.plateAppearances < target) simulateNeutralPA(state, game, r, rng);
        bump(state, "games", 1);
      } else {
        const target = targetBattersFaced(state, rng);
        while (game.battersFaced < target) simulateNeutralPA(state, game, r, rng);
        bump(state, "pGames", 1);
      }
      Game.Events.applyDelta(state, "condition.gameSense", 1);
      const weaknessFx = GameData.WEAKNESS_EFFECTS?.[state.player.weakness] || {};
      Game.Events.applyDelta(state, "condition.fatigue", Math.round((pos === "RP" || pos === "CL" ? 6 : 3) * (weaknessFx.gameFatigueMult || 1)));
      const personalityFx = GameData.PERSONALITY_EFFECTS?.[state.player.personality] || {};
      const traitFx = GameData.TRAIT_EFFECTS?.[state.player.trait] || {};
      if ((personalityFx.moraleBonus || 0) + (traitFx.postGameMorale || 0)) Game.Events.applyDelta(state, "condition.morale", Math.max(1, Math.round(((personalityFx.moraleBonus || 0) + (traitFx.postGameMorale || 0)) / 2)));
      Game.Season.recalcAll(state);
    }
    const strength = Game.League.teamStrength(state);
    const winProb = GameData.CLAMP(0.48 + (strength - 50) / 120 + (appears ? 0.01 : 0), 0.25, 0.75);
    const won = rng() < winProb;
    if (game) {
      game.score.player = won ? 3 + Math.floor(rng() * 5) : Math.floor(rng() * 4);
      game.score.opponent = won ? Math.floor(rng() * Math.max(1, game.score.player)) : game.score.player + 1 + Math.floor(rng() * 4);
      summary = { won, playerAppeared: true, direct: false, score: { ...game.score }, opponent: info.opponent };
    } else summary = { won, playerAppeared: false, direct: false, opponent: info.opponent };
    return summary;
  }
  function quickSimGame(state, options = {}, rng = Math.random) {
    const game = createGameState(state, options, rng);
    const r = role(state);
    if (r === "batter") {
      while (game.plateAppearances < 4) simulateNeutralPA(state, game, r, rng);
    } else {
      const target = targetBattersFaced(state, rng);
      while (game.battersFaced < target) simulateNeutralPA(state, game, r, rng);
    }
    return finalizeGame(state, [], game, rng);
  }
  function cardsFor(state, gameState) {
    const cards = role(state) === "pitcher" ? GameData.PITCHER_CARDS : GameData.BATTER_CARDS;
    if (!gameState) return cards;
    return cards.filter(c => {
      if (c.stealType) return gameState.bases[0] || gameState.bases[1];
      if (c.pickoffType) return gameState.bases.some(Boolean);
      return true;
    });
  }
  function recommendedSteps(state) {
    if (role(state) === "batter") return 4;
    if (state.player.primaryPos === "SP") return 5;
    return 3;
  }
  return {
    role, statAvg, createGameState, simulateStep, finalizeGame, quickSimGame,
    simulateBackgroundGame, classifyReliefDecision, cardsFor, recommendedSteps,
    _test: { batterWeights, pitcherWeights, chooseWeighted, applyBatterOutcome, applyPitcherOutcome },
  };
})();

</script>
<script>
/* js/systems/conditionEngine.js */
/* ===================== conditionEngine.js =====================
   경기 전 컨디션을 하나의 공통 함수로 계산한다.
   UI 표시용 숫자가 아니라, 실제로 경기 성공 확률에 더해지는 보정치를 반환한다.
   (gameSim.playCard가 이 값을 그대로 사용한다.)
================================================================== */
window.Game = window.Game || {};

Game.Condition = (function () {
  function factor(value, mid = 50, span = 50) {
    // value가 mid보다 높으면 양수, 낮으면 음수. -1~1 범위로 정규화.
    return GameData.CLAMP((value - mid) / span, -1, 1);
  }

  // 반환값의 각 Modifier는 경기 확률 계산식(45 + ... + conditionMod*가중치)에 더해지는
  // "포인트" 단위 보정치다. 대략 -15 ~ +15 범위를 갖는다.
  function calculate(state) {
    const c = state.player.condition;
    const longTermStamina = state.player.stats.physical.stamina;

    const energyF = factor(c.energy, 50, 50);
    const healthF = factor(c.health, 55, 45);
    const fatigueF = factor(50 - c.fatigue, 50, 50); // 근육 피로는 낮을수록 좋음(반전)
    const moraleF = factor(c.morale, 50, 50);
    const senseF = factor(c.gameSense, 50, 50);
    const staminaF = factor(longTermStamina, 40, 60);
    const injuryF = factor(30 - c.injuryRisk, 30, 30); // 부상 위험은 낮을수록 좋음(반전)
    // statPenalty(부상마다 다르게 설정된 페널티 수치)를 실제로 사용한다.
    // 예전엔 이 값이 트리거될 때 설정만 되고 아무 곳에서도 읽히지 않는 죽은 필드였다.
    const activeInjuryPenalty = state.player.activeInjury ? -(state.player.activeInjury.statPenalty || 10) : 0;

    const overallModifier = Math.round(
      (energyF * 0.28 + healthF * 0.2 + fatigueF * 0.2 + moraleF * 0.14 + senseF * 0.1 + staminaF * 0.08) * 14
    ) + activeInjuryPenalty;

    return {
      overallModifier,
      battingModifier: Math.round(overallModifier + senseF * 4),
      pitchingModifier: Math.round(overallModifier + staminaF * 5),
      fieldingModifier: Math.round(overallModifier + fatigueF * 3),
      runningModifier: Math.round(overallModifier + energyF * 3),
      // injuryModifier: 양수면 부상 위험이 평소보다 낮은 상태(안전), 음수면 위험한 상태
      injuryModifier: Math.round(injuryF * 10 + (state.player.activeInjury ? -15 : 0)),
    };
  }

  return { calculate };
})();

</script>
<script>
/* js/systems/injuryEngine.js */
/* ===================== injuryEngine.js =====================
   활성 부상(activeInjury) 상태를 관리한다.
   부상 중에는 고강도 훈련/주요 경기 출전이 제한되고, daysRemaining이
   매일 줄어들다가 0이 되면 회복된다 (즉시 100% 컨디션으로 돌아오진 않는다 -
   회복 직후에도 conditionEngine의 activeInjury 페널티가 잠시 남을 수 있음).
================================================================ */
window.Game = window.Game || {};

Game.Injuries = (function () {
  function trigger(state, opts) {
    const severity = opts.severity || "minor";
    const daysRemaining = opts.daysRemaining || (severity === "major" ? 14 + Math.floor(Math.random() * 14) : 3 + Math.floor(Math.random() * 5));
    const injury = {
      type: opts.type || "타박상",
      severity,
      daysRemaining,
      statPenalty: opts.statPenalty || 0,
      recurrenceRisk: opts.recurrenceRisk || 0,
      startDay: state.player.totalDays,
    };
    state.player.activeInjury = injury;
    state.injuries.push({ day: state.player.totalDays, type: injury.type, severity, daysRemaining });
    return injury;
  }

  // 하루가 지날 때마다 호출. 회복되면 알림 정보를 반환하고, 아니면 null.
  function tick(state) {
    const inj = state.player.activeInjury;
    if (!inj) return null;
    inj.daysRemaining -= 1;
    if (inj.daysRemaining <= 0) {
      state.player.activeInjury = null;
      if (inj.recurrenceRisk) Game.Events.applyDelta(state, "condition.injuryRisk", inj.recurrenceRisk);
      return { recovered: true, type: inj.type, severity: inj.severity };
    }
    return null;
  }

  function isActive(state) { return !!state.player.activeInjury; }
  function isMajor(state) { return !!(state.player.activeInjury && state.player.activeInjury.severity === "major"); }

  // 훈련/경기가 끝날 때마다 호출되는 자연 발생 부상 판정.
  // 낮은 위험(injuryRisk)에서는 거의 발생하지 않고, 높은 위험에서는 유의미하게 발생해야 한다.
  function naturalInjuryChancePercent(state, context) {
    if (isActive(state)) return 0; // 이미 부상 중이면 중복 발생시키지 않는다
    const p = state.player;
    const c = p.condition;
    // 비선형 스케일: injuryRisk 20 -> 약 0.3%, 50 -> 약 2%, 80 -> 약 5.4%, 100 -> 8%
    let chance = Math.pow(GameData.CLAMP(c.injuryRisk, 0, 100) / 100, 1.8) * 8;
    if (c.fatigue > 60) chance += (c.fatigue - 60) * 0.05;
    if (c.health < 50) chance += (50 - c.health) * 0.04;
    if (p.age > 30) chance += (p.age - 30) * 0.15;
    chance -= (p.stats.physical.injuryResistance - 30) * 0.03; // 부상 내성이 높을수록 감소
    // conditionEngine의 injuryModifier(양수=안전, 음수=위험)도 반영한다.
    const injuryMod = Game.Condition.calculate(state).injuryModifier;
    chance -= injuryMod * 0.15;
    const posGroup = GameData.POSITIONS.find(x => x.id === p.primaryPos)?.group;
    if (context.source === "game") chance += 0.6; // 경기는 훈련보다 전반적으로 부상 위험이 높다
    if (context.source === "game" && posGroup === "pitcher") chance += 1.0; // 투수는 어깨/팔꿈치 부담
    if (context.source === "training" && context.intensity === "high") chance += 1.0;
    const weaknessFx = GameData.WEAKNESS_EFFECTS[p.weakness];
    if (weaknessFx?.injuryChanceFlatBonus) chance += weaknessFx.injuryChanceFlatBonus;
    return GameData.CLAMP(chance, 0, 40);
  }

  function maybeNaturalInjury(state, context) {
    const chancePercent = naturalInjuryChancePercent(state, context);
    if (chancePercent <= 0) return null;
    if (Math.random() * 100 >= chancePercent) return null;

    const majorProb = GameData.CLAMP(0.15 + (state.player.condition.injuryRisk - 50) / 200, 0.05, 0.6);
    const severity = Math.random() < majorProb ? "major" : "minor";
    const trainingTypes = ["근육통", "타박상", "손가락 부상", "허리 통증", "종아리 통증"];
    const gameTypes = ["햄스트링", "발목 염좌", "어깨 통증", "타박상", "손가락 부상"];
    const types = context.source === "game" ? gameTypes : trainingTypes;
    const type = types[Math.floor(Math.random() * types.length)];
    return trigger(state, {
      type, severity,
      statPenalty: severity === "major" ? 15 : 5,
      recurrenceRisk: severity === "major" ? 5 : 1,
    });
  }

  return { trigger, tick, isActive, isMajor, naturalInjuryChancePercent, maybeNaturalInjury };
})();

</script>
<script>
/* js/systems/careerEngine.js */
/* ===================== careerEngine.js =====================
   드래프트, 콜업/강등, 방출, 독립리그 재도전, 베테랑/은퇴 등
   전체 커리어 흐름을 이벤트 발생 운에 맡기지 않고 시즌 성과로 판정한다.
=============================================================== */
window.Game = window.Game || {};

Game.Careers = (function () {
  function posGroup(state) {
    return GameData.POSITIONS.find(x => x.id === state.player.primaryPos)?.group || "fielder";
  }
  function overallSkill(state) {
    const table = posGroup(state) === "pitcher" ? state.player.stats.pitching : state.player.stats.batting;
    const values = Object.values(table).filter(v => typeof v === "number" && Number.isFinite(v));
    return values.length ? values.reduce((a, b) => a + b, 0) / values.length : 30;
  }
  function performanceScoreFromRecord(state, rec) {
    const group = posGroup(state);
    if (group === "pitcher") {
      if (!rec || rec.pGames === 0 || rec.outsRecorded === 0) return 30;
      const ip = rec.outsRecorded / 3;
      const workload = Math.min(18, Math.sqrt(ip) * 2.2);
      const eraScore = GameData.CLAMP(92 - (rec.era || 0) * 13, 0, 92);
      const whipScore = GameData.CLAMP(65 - ((rec.whip || 1.4) - 1.1) * 35, 0, 75);
      const roleBonus = rec.saves * 0.5 + rec.holds * 0.25 + rec.wins * 0.35;
      return GameData.CLAMP(Math.round(eraScore * 0.55 + whipScore * 0.25 + workload + roleBonus), 0, 100);
    }
    if (!rec || rec.games === 0 || rec.plateAppearances === 0) return 30;
    const opsScore = GameData.CLAMP(((rec.ops || 0.62) - 0.45) * 105, 0, 75);
    const avgScore = GameData.CLAMP(((rec.avg || 0.2) - 0.16) * 80, 0, 30);
    const powerSpeed = Math.min(15, (rec.hr || 0) * 0.45 + (rec.stolenBases || 0) * 0.25);
    const workload = Math.min(12, Math.sqrt(rec.games || 0));
    return GameData.CLAMP(Math.round(opsScore + avgScore + powerSpeed + workload), 0, 100);
  }
  function performanceScore(state) { return performanceScoreFromRecord(state, state.player.record); }

  function getCoachTrust(state) {
    const rel = state.relationships?.coach_kim;
    if (rel && typeof rel.trust === "number") return rel.trust;
    return state.player.condition?.trustCoach ?? 40;
  }
  function setCoachTrust(state, value) {
    state.relationships = state.relationships || {};
    state.relationships.coach_kim = state.relationships.coach_kim || GameData.newRelationship();
    const v = GameData.CLAMP(value, -100, 100);
    state.relationships.coach_kim.trust = v;
    state.player.condition.trustCoach = v; // 구형 UI/세이브 호환용 미러
    return v;
  }
  function addCoachTrust(state, delta) { return setCoachTrust(state, getCoachTrust(state) + delta); }

  function draftScore(state) {
    const p = state.player;
    const score = overallSkill(state) * 0.40
      + p.fame.baseball * 0.25
      + performanceScoreFromRecord(state, p.record) * 0.20
      + GameData.CLAMP(getCoachTrust(state), 0, 100) * 0.10
      + (GameData.secondaryUtilityBonus ? GameData.secondaryUtilityBonus(state) * 50 : 0)
      - p.condition.injuryRisk * 0.05;
    return GameData.CLAMP(Math.round(score), 0, 100);
  }

  function inferCompetition(stageId, team) {
    if (team && team.includes("독립리그")) return "independent";
    if (team && team.includes("해외")) return stageId === "pro1" || stageId === "veteran" ? "mlb" : "overseasMinor";
    return GameData.STAGE_COMPETITION[stageId] || "highschool";
  }
  function assignCompetition(state, competitionId) {
    const comp = GameData.COMPETITIONS[competitionId] || GameData.COMPETITIONS.highschool;
    state.player.competition = { id: comp.id, levelId: comp.levelId, leagueName: comp.name };
    if (Game.League) Game.League.onContextChanged(state);
    return state.player.competition;
  }
  function changeTeam(state, team, competitionId) {
    if (!team || state.player.team === team) {
      if (competitionId) assignCompetition(state, competitionId);
      return false;
    }
    const from = state.player.team;
    state.player.team = team;
    state.teamHistory.push({ day: state.player.totalDays, from, team });
    assignCompetition(state, competitionId || inferCompetition(state.player.stageId, team));
    if (Game.Season?.ensureSegment) Game.Season.ensureSegment(state, true);
    return true;
  }

  function transitionStage(state, nextStageId, options = {}) {
    const p = state.player;
    const from = p.stageId;
    const teamBefore = p.team;
    if (options.team) p.team = options.team;
    if (options.school) p.school = options.school;
    if (from === nextStageId && !options.force) {
      if (options.competitionId) assignCompetition(state, options.competitionId);
      if (options.team && options.team !== teamBefore) state.teamHistory.push({ day: p.totalDays, from: teamBefore, team: options.team });
      if (Game.Season?.ensureSegment) Game.Season.ensureSegment(state, true);
      return false;
    }
    p.stageId = nextStageId;
    p.stageStartDay = p.totalDays;
    p.stageEntrySeasons = p.stageEntrySeasons || {};
    if (p.stageEntrySeasons[nextStageId] === undefined) p.stageEntrySeasons[nextStageId] = state.currentSeason;
    if (options.ageDelta) p.age += options.ageDelta;
    const competitionId = options.competitionId || inferCompetition(nextStageId, p.team);
    assignCompetition(state, competitionId);
    state.careerHistory.push({ day: p.totalDays, from, to: nextStageId, team: p.team, competitionId });
    if (options.team && options.team !== teamBefore) state.teamHistory.push({ day: p.totalDays, from: teamBefore, team: options.team });
    state.eventHistory.push({ day: p.totalDays, id: `stage_transition:${from}->${nextStageId}` });
    if (Game.Season?.ensureSegment) Game.Season.ensureSegment(state, true);
    return true;
  }

  function seasonCareerScore(state, record) {
    const skill = overallSkill(state);
    const perf = performanceScoreFromRecord(state, record);
    const trust = GameData.CLAMP(getCoachTrust(state), 0, 100);
    const health = state.player.condition.health - state.player.condition.injuryRisk * 0.35;
    const utility = GameData.secondaryUtilityBonus ? GameData.secondaryUtilityBonus(state) * 40 : 0;
    return GameData.CLAMP(Math.round(skill * 0.34 + perf * 0.42 + trust * 0.14 + health * 0.10 + utility), 0, 100);
  }
  function careerNotice(title, lines, decision) { return { title, lines, decision }; }

  function evaluateSeasonEnd(state, record) {
    const p = state.player;
    const status = p.careerStatus;
    const score = seasonCareerScore(state, record);
    status.lastDecision = { season: state.currentSeason, stageId: p.stageId, score };

    if (["pro2", "pro1", "veteran"].includes(p.stageId)) status.proSeasons += 1;
    if (["pro1", "veteran"].includes(p.stageId)) status.serviceYears += 1;
    if (p.competition?.id === "independent") status.independentSeasons += 1;
    if (["overseasMinor", "mlb"].includes(p.competition?.id)) status.overseasSeasons += 1;

    if (p.stageId === "pro2") {
      if (p.competition?.id === "independent") {
        if (score >= 58 && p.age <= 34) {
          status.callups += 1;
          changeTeam(state, "인천 시월즈 2군", "kbo2");
          return careerNotice("프로 재도전 성공", ["독립리그 성적을 인정받아 KBO 퓨처스 계약을 따냈다.", `시즌 평가 ${score}점`], "independent_to_kbo2");
        }
        if (p.age >= 34 && score < 38) {
          transitionStage(state, "retired", { competitionId: "independent" });
          return careerNotice("현역 생활 마무리", ["독립리그에서도 기회를 이어갔지만 이제 유니폼을 벗기로 했다.", `시즌 평가 ${score}점`], "retire_independent");
        }
        return null;
      }

      if (score >= 60 || performanceScoreFromRecord(state, record) >= 72) {
        status.callups += 1;
        const firstTeam = p.team.replace(/\s*2군$/, "") || "서울 드래곤즈";
        transitionStage(state, "pro1", { team: firstTeam, competitionId: "kbo1" });
        addCoachTrust(state, 5);
        return careerNotice("1군 콜업", ["시즌 성과를 인정받아 1군 승격 통보를 받았다.", `시즌 평가 ${score}점`], "callup");
      }
      if (p.age >= 29 && score < 34) {
        status.releases += 1;
        changeTeam(state, "독립리그 챌린저스", "independent");
        return careerNotice("방출과 재도전", ["구단의 보류선수 명단에서 제외됐다.", "독립리그에서 다시 기회를 만들기로 했다."], "release_to_independent");
      }
      return null;
    }

    if (p.stageId === "pro1") {
      if (p.age >= 32 || status.serviceYears >= 7) {
        transitionStage(state, "veteran", { competitionId: p.competition?.id || "kbo1" });
        return careerNotice("베테랑의 문턱", ["후배들이 늘었고 팀에서 맡는 역할도 달라졌다.", `1군 경력 ${status.serviceYears}시즌`], "veteran");
      }
      if (score < 38) {
        status.demotions += 1;
        const minorTeam = p.team.includes("2군") ? p.team : `${p.team} 2군`;
        transitionStage(state, "pro2", { team: minorTeam, competitionId: p.competition?.id === "mlb" ? "overseasMinor" : "kbo2" });
        return careerNotice("2군 강등", ["시즌 성적과 팀 내 경쟁을 이유로 2군에서 다시 시작하게 됐다.", `시즌 평가 ${score}점`], "demotion");
      }
      return null;
    }

    if (p.stageId === "veteran") {
      if (p.age >= 39 || (p.age >= 36 && score < 28)) {
        transitionStage(state, "retired", { competitionId: p.competition?.id || "kbo1" });
        return careerNotice("은퇴", ["긴 고민 끝에 현역 생활을 마치기로 했다.", `통산 프로 경력 ${status.proSeasons}시즌`], "retire");
      }
      if (score < 30) {
        status.demotions += 1;
        const minorTeam = p.team.includes("2군") ? p.team : `${p.team} 2군`;
        transitionStage(state, "pro2", { team: minorTeam, competitionId: p.competition?.id === "mlb" ? "overseasMinor" : "kbo2" });
        return careerNotice("베테랑 2군행", ["팀은 재정비를 위해 2군 조정을 결정했다.", "좋은 성적을 내면 다시 1군으로 돌아올 수 있다."], "veteran_demotion");
      }
      return null;
    }
    return null;
  }

  return {
    overallSkill, performanceScore, performanceScoreFromRecord, draftScore,
    getCoachTrust, setCoachTrust, addCoachTrust, seasonCareerScore,
    inferCompetition, assignCompetition, changeTeam, transitionStage, evaluateSeasonEnd,
  };
})();

</script>
<script>
/* js/systems/seasonEngine.js */
/* ===================== seasonEngine.js =====================
   시즌 기록을 통산/시즌 총합/리그·레벨·팀 세그먼트로 분리한다.
   시즌 종료 후 장기 커리어 판정을 한 번만 실행한다.
================================================================ */
window.Game = window.Game || {};

GameData.SEASON_LENGTH_DAYS = 360;
GameData.SEASON_ACTIVE_STAGES = ["ms3", "hs1", "hs2", "hs3", "pro2", "pro1", "veteran"];

Game.Season = (function () {
  function cloneRecord(rec) {
    const out = JSON.parse(JSON.stringify(rec || GameData.newRecord()));
    GameData.sanitizeRecord(out); GameData.recalcRates(out); return out;
  }
  function segmentKey(state) {
    const p = state.player;
    const comp = GameData.competitionForState(state);
    return [state.currentSeason, p.stageId, comp.id, comp.levelId, p.team].join("|");
  }
  function ensureSegment(state, forceNew = false) {
    const p = state.player;
    p.seasonSegments = p.seasonSegments || [];
    const key = segmentKey(state);
    let seg = !forceNew ? p.seasonSegments.find(x => x.key === key) : null;
    if (!seg) {
      const comp = GameData.competitionForState(state);
      seg = {
        key, season: state.currentSeason, stageId: p.stageId, team: p.team,
        competitionId: comp.id, levelId: comp.levelId, leagueName: comp.name,
        startDay: p.totalDays, endDay: null, record: GameData.newRecord(),
      };
      p.seasonSegments.push(seg);
    }
    return seg;
  }
  function bump(state, field, amount) {
    const records = [state.player.record, state.player.season, ensureSegment(state).record];
    records.forEach(r => { r[field] = (r[field] ?? 0) + amount; });
  }
  function recalcAll(state) {
    [state.player.record, state.player.season, ...((state.player.seasonSegments || []).map(s => s.record))]
      .forEach(r => { GameData.sanitizeRecord(r); GameData.recalcRates(r); });
  }
  function isSeasonEnd(state) {
    const p = state.player;
    if (!GameData.SEASON_ACTIVE_STAGES.includes(p.stageId)) return false;
    if (p.date.part !== 0) return false;
    return p.totalDays - (p.seasonStartDay || 0) >= GameData.SEASON_LENGTH_DAYS;
  }
  function recordLine(rec, isPitcher) {
    return isPitcher
      ? `${rec.pGames}경기 ${rec.wins}승 ${rec.losses}패 ${rec.saves}세이브 ${rec.holds}홀드 · ERA ${rec.era} · ${rec.inningsDisplay}이닝`
      : `${rec.games}경기 타율 ${rec.avg} · ${rec.hr}홈런 ${rec.rbi}타점 · OPS ${rec.ops}`;
  }
  function finalizeSeason(state) {
    const p = state.player;
    recalcAll(state);
    (p.seasonSegments || []).forEach(seg => { if (seg.endDay == null) seg.endDay = p.totalDays; });
    const isPitcher = GameData.POSITIONS.find(x => x.id === p.primaryPos)?.group === "pitcher";
    const leagueSummary = Game.League ? Game.League.finalizeSeason(state) : null;
    const endedSeasonNum = state.currentSeason;
    const aggregate = cloneRecord(p.season);
    const segments = (p.seasonSegments || []).map(seg => ({
      season: seg.season, stageId: seg.stageId, team: seg.team,
      competitionId: seg.competitionId, levelId: seg.levelId, leagueName: seg.leagueName,
      startDay: seg.startDay, endDay: seg.endDay, record: cloneRecord(seg.record),
    }));
    const primary = segments[0] || {
      stageId: p.stageId, team: p.team,
      competitionId: p.competition?.id, levelId: p.competition?.levelId,
    };
    const summary = {
      season: endedSeasonNum,
      stageId: primary.stageId,
      endingStageId: p.stageId,
      team: primary.team,
      endingTeam: p.team,
      day: p.totalDays,
      record: aggregate,
      segments,
      teamSeason: leagueSummary,
      line: recordLine(aggregate, isPitcher),
    };
    p.seasonHistory.push(summary);

    const awardLines = [];
    if (isPitcher && aggregate.pGames >= 10 && aggregate.outsRecorded > 0 && aggregate.era < 2.8) {
      state.awards.push({ season: endedSeasonNum, name: "시즌 방어율 우수상" });
      awardLines.push("수상: 시즌 방어율 우수상");
      Game.Events.applyDelta(state, "fame.baseball", 4);
    }
    if (!isPitcher && aggregate.games >= 20 && aggregate.avg >= 0.320) {
      state.awards.push({ season: endedSeasonNum, name: "시즌 타격상" });
      awardLines.push("수상: 시즌 타격상");
      Game.Events.applyDelta(state, "fame.baseball", 4);
    }

    // 프로 경력 판정은 기록을 초기화하기 전에 한 번만 수행한다.
    const stageBeforeCareerDecision = p.stageId;
    const careerResult = Game.Careers.evaluateSeasonEnd(state, aggregate);

    state.currentSeason += 1;
    p.season = GameData.newRecord();
    p.seasonSegments = [];
    p.seasonStartDay = p.totalDays;
    p.schedule = null;
    p.scheduleSegments = [];
    state.lastSeasonCheck = p.totalDays;
    if (["pro2", "pro1", "veteran"].includes(stageBeforeCareerDecision)) p.age += 1;
    if (Game.League) Game.League.ensureSeason(state);
    ensureSegment(state);

    const teamLine = leagueSummary
      ? `${leagueSummary.leagueName || GameData.COMPETITIONS[leagueSummary.competitionId]?.name || "리그"} 팀 성적 ${leagueSummary.wins}승 ${leagueSummary.losses}패 · ${leagueSummary.rank}/${leagueSummary.teamCount}위${leagueSummary.postseasonQualified ? " · 포스트시즌 진출" : ""}`
      : null;
    return {
      type: "season",
      title: `시즌 종료 - ${endedSeasonNum}번째 시즌`,
      lines: [summary.line, teamLine, ...awardLines, ...(careerResult ? careerResult.lines : []), "새로운 시즌이 시작됩니다."].filter(Boolean),
      careerResult,
    };
  }
  return { isSeasonEnd, finalizeSeason, ensureSegment, bump, recalcAll, cloneRecord };
})();

</script>
<script>
/* js/systems/endingEngine.js */
/* ===================== endingEngine.js =====================
   커리어 축 x 인생 축 x 은퇴후 진로 축 x 연애 축을 계산해
   최종 엔딩(제목/서술)을 조합 생성한다.
   조합 수가 크므로 "실제 이름만 다른 100개 목록"이 아니라
   각 축의 판정 조건과 문장이 실제로 달라지는 구조.
=============================================================== */
window.Game = window.Game || {};

Game.EndingEngine = (function () {
  function pickAxis(list, state) {
    for (const item of list) {
      try { if (item.cond(state)) return item; } catch (e) { /* ignore */ }
    }
    return list[list.length - 1];
  }

  function romanceKey(state) {
    const stageRank = { none: 0, met: 1, interest: 2, close: 3, dating: 4, stable: 5,
      longdistance: 4, secret: 4, public: 5, conflict: 3, breakup: 6, friend: 6,
      engaged: 7, married: 8 };
    let best = null, bestChar = null;
    Object.entries(state.romance).forEach(([id, r]) => {
      if (best === null || (stageRank[r.stage] || 0) > (stageRank[best] || 0)) { best = r.stage; bestChar = id; }
    });
    if (!best || best === "none") return { key: "none", charId: null };
    let key = best;
    if (key === "engaged" && state.player.age > 33) key = "married";
    if (key === "met" || key === "interest" || key === "close") key = "never";
    if (key === "conflict") key = "stable";
    if (!GameData.ROMANCE_OUTCOMES[key]) key = "stable";
    return { key, charId: bestChar };
  }

  function compute(state) {
    const career = pickAxis(GameData.CAREER_TIERS, state);
    const life = pickAxis(GameData.LIFE_TONES, state);
    const path = pickAxis(GameData.POST_CAREER_PATHS, state);
    const { key: romKey, charId } = romanceKey(state);
    const romOutcome = GameData.ROMANCE_OUTCOMES[romKey];
    const romChar = charId ? GameData.ROMANCE_CHARS.find(c => c.id === charId) : null;

    const id = `${career.id}__${life.id}__${path.id}__${romKey}`;
    // 커리어/인생 두 축만으로는 서로 다른 엔딩이 같은 제목처럼 보일 수 있어
    // 은퇴 후 진로·연애 결과까지 제목에 반영해 조합마다 실제로 구분되게 한다.
    const title = `${career.name} · ${life.name} · ${path.name} · ${romOutcome.name}`;
    const romanceLine = romChar
      ? `그리고 그 곁에는, ${romChar.name}과(와)의 이야기가 있었다 — ${romOutcome.line}`
      : `연애보다 야구를 택한 인생이었다 — ${romOutcome.line}`;

    const narrative = [
      career.line,
      life.line,
      path.line,
      romanceLine,
    ].join(" ");

    return {
      id, title,
      careerTier: career.name, lifeTone: life.name, postCareerPath: path.name,
      romanceOutcome: romOutcome.name, romanceChar: romChar ? romChar.name : "-",
      narrative,
      stats: {
        record: state.player.record,
        fame: state.player.fame,
        money: state.player.money,
        health: state.player.condition.health,
        age: state.player.age,
      },
    };
  }

  return { compute };
})();

</script>

<!-- UI -->
<script>
/* js/ui/render.js */
/* ===================== render.js =====================
   공통 DOM 생성 헬퍼. 프레임워크 없이 순수 JS로 화면을 그린다.
======================================================== */
window.UI = window.UI || {};

UI.el = function (tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
  });
  return node;
};

UI.root = () => document.getElementById("app");

UI.clear = function () {
  const r = UI.root();
  r.innerHTML = "";
  return r;
};

UI.button = (label, onClick, cls = "btn") => UI.el("button", { class: cls, onclick: onClick }, label);

UI.statBar = function (label, value, max = 100, cls = "") {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return UI.el("div", { class: "stat-row" }, [
    UI.el("span", { class: "stat-label" }, label),
    UI.el("div", { class: "stat-bar-track" }, [
      UI.el("div", { class: `stat-bar-fill ${cls}`, style: `width:${pct}%` }),
    ]),
    UI.el("span", { class: "stat-value" }, String(Math.round(value))),
  ]);
};

UI.toast = function (msg) {
  const t = UI.el("div", { class: "toast" }, msg);
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2200);
};

UI.screen = function (title, contentChildren, opts = {}) {
  const wrap = UI.el("div", { class: "screen" });
  if (title) wrap.appendChild(UI.el("div", { class: "screen-title" }, title));
  const body = UI.el("div", { class: "screen-body" }, contentChildren);
  wrap.appendChild(body);
  if (opts.footer) wrap.appendChild(UI.el("div", { class: "screen-footer" }, opts.footer));
  return wrap;
};

</script>
<script>
/* js/ui/screens_title.js */
/* ===================== screens_title.js =====================
   타이틀, 새 게임(캐릭터 생성), 이어하기(저장 슬롯) 화면
================================================================ */
window.UI = window.UI || {};

UI.showTitle = function () {
  const root = UI.clear();
  root.appendChild(UI.el("div", { class: "title-screen" }, [
    UI.el("div", { class: "title-logo" }, "엑스트라 이닝"),
    UI.el("div", { class: "title-sub" }, "다시 시작된 야구 인생"),
    UI.el("div", { class: "title-buttons" }, [
      UI.button("새 게임", () => UI.showCharCreate(), "btn btn-primary btn-lg"),
      UI.button("이어하기", () => UI.showLoadSlots(), "btn btn-lg"),
      UI.button("엔딩 도감", () => UI.toast("먼저 게임을 시작하거나 불러오세요."), "btn btn-ghost"),
    ]),
  ]));
};

UI.showLoadSlots = function () {
  const root = UI.clear();
  const slots = Game.Save.listSlots();
  const items = slots.length === 0
    ? [UI.el("div", { class: "empty-msg" }, "저장된 게임이 없습니다.")]
    : slots.map(s => UI.el("div", { class: "save-slot" }, [
        UI.el("div", { class: "save-slot-info" }, [
          UI.el("div", { class: "save-slot-name" }, `${s.meta.name || "선수"} · ${s.meta.stage || ""}`),
          UI.el("div", { class: "save-slot-date" }, s.meta.date || new Date(s.savedAt).toLocaleString()),
          UI.el("div", { class: "save-slot-tag" }, s.id === "auto" ? "자동저장" : s.id),
        ]),
        UI.el("div", { class: "save-slot-actions" }, [
          UI.button("불러오기", () => {
            const result = Game.Save.loadFromSlot(s.id);
            if (result.ok) {
              Game.state = result.state;
              UI.showHub();
            } else {
              UI.toast(`이 저장 데이터를 불러올 수 없습니다: ${result.error}`);
            }
          }),
          UI.button("삭제", () => { Game.Save.deleteSlot(s.id); UI.showLoadSlots(); }, "btn btn-danger btn-sm"),
        ]),
      ]));
  root.appendChild(UI.screen("이어하기", items, {
    footer: [UI.button("← 타이틀로", () => UI.showTitle(), "btn btn-ghost")],
  }));
};

UI.showManualSaveSlots = function () {
  const root = UI.clear();
  const existing = Game.Save.listSlots().filter(s => s.id !== "auto");
  const slotIds = ["slot1", "slot2", "slot3", "slot4", "slot5"];
  const items = slotIds.map(id => {
    const found = existing.find(s => s.id === id);
    return UI.el("div", { class: "save-slot" }, [
      UI.el("div", { class: "save-slot-info" }, [
        UI.el("div", { class: "save-slot-name" }, found ? `${found.meta.name} · ${found.meta.stage}` : "(빈 슬롯)"),
        UI.el("div", { class: "save-slot-date" }, found ? (found.meta.date || "") : ""),
      ]),
      UI.button(found ? "덮어쓰기" : "저장", () => {
        Game.Save.saveToSlot(id, Game.state, {
          name: Game.state.player.name,
          stage: GameData.STAGES.find(x => x.id === Game.state.player.stageId)?.name,
          date: `${Game.state.player.date.year}년차 ${Game.state.player.date.month}월 ${Game.state.player.date.day}일`,
        });
        UI.toast("저장했습니다.");
        UI.showManualSaveSlots();
      }),
    ]);
  });
  root.appendChild(UI.screen("수동 저장", items, {
    footer: [UI.button("← 돌아가기", () => UI.showHub(), "btn btn-ghost")],
  }));
};

UI.showCharCreate = function () {
  const state = {
    name: "", personality: GameData.PERSONALITIES[0].id, playerType: "fielder",
    primaryPos: "SS", secondaryPos: "2B", batThrow: GameData.BAT_THROW[0],
    playStyle: GameData.PLAY_STYLE_OPTIONS.fielder[0].id,
    trait: GameData.TRAIT_OPTIONS[0].id,
    weakness: GameData.WEAKNESS_OPTIONS.fielder[0].id,
  };

  function group() { return state.playerType; }
  function primaryOptions() { return group() === "pitcher" ? GameData.PITCHER_POSITIONS : GameData.FIELDER_POSITIONS; }
  function styleOptions() { return GameData.PLAY_STYLE_OPTIONS[group()]; }
  function weaknessOptions() { return GameData.WEAKNESS_OPTIONS[group()]; }
  function secondaryOptions() {
    if (group() === "pitcher") return [];
    return [GameData.NO_SECONDARY_POSITION, ...GameData.FIELDER_POSITIONS.filter(p => p.id !== state.primaryPos)];
  }
  function normalizeSelections() {
    const g = group();
    if (!primaryOptions().some(p => p.id === state.primaryPos)) state.primaryPos = g === "pitcher" ? "SP" : "SS";
    if (g === "pitcher") state.secondaryPos = "NONE";
    else if (!secondaryOptions().some(p => p.id === state.secondaryPos)) state.secondaryPos = "NONE";
    if (!styleOptions().some(x => x.id === state.playStyle)) state.playStyle = styleOptions()[0].id;
    if (!weaknessOptions().some(x => x.id === state.weakness)) state.weakness = weaknessOptions()[0].id;
  }
  function selectedOption(list, id) { return list.find(x => (x.id || x) === id); }

  function render() {
    normalizeSelections();
    const root = UI.clear();
    const section = (label, node, extraClass = "") => UI.el("div", { class: `cc-section ${extraClass}`.trim() }, [
      UI.el("div", { class: "cc-label" }, label), node,
    ]);
    const pickerRow = (options, current, onPick, getLabel = x => x.name || x) => UI.el("div", { class: "cc-options" },
      options.map(o => {
        const value = o.id || o;
        return UI.el("button", {
          class: "cc-option" + (value === current ? " selected" : ""),
          onclick: () => { onPick(value); render(); },
        }, getLabel(o));
      }));
    const detail = (item) => item ? UI.el("div", { class: "cc-effect-card" }, [
      UI.el("div", { class: "cc-effect-desc" }, item.desc || ""),
      item.effect ? UI.el("div", { class: "cc-effect-value" }, item.effect) : null,
    ]) : null;

    const nameInput = UI.el("input", {
      class: "cc-input", type: "text", value: state.name, placeholder: "이름을 입력하세요",
      maxlength: 12, oninput: e => state.name = e.target.value,
    });
    const personality = selectedOption(GameData.PERSONALITIES, state.personality);
    const style = selectedOption(styleOptions(), state.playStyle);
    const trait = selectedOption(GameData.TRAIT_OPTIONS, state.trait);
    const weakness = selectedOption(weaknessOptions(), state.weakness);
    const primaryLabel = group() === "pitcher" ? "투수 희망 보직" : "주 포지션";

    const contents = [
      UI.el("div", { class: "cc-fixed-hero" }, [
        UI.el("div", { class: "cc-fixed-title" }, "주인공 외형은 고정됩니다"),
        UI.el("div", { class: "cc-fixed-desc" }, "교복·평상복·훈련복·리그별 유니폼과 경기 동작 이미지는 장면에 따라 자동으로 바뀝니다."),
      ]),
      section("이름", nameInput),
      section("성격", pickerRow(GameData.PERSONALITIES, state.personality, v => state.personality = v, p => p.name)),
      detail(personality),
      section("선수 유형", pickerRow([
        { id: "fielder", name: "야수" }, { id: "pitcher", name: "투수" },
      ], state.playerType, v => {
        state.playerType = v;
        state.primaryPos = v === "pitcher" ? "SP" : "SS";
        state.secondaryPos = v === "pitcher" ? "NONE" : "2B";
        normalizeSelections();
      }, x => x.name)),
      section(primaryLabel, pickerRow(primaryOptions(), state.primaryPos, v => {
        state.primaryPos = v;
        normalizeSelections();
      }, p => p.name)),
    ];

    if (group() === "fielder") {
      contents.push(section("부 포지션", pickerRow(secondaryOptions(), state.secondaryPos, v => state.secondaryPos = v, p => p.name)));
      contents.push(UI.el("div", { class: "cc-desc" }, "부포지션은 관련 수비 훈련으로 경험치가 오르며, 출전 경쟁과 드래프트·콜업 평가에 보너스를 줍니다."));
    } else {
      contents.push(UI.el("div", { class: "cc-desc" }, "선발·구원·마무리는 투수의 보직으로 처리됩니다. 이도류 시스템을 추가하기 전까지 야수 부포지션은 선택하지 않습니다."));
    }

    contents.push(
      section("투타 유형", pickerRow(GameData.BAT_THROW, state.batThrow, v => state.batThrow = v)),
      section("플레이 스타일", pickerRow(styleOptions(), state.playStyle, v => state.playStyle = v, x => x.name)),
      detail(style),
      section("초기 특기", pickerRow(GameData.TRAIT_OPTIONS, state.trait, v => state.trait = v, x => x.name)),
      detail(trait),
      section("약점", pickerRow(weaknessOptions(), state.weakness, v => state.weakness = v, x => x.name)),
      detail(weakness),
      UI.el("div", { class: "cc-summary" }, [
        UI.el("div", { class: "cc-summary-title" }, "선택 요약"),
        UI.el("div", { class: "cc-summary-line" }, `${GameData.POSITIONS.find(p => p.id === state.primaryPos)?.name}${state.secondaryPos !== "NONE" ? ` / 부포지션 ${GameData.POSITIONS.find(p => p.id === state.secondaryPos)?.name}` : ""}`),
        UI.el("div", { class: "cc-summary-line" }, `${personality?.name} · ${style?.name} · ${trait?.name}`),
        UI.el("div", { class: "cc-summary-weak" }, `약점: ${weakness?.name}`),
      ])
    );

    root.appendChild(UI.screen("주인공 생성", contents, {
      footer: [
        UI.button("← 타이틀로", () => UI.showTitle(), "btn btn-ghost"),
        UI.button("이 선수로 시작한다", () => {
          if (!state.name.trim()) { UI.toast("이름을 입력해주세요."); return; }
          Game.state = Game.createNewState({ ...state, face: GameData.PROTAGONIST_FACE_ID });
          UI.showHub();
        }, "btn btn-primary"),
      ],
    }));
  }
  render();
};

</script>
<script>
/* js/ui/screens_hub.js */
/* ===================== screens_hub.js =====================
   메인 홈 화면 + 훈련/휴식/학교/관계/SNS/정보 화면.
   모든 화면에는 하단 내비게이션이 항상 존재해 "진행 불가" 상태를 방지한다.
============================================================== */
window.UI = window.UI || {};

UI.NAV_ITEMS = [
  { id: "hub", label: "홈", icon: "🏠", fn: () => UI.showHub() },
  { id: "train", label: "훈련", icon: "🏋️", fn: () => UI.showTrainingMenu() },
  { id: "relations", label: "관계", icon: "💬", fn: () => UI.showRelations() },
  { id: "info", label: "정보", icon: "📊", fn: () => UI.showPlayerInfo() },
  { id: "endings", label: "도감", icon: "📖", fn: () => UI.showCollectionHub() },
  { id: "settings", label: "설정", icon: "⚙️", fn: () => UI.showSettingsScreen() },
];

UI.appendNav = function (root, activeId) {
  root.appendChild(UI.el("div", { class: "bottom-nav" },
    UI.NAV_ITEMS.map(item => UI.el("button", {
      class: "nav-btn" + (item.id === activeId ? " active" : ""),
      onclick: item.fn,
    }, [UI.el("div", { class: "nav-icon" }, item.icon), UI.el("div", { class: "nav-label" }, item.label)]))
  ));
};

function stageLabel(state) { return GameData.STAGES.find(s => s.id === state.player.stageId)?.name || state.player.stageId; }
function recordLine(rec, posGroup) {
  if (posGroup === "pitcher") {
    return `${rec.pGames}경기 ${rec.wins}승 ${rec.losses}패 ${rec.saves}세이브 ${rec.holds}홀드 ${rec.blownSaves}블론 · ${rec.inningsDisplay}이닝 · 방어율 ${rec.era} · WHIP ${rec.whip} · 탈삼진 ${rec.strikeoutsPitched}`;
  }
  return `${rec.games}경기 타율 ${rec.avg} · 출루율 ${rec.obp} · 장타율 ${rec.slg} · OPS ${rec.ops} · ${rec.hr}홈런 ${rec.rbi}타점 ${rec.stolenBases}도루`;
}

UI.statusHeader = function (state) {
  const p = state.player;
  return UI.el("div", { class: "status-header" }, [
    UI.el("div", { class: "status-top" }, [
      UI.el("div", { class: "status-name" }, `${p.name} (${p.age}세)`),
      UI.el("div", { class: "status-date" }, `${p.date.year}년차 ${p.date.month}월 ${p.date.day}일`),
    ]),
    UI.el("div", { class: "status-sub" }, `${p.team} · ${GameData.POSITIONS.find(x => x.id === p.primaryPos)?.name} · ${stageLabel(state)}`),
    UI.el("div", { class: "status-bars" }, [
      UI.statBar("에너지", p.condition.energy, 100, "bar-stamina"),
      UI.statBar("건강", p.condition.health, 100, "bar-health"),
      UI.statBar("사기", p.condition.morale, 100, "bar-morale"),
      UI.statBar("경기 감각", p.condition.gameSense, 100, "bar-sense"),
      UI.statBar("부상 위험", p.condition.injuryRisk, 100, "bar-injury"),
    ]),
  ]);
};

/* ---------------- 메인 허브 ---------------- */
const CAREER_PROGRESS_STAGES = ["draft"];

UI.showHub = function () {
  const state = Game.state;
  if (!state) { UI.showTitle(); return; }

  // 날짜 진행(advancePart) 중 쌓인 알림(시즌 종료, 자동 학년/커리어 전환)을 먼저 순서대로 보여준다.
  // advancePart가 이미 "시즌 종료 -> 전환" 순서로 큐에 쌓아두므로 여기서는 꺼내서 보여주기만 하면 된다.
  if (state.pendingNotices && state.pendingNotices.length > 0) {
    const notice = state.pendingNotices.shift();
    UI.showResultOverlay(notice.title, notice.lines, () => { Game.Save.autosave(state); UI.showHub(); });
    return;
  }

  // 폴백: 어떤 경로로든 advancePart를 거치지 않고 시즌 경계에 도달한 경우를 대비한 안전장치
  if (Game.Season.isSeasonEnd(state) && state.lastSeasonCheck !== state.player.totalDays) {
    state.lastSeasonCheck = state.player.totalDays;
    const summary = Game.Season.finalizeSeason(state);
    if (summary) { UI.showResultOverlay(summary.title, summary.lines, () => { Game.Save.autosave(state); UI.showHub(); }); return; }
  }

  // 핵심 진행 보장: draft/2군/1군/베테랑 단계에서는 career 이벤트를 자동으로 먼저 확인한다.
  // (이 체크가 없으면 드래프트나 콜업처럼 스테이지를 바꾸는 이벤트가 영영 발생하지 않아
  //  플레이어가 해당 단계에 무한히 머무르게 되는 치명적 진행 불능 버그가 생긴다.)
  if (CAREER_PROGRESS_STAGES.includes(state.player.stageId)) {
    const already = state.lastCareerCheck
      && state.lastCareerCheck.day === state.player.totalDays
      && state.lastCareerCheck.part === state.player.date.part;
    if (!already) {
      state.lastCareerCheck = { day: state.player.totalDays, part: state.player.date.part };
      // 드래프트/콜업/방출/트레이드확정/은퇴결심처럼 진행을 좌우하는 핵심 이벤트만 자동 발생시킨다.
      // 에이전트 상담·언론 인터뷰·트레이드 루머 같은 잡다한 커리어 이벤트는 "커리어 관리" 버튼으로만 접근한다.
      const careerEvent = Game.Events.pickRandomEvent(state, "career", ev => ev.autoTrigger === true);
      if (careerEvent) {
        UI.showEventModal(careerEvent, () => { Game.Save.autosave(state); checkGameOverConditions(); UI.showHub(); });
        return;
      }
    }
  }

  if (Game.Time.isGameDay(state) && !state.flags.has("played_today_" + state.player.totalDays)) {
    UI.showGameDayIntro();
    return;
  }

  const root = UI.clear();
  const container = UI.el("div", { class: "app-shell" });
  container.appendChild(UI.statusHeader(state));

  const nextIn = Game.League.nextDirectGameIn(state);
  const comp = GameData.competitionForState(state);
  const schedule = Game.League.ensureSeason(state);
  const nextText = nextIn === null ? "이번 시즌 직접 경기 일정 종료" : nextIn === 0 ? "오늘 경기" : `다음 직접 경기까지 ${nextIn}일`;
  const rankText = schedule.projectedRank ? ` · ${schedule.projectedRank}위` : "";
  const nextEl = UI.el("div", { class: "next-schedule" }, `${comp.name} · ${nextText} · 팀 ${schedule.teamWins}승 ${schedule.teamLosses}패${rankText}`);
  container.appendChild(nextEl);

  const actions = [
    { label: "🏋️ 훈련하기", fn: () => UI.showTrainingMenu() },
    { label: "🛌 휴식하기", fn: () => UI.showRestMenu() },
    { label: "🏫 학교생활", fn: () => UI.doActionCategory("school", "학교에서 하루를 보냈다.") , show: ["ms3","hs1","hs2","hs3"].includes(state.player.stageId) },
    { label: "📋 커리어 관리", fn: () => UI.doActionCategory("career", "특별한 일 없이 하루가 지나갔다."), show: ["pro2","pro1","veteran"].includes(state.player.stageId) },
    { label: "👥 팀 동료·감독", fn: () => UI.doActionCategory("team", "팀원들과 시간을 보냈다.") },
    { label: "👪 가족과의 시간", fn: () => UI.doActionCategory("family", "가족과 시간을 보냈다.") },
    { label: "🤝 친구 만나기", fn: () => UI.doActionCategory("friend", "친구와 시간을 보냈다.") },
    { label: "💌 연애·데이트", fn: () => UI.showRomanceMenu() },
    { label: "📱 SNS 확인", fn: () => UI.doActionCategory("sns", "SNS를 확인했다.") },
    { label: "⏭ 다음 경기까지 넘기기", fn: () => UI.passTime() },
  ].filter(a => a.show !== false);

  container.appendChild(UI.el("div", { class: "action-grid" },
    actions.map(a => UI.button(a.label, a.fn, "btn action-btn"))));

  if (state.flags.size) {
    // 최근 메시지/이벤트 요약 자리 (간단히 최근 로그 몇 개)
  }

  root.appendChild(container);
  UI.appendNav(root, "hub");
};

UI.passTime = function () {
  const state = Game.state;
  const nextIn = Game.League.nextDirectGameIn(state);
  if (nextIn === null) {
    UI.toast("현재 단계에 예정된 직접 경기가 없습니다.");
    return;
  }
  if (nextIn <= 0) {
    UI.showGameDayIntro();
    return;
  }
  for (let i = 0; i < nextIn; i += 1) {
    Game.Time.advancePart(state);
  }
  Game.Save.autosave(state);
  checkGameOverConditions();
  UI.showHub();
};

UI.doActionCategory = function (category, fallbackMsg) {
  const state = Game.state;
  const ev = Game.Events.pickRandomEvent(state, category);
  if (ev) {
    UI.showEventModal(ev, () => { Game.Time.advancePart(state); Game.Save.autosave(state); checkGameOverConditions(); UI.showHub(); });
  } else {
    // 이벤트 풀이 없을 때도 최소한의 변화는 보장
    Game.Events.applyDelta(state, "condition.stress", -2);
    Game.Events.applyDelta(state, "condition.morale", 1);
    UI.toast(fallbackMsg);
    Game.Time.advancePart(state);
    Game.Save.autosave(state);
    checkGameOverConditions();
    UI.showHub();
  }
};

function checkGameOverConditions() {
  const state = Game.state;
  if (state.player.stageId === "retired" || state.flags.has("force_ending")) {
    UI.showEndingScreen();
  }
}

/* ---------------- 훈련 ---------------- */
UI.showTrainingMenu = function () {
  const state = Game.state;
  const root = UI.clear();
  const groups = [["common", "공통 훈련"], ["batter", "타자 훈련"], ["pitcher", "투수 훈련"], ["position", "포지션별 훈련"]];
  const posGroup = GameData.POSITIONS.find(p => p.id === state.player.primaryPos)?.group;
  const content = [];
  groups.forEach(([g, label]) => {
    if (g === "batter" && posGroup === "pitcher") return;
    if (g === "pitcher" && posGroup === "fielder") return;
    const items = GameData.TRAININGS.filter(t => t.group === g);
    content.push(UI.el("div", { class: "group-label" }, label));
    content.push(UI.el("div", { class: "training-list" }, items.map(t =>
      UI.button(`${t.name} (에너지 -${t.energyCost}${t.intensity === "high" ? " · 고강도" : ""})`, () => UI.doTraining(t.id), "btn training-btn"))));
  });
  root.appendChild(UI.screen("훈련 선택", content, { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
  UI.appendNav(root, "train");
};

UI.doTraining = function (trainingId) {
  const state = Game.state;
  const result = Game.Training.perform(state, trainingId);
  if (!result || result.fail) { UI.toast(result?.msg || "훈련을 할 수 없습니다."); return; }
  UI.showResultOverlay(`${result.trainingName} 완료`, result.changeLog, () => {
    // 훈련 중 훈련 관련 이벤트가 나올 수도 있고, 어느 정도 확률로 삶의 다른 일(가족/친구/SNS 등)이
    // 끼어들 수도 있다. 이벤트가 "훈련 메뉴"에 갇혀 있지 않고 자연스럽게 발생하도록 한다.
    const roll = Math.random();
    const ev = roll < 0.55 ? Game.Events.pickRandomEvent(state, "training")
      : roll < 0.8 ? Game.Events.pickAmbientEvent(state)
      : null;
    Game.Time.advancePart(state);
    Game.Save.autosave(state);
    if (ev) UI.showEventModal(ev, () => { checkGameOverConditions(); UI.showHub(); });
    else { checkGameOverConditions(); UI.showHub(); }
  });
};

UI.showRestMenu = function () {
  const root = UI.clear();
  root.appendChild(UI.screen("휴식 선택", [
    UI.el("div", { class: "training-list" }, GameData.RESTS.map(r =>
      UI.button(`${r.name} (에너지 +${r.energyGain})`, () => UI.doRest(r.id), "btn training-btn"))),
  ], { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
  UI.appendNav(root, "train");
};

UI.doRest = function (restId) {
  const state = Game.state;
  const result = Game.Training.rest(state, restId);
  if (!result || result.fail) { UI.toast(result?.msg || "휴식할 수 없습니다."); return; }
  UI.showResultOverlay(`${result.restName} 완료`, result.changeLog, () => {
    const ev = Math.random() < 0.2 ? Game.Events.pickAmbientEvent(state) : null;
    Game.Time.advancePart(state);
    Game.Save.autosave(state);
    if (ev) { UI.showEventModal(ev, () => { checkGameOverConditions(); UI.showHub(); }); return; }
    checkGameOverConditions();
    UI.showHub();
  });
};

/* ---------------- 연애 메뉴 ---------------- */
UI.showRomanceMenu = function () {
  const state = Game.state;
  const root = UI.clear();
  const items = GameData.ROMANCE_CHARS.map(c => {
    const r = state.romance[c.id];
    return UI.el("div", { class: "romance-card" }, [
      UI.el("div", { class: "romance-name" }, `${c.name} · ${c.archetype}`),
