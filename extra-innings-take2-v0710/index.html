<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.7.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===================== style.css =====================
   팔레트: 나이트 스타디움(#12141F, #1B2035) + 앰버 조명(#F2A93B)
   + 유니폼 레드(#D6453D) + 크림 텍스트(#F5EFE6)
   폰트: 타이틀 - Black Han Sans(임팩트 있는 스포츠지 헤드라인 느낌)
        본문 - Noto Sans KR
========================================================= */
:root {
  --bg-deep: #10121c;
  --bg-panel: #1b2035;
  --bg-panel2: #232a45;
  --accent-amber: #f2a93b;
  --accent-red: #d6453d;
  --text-cream: #f5efe6;
  --text-dim: #a9adc4;
  --bar-track: #2a3153;
  --green: #6fcf97;
  --radius: 14px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #1b2035 0%, #10121c 60%);
  color: var(--text-cream);
  font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 74px; }

h1, h2, .display-font { font-family: "Black Han Sans", "Noto Sans KR", sans-serif; letter-spacing: 0.5px; }

button { font-family: inherit; cursor: pointer; }
.btn {
  background: var(--bg-panel2);
  color: var(--text-cream);
  border: 1px solid #333c63;
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 15px;
  font-weight: 600;
  min-height: 46px;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(0.97); }
.btn:hover { background: #2a3153; }
.btn-primary { background: linear-gradient(135deg, var(--accent-amber), #d98b1f); color: #201400; border: none; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-danger { background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); }
.btn-ghost { background: transparent; border: 1px solid #333c63; color: var(--text-dim); }
.btn-lg { width: 100%; font-size: 17px; padding: 16px; }
.btn-sm { font-size: 13px; padding: 8px 12px; min-height: 36px; }
.choice-btn { width: 100%; text-align: left; margin-bottom: 8px; }
.choice-btn.risky { border-color: var(--accent-red); }
.training-btn { text-align: left; }

/* ---------- 타이틀 ---------- */
.title-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; padding: 32px;
  background: linear-gradient(180deg, rgba(214,69,61,0.12), transparent 40%);
}
.title-logo {
  font-family: "Black Han Sans", sans-serif; font-size: 44px; color: var(--accent-amber);
  text-shadow: 3px 3px 0 var(--accent-red); text-align: center; line-height: 1.15;
}
.title-sub { color: var(--text-dim); font-size: 16px; margin-bottom: 28px; }
.title-buttons { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- 화면 공통 ---------- */
.screen { display: flex; flex-direction: column; flex: 1; }
.screen-title {
  font-family: "Black Han Sans", sans-serif; font-size: 22px; padding: 18px 18px 8px;
  color: var(--accent-amber); border-bottom: 2px solid var(--bg-panel2);
}
.screen-body { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.screen-footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--bg-panel2); }
.screen-footer .btn { flex: 1; }
.group-label { font-weight: 700; color: var(--accent-amber); margin-top: 6px; font-size: 14px; }
.group-label-condition { color: #6fb1cf; }
.group-label-growth { color: var(--green); }
.empty-msg { color: var(--text-dim); text-align: center; padding: 30px 0; }
.trait-card { background: var(--bg-panel); border: 1px solid #3a4370; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
.trait-name { font-weight: 700; color: var(--accent-amber); margin-bottom: 3px; }
.trait-desc { color: var(--text-dim); font-size: 13px; }

/* ---------- 캐릭터 생성 ---------- */
.cc-section { margin-bottom: 4px; }
.cc-label { font-weight: 700; margin-bottom: 6px; color: var(--text-cream); }
.cc-desc { color: var(--text-dim); font-size: 13px; margin-bottom: 6px; }
.cc-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333c63; background: var(--bg-panel2); color: var(--text-cream); font-size: 15px; }
.cc-options { display: flex; flex-wrap: wrap; gap: 8px; }
.cc-option {
  background: var(--bg-panel2); border: 1px solid #333c63; color: var(--text-dim);
  border-radius: 20px; padding: 8px 14px; font-size: 13px;
}
.cc-option.selected { background: var(--accent-amber); color: #201400; border-color: var(--accent-amber); font-weight: 700; }

/* ---------- 상태 헤더 ---------- */
.app-shell { display: flex; flex-direction: column; flex: 1; padding: 14px 16px 20px; gap: 14px; }
.status-header { background: var(--bg-panel); border-radius: var(--radius); padding: 14px 16px; }
.status-top { display: flex; justify-content: space-between; align-items: baseline; }
.status-name { font-weight: 800; font-size: 17px; }
.status-date { font-size: 12px; color: var(--text-dim); }
.status-sub { color: var(--accent-amber); font-size: 13px; margin: 4px 0 10px; }
.status-bars { display: flex; flex-direction: column; gap: 6px; }
.stat-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.stat-label { width: 56px; color: var(--text-dim); flex-shrink: 0; }
.stat-bar-track { flex: 1; height: 8px; border-radius: 6px; background: var(--bar-track); overflow: hidden; }
.stat-bar-fill { height: 100%; background: var(--accent-amber); border-radius: 6px; }
.bar-stamina .stat-bar-fill, .stat-bar-fill.bar-stamina { background: var(--green); }
.bar-health .stat-bar-fill, .stat-bar-fill.bar-health { background: #6fb1cf; }
.bar-morale .stat-bar-fill, .stat-bar-fill.bar-morale { background: var(--accent-amber); }
.bar-stress .stat-bar-fill, .stat-bar-fill.bar-stress { background: var(--accent-red); }
.bar-sense .stat-bar-fill, .stat-bar-fill.bar-sense { background: #b48ef0; }
.bar-injury .stat-bar-fill, .stat-bar-fill.bar-injury { background: var(--accent-red); }
.bar-condition .stat-bar-fill, .stat-bar-fill.bar-condition { background: #6fb1cf; }
.bar-growth .stat-bar-fill, .stat-bar-fill.bar-growth { background: var(--green); }
.stat-value { width: 26px; text-align: right; color: var(--text-dim); }

.next-schedule { font-size: 12px; color: var(--text-dim); text-align: center; }

/* ---------- 액션 그리드 ---------- */
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action-btn { font-size: 14px; padding: 16px 10px; text-align: center; }

/* ---------- 하단 내비게이션 ---------- */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
  background: rgba(16,18,28,0.96); backdrop-filter: blur(6px);
  display: flex; border-top: 1px solid var(--bg-panel2); z-index: 40;
}
.nav-btn { flex: 1; background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; }
.nav-btn.active { color: var(--accent-amber); }
.nav-icon { font-size: 18px; }

/* ---------- 오버레이 / 이벤트 ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(8,9,16,0.82); display: flex;
  align-items: flex-end; justify-content: center; z-index: 100; padding: 0;
}
@media (min-width: 640px) { .overlay { align-items: center; } }
.event-box, .result-box {
  background: var(--bg-panel); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
  max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 640px) { .event-box, .result-box { border-radius: 18px; } }
.overlay-scroll { padding: 22px 20px 14px; overflow-y: auto; flex: 1; }
.overlay-sticky-footer {
  padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--bg-panel2); background: var(--bg-panel); flex-shrink: 0;
}
.event-title, .result-title { font-family: "Black Han Sans", sans-serif; font-size: 20px; color: var(--accent-amber); margin-bottom: 10px; }
.event-desc { line-height: 1.55; margin-bottom: 16px; color: var(--text-cream); }
.event-choices { display: flex; flex-direction: column; }
.result-lines { display: flex; flex-direction: column; gap: 6px; }
.result-line { background: var(--bg-panel2); padding: 8px 12px; border-radius: 8px; font-size: 14px; }

/* ---------- 관계/연애 카드 ---------- */
.rel-list { display: flex; flex-direction: column; gap: 10px; }
.rel-card, .romance-card { background: var(--bg-panel); border-radius: 12px; padding: 12px 14px; }
.rel-name, .romance-name { font-weight: 700; margin-bottom: 4px; }
.rel-desc, .romance-role { color: var(--text-dim); font-size: 13px; margin-bottom: 6px; }
.romance-stage { font-size: 12px; color: var(--accent-amber); margin-bottom: 8px; }

/* ---------- 정보 화면 ---------- */
.info-block { background: var(--bg-panel); border-radius: 12px; padding: 12px 14px; line-height: 1.7; font-size: 14px; }

/* ---------- 저장 슬롯 ---------- */
.save-slot { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border-radius: 12px; padding: 12px 14px; gap: 10px; }
.save-slot-name { font-weight: 700; }
.save-slot-date, .save-slot-tag { color: var(--text-dim); font-size: 12px; }
.save-slot-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ---------- 엔딩 ---------- */
.ending-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 30px 22px; gap: 14px; background: linear-gradient(180deg, rgba(242,169,59,0.08), transparent 50%); }
.ending-label { color: var(--text-dim); letter-spacing: 3px; }
.ending-title { font-family: "Black Han Sans", sans-serif; font-size: 26px; color: var(--accent-amber); line-height: 1.3; }
.ending-narrative { line-height: 1.7; color: var(--text-cream); }
.ending-stats { background: var(--bg-panel); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-dim); }
.ending-actions { display: flex; gap: 10px; margin-top: 10px; }
.ending-actions .btn { flex: 1; }
.ending-gallery-card { background: var(--bg-panel); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
.ending-gallery-title { font-weight: 700; }
.ending-gallery-sub { color: var(--text-dim); font-size: 12px; }
.ending-locked-hint { color: var(--text-dim); font-size: 12px; margin-top: 10px; line-height: 1.6; }

/* ---------- 토스트 ---------- */
.toast {
  position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--bg-panel2); color: var(--text-cream); padding: 10px 18px; border-radius: 20px;
  font-size: 13px; opacity: 0; transition: all .25s ease; z-index: 200; border: 1px solid #333c63;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 반응형 세부 조정 ---------- */
@media (max-width: 360px) {
  .title-logo { font-size: 36px; }
  .action-btn { font-size: 13px; padding: 14px 8px; }
}

/* ---------- 캐릭터 생성 v0.7 프로필 효과 표시 ---------- */
.cc-fixed-hero {
  border: 1px solid #36507b; border-radius: 12px; padding: 12px 14px;
  background: linear-gradient(135deg, rgba(52,90,150,.28), rgba(24,31,57,.92));
}
.cc-fixed-title { color: #8fc7ff; font-weight: 800; margin-bottom: 4px; }
.cc-fixed-desc { color: var(--text-dim); font-size: 12px; line-height: 1.55; }
.cc-effect-card {
  margin-top: -7px; border-left: 3px solid var(--accent-amber); border-radius: 6px;
  padding: 9px 11px; background: rgba(255,183,71,.07);
}
.cc-effect-desc { color: var(--text-cream); font-size: 12px; line-height: 1.45; }
.cc-effect-value { color: #ffd285; font-size: 12px; font-weight: 700; line-height: 1.5; margin-top: 3px; }
.cc-summary {
  margin-top: 4px; border: 1px solid #38436c; border-radius: 12px; padding: 12px 14px;
  background: var(--bg-panel);
}
.cc-summary-title { color: var(--accent-amber); font-weight: 800; margin-bottom: 6px; }
.cc-summary-line { color: var(--text-cream); font-size: 13px; line-height: 1.55; }
.cc-summary-weak { color: #ff9898; font-size: 12px; margin-top: 4px; }

</style>
</head>
<body>
<div id="app"></div>

<!-- 데이터 -->
<script>
/* js/data/constants.js */
/* ===================== constants.js =====================
   게임 전역에서 쓰는 상수와 초기값 정의.
   새 상수/밸런스 값을 바꾸고 싶으면 이 파일만 수정하면 됨.
========================================================== */
window.GameData = window.GameData || {};

GameData.SAVE_VERSION = 7;
GameData.SAVE_KEY = "extraInningSaves_v1"; // 기존 세이브 키 유지, 내부 saveVersion으로 마이그레이션
GameData.PROTAGONIST_FACE_ID = "protagonist_main";

GameData.PITCHER_POSITIONS = [
  { id: "SP", name: "선발투수", group: "pitcher" },
  { id: "RP", name: "구원투수", group: "pitcher" },
  { id: "CL", name: "마무리투수", group: "pitcher" },
];
GameData.FIELDER_POSITIONS = [
  { id: "C",  name: "포수", group: "fielder" },
  { id: "1B", name: "1루수", group: "fielder" },
  { id: "2B", name: "2루수", group: "fielder" },
  { id: "3B", name: "3루수", group: "fielder" },
  { id: "SS", name: "유격수", group: "fielder" },
  { id: "LF", name: "좌익수", group: "fielder" },
  { id: "CF", name: "중견수", group: "fielder" },
  { id: "RF", name: "우익수", group: "fielder" },
];
GameData.POSITIONS = [...GameData.PITCHER_POSITIONS, ...GameData.FIELDER_POSITIONS];
GameData.NO_SECONDARY_POSITION = { id: "NONE", name: "없음", group: "none" };

GameData.PERSONALITIES = [
  { id: "hotblood", name: "열혈형", desc: "뒤진 경기와 큰 승부에서 힘을 내지만 흥분과 스트레스가 빠르게 쌓인다.", effect: "접전·열세에서 공격성 상승 / 고위험 선택 시 스트레스 +1", mod: { competitiveness: 8, calmness: -4 } },
  { id: "cool", name: "냉정형", desc: "위험한 상황에서도 흔들림이 적고 실수를 줄이는 타입이다.", effect: "고위험 카드의 삼진·볼넷·장타 허용 위험 감소", mod: { calmness: 8, leadership: -2 } },
  { id: "genius", name: "천재형", desc: "분석과 기술 습득은 빠르지만 반복 훈련을 오래 버티는 성향은 약하다.", effect: "영상·기술·부포지션 습득 +15% / 반복 훈련 효율 저하가 조금 빠름", mod: { baseballIQ: 8, diligence: -4 } },
  { id: "hardworker", name: "노력형", desc: "꾸준한 훈련으로 성장하지만 무리해서 몸을 혹사하기 쉽다.", effect: "모든 훈련 성장 +5% / 훈련 피로 +5%", mod: { diligence: 8, baseballIQ: -2 } },
  { id: "leader", name: "리더형", desc: "동료와 지도자의 신뢰를 얻고 팀 분위기를 끌어올린다.", effect: "출전 경쟁·감독 신뢰·경기 후 팀 사기 보너스", mod: { leadership: 8, calmness: -2 } },
];

GameData.PLAY_STYLE_OPTIONS = {
  fielder: [
    { id: "교타형", name: "교타형", desc: "정확한 컨택과 선구안으로 출루를 만든다.", effect: "컨택 +5, 선구안 +3, 장타 -2 / 관련 훈련 +18% / 단타·볼넷 경향 증가" },
    { id: "장타형", name: "장타형", desc: "삼진 위험을 감수하고 강한 타구를 노린다.", effect: "장타 +6, 배트스피드 +3, 컨택 -3 / 관련 훈련 +20% / 장타·삼진 경향 증가" },
    { id: "수비형", name: "수비형", desc: "수비 범위와 안정적인 포구로 출전 기회를 만든다.", effect: "포구·수비범위·송구 +4, 장타 -2 / 수비 훈련 +20% / 출전 경쟁 보너스" },
    { id: "주력형", name: "주력형", desc: "빠른 발과 주루 판단으로 경기를 흔든다.", effect: "주력 +6, 도루 +5, 장타 -2 / 주루 훈련 +20% / 도루 성공률 증가" },
    { id: "균형형", name: "균형형", desc: "특정 능력에 치우치지 않고 고르게 성장한다.", effect: "주요 타격·수비 훈련 전체 +8% / 뚜렷한 페널티 없음" },
  ],
  pitcher: [
    { id: "파워피처형", name: "파워피처형", desc: "강한 구속과 구위로 타자를 압도한다.", effect: "구속 +6, 구위 +5, 제구 -3 / 관련 훈련 +20% / 탈삼진·볼넷 경향 증가" },
    { id: "제구형", name: "제구형", desc: "정교한 제구로 볼넷을 줄이고 긴 이닝을 만든다.", effect: "제구 +7, 멘탈 +3, 구속 -2 / 관련 훈련 +20% / 볼넷 허용 감소" },
    { id: "기교형", name: "기교형", desc: "변화구와 완급 조절, 견제로 승부한다.", effect: "변화구 +6, 견제 +4, 구속 -2 / 관련 훈련 +20% / 변화구 카드 강화" },
    { id: "땅볼유도형", name: "땅볼유도형", desc: "낮은 공과 코너워크로 장타를 억제한다.", effect: "제구 +4, 변화구 +4, 구위 +2 / 관련 훈련 +16% / 홈런 억제·범타 증가" },
    { id: "균형형", name: "균형형", desc: "구속·제구·변화구를 고르게 다듬는다.", effect: "주요 투수 훈련 전체 +8% / 뚜렷한 페널티 없음" },
  ],
};
GameData.PLAY_STYLES = [...new Set([...GameData.PLAY_STYLE_OPTIONS.fielder, ...GameData.PLAY_STYLE_OPTIONS.pitcher].map(x => x.id))];

GameData.TRAIT_OPTIONS = [
  { id: "클러치 본능", name: "클러치 본능", desc: "접전·후반·고위험 승부에서 결과 확률이 좋아진다.", effect: "접전 상황에서 유효 결과 확률 상승" },

    fielderTrainingIds: ["contact_tr", "power_tr", "eye_tr", "vs_breaking_tr", "baserun_tr", "steal_tr", "field_tr", "throw_tr", "catcher_lead", "catcher_block", "infield_tr", "outfield_tr", "dp_tr"],

GameData.TRAIT_EFFECTS = {

GameData.WEAKNESS_EFFECTS = {

  "제구 난조": { pitcherWalkWeight: 0.030, pitcherHbpWeight: 0.008 },
  "주자 있을 때 흔들림": { runnersOnAdverseWeight: 0.030 },
};

GameData.SECONDARY_POS_TRAINING_BONUS = {
  C: ["catcher_lead", "catcher_block", "throw_tr"],
  "1B": ["infield_tr", "field_tr"],
  "2B": ["infield_tr", "dp_tr", "field_tr"],

};
GameData.TRAINING_POSITION_MAP = {
  catcher_lead: ["C"], catcher_block: ["C"],
  infield_tr: ["1B", "2B", "3B", "SS"], dp_tr: ["2B", "SS"],
  outfield_tr: ["LF", "CF", "RF"], throw_tr: ["C", "3B", "SS", "RF"],
  field_tr: ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"],
};

GameData.profileGroupForPosition = function (posId) {
  return GameData.POSITIONS.find(p => p.id === posId)?.group === "pitcher" ? "pitcher" : "fielder";
};
GameData.profileOption = function (collection, id, group) {
  const list = group ? collection[group] : collection;
  return (list || []).find(x => x.id === id) || null;
};
GameData.validPlayStyle = function (posId, styleId) {
  const group = GameData.profileGroupForPosition(posId);
  return !!GameData.profileOption(GameData.PLAY_STYLE_OPTIONS, styleId, group);
};
GameData.validWeakness = function (posId, weaknessId) {
  const group = GameData.profileGroupForPosition(posId);
  return !!GameData.profileOption(GameData.WEAKNESS_OPTIONS, weaknessId, group);
};
GameData.normalizeProfileChoices = function (player) {
  const group = GameData.profileGroupForPosition(player.primaryPos);
  if (group === "pitcher") player.secondaryPos = "NONE";
  if (group === "fielder") {
    const validSecondary = player.secondaryPos === "NONE" || GameData.FIELDER_POSITIONS.some(p => p.id === player.secondaryPos && p.id !== player.primaryPos);
    if (!validSecondary) player.secondaryPos = "NONE";
  }
  if (!GameData.validPlayStyle(player.primaryPos, player.playStyle)) player.playStyle = GameData.PLAY_STYLE_OPTIONS[group][0].id;
  if (!GameData.validWeakness(player.primaryPos, player.weakness)) player.weakness = GameData.WEAKNESS_OPTIONS[group][0].id;
  if (!GameData.TRAITS.includes(player.trait)) player.trait = GameData.TRAITS[0];
  if (!GameData.PERSONALITIES.some(p => p.id === player.personality)) player.personality = GameData.PERSONALITIES[0].id;
  player.face = GameData.PROTAGONIST_FACE_ID;
  return player;
};

GameData.applyProfileInitialMods = function (state) {
  const p = state.player;
  if (p.profileInitialApplied) return;
  GameData.normalizeProfileChoices(p);
  const apply = (path, amount) => {
    const keys = path.split(".");
    let cur = p;
    for (let i = 0; i < keys.length - 1; i++) cur = cur[keys[i]];
    const key = keys[keys.length - 1];
    cur[key] = GameData.CLAMP((cur[key] ?? 0) + amount, 0, 100);
  };
  const style = GameData.PLAYSTYLE_PROFILES[p.playStyle];
  Object.entries(style?.initial || {}).forEach(([path, value]) => apply(path, value));
  const trait = GameData.TRAIT_EFFECTS[p.trait];
  Object.entries(trait?.initial || {}).forEach(([path, value]) => apply(path, value));
  p.profileInitialApplied = true;
};

GameData.profileTrainingMultiplier = function (state, trainingId) {
  const p = state.player;
  let mult = 1;
  const style = GameData.PLAYSTYLE_PROFILES[p.playStyle];
  if (style) {
    const group = GameData.profileGroupForPosition(p.primaryPos);
    const ids = style.trainingIds || (group === "pitcher" ? style.pitcherTrainingIds : style.fielderTrainingIds) || [];
    if (ids.includes(trainingId)) mult *= style.trainingMult || 1;
  }
  const personality = GameData.PERSONALITY_EFFECTS[p.personality];
  if (personality?.trainingMult && (!personality.trainingIds || personality.trainingIds.includes(trainingId))) mult *= personality.trainingMult;
  const trait = GameData.TRAIT_EFFECTS[p.trait];
  if (trait?.trainingMult && (!trait.trainingIds || trait.trainingIds.includes(trainingId))) mult *= trait.trainingMult;
  const weakness = GameData.WEAKNESS_EFFECTS[p.weakness];
  if (weakness?.trainingMult && weakness.trainingIds?.includes(trainingId)) mult *= weakness.trainingMult;
  const secondaryIds = GameData.SECONDARY_POS_TRAINING_BONUS[p.secondaryPos] || [];
  if (secondaryIds.includes(trainingId)) mult *= 1.15;
  return mult;
};

GameData.positionExperienceGain = function (state, trainingId) {
  const p = state.player;
  const group = GameData.profileGroupForPosition(p.primaryPos);
  let mult = 1;
  mult *= GameData.PERSONALITY_EFFECTS[p.personality]?.positionExpMult || 1;
  mult *= GameData.TRAIT_EFFECTS[p.trait]?.positionExpMult || 1;
  const gains = [];
  const mapped = GameData.TRAINING_POSITION_MAP[trainingId] || [];
  if (group === "pitcher") {
    if (["velocity_tr", "control_tr", "breaking_tr", "stuff_tr", "form_tr", "pickoff_tr", "crisis_tr", "bullpen_tr", "lowerbody_tr"].includes(trainingId)) gains.push([p.primaryPos, 1 * mult]);
  } else {
    if (["contact_tr", "power_tr", "eye_tr", "vs_breaking_tr", "bunt_tr", "baserun_tr", "steal_tr"].includes(trainingId)) gains.push([p.primaryPos, 0.5 * mult]);
    if (mapped.includes(p.primaryPos)) gains.push([p.primaryPos, 1 * mult]);
    if (p.secondaryPos !== "NONE" && mapped.includes(p.secondaryPos)) gains.push([p.secondaryPos, 0.75 * mult]);
  }
  return gains;
};

GameData.secondaryUtilityBonus = function (state) {
  const p = state.player;
  if (p.secondaryPos === "NONE" || GameData.profileGroupForPosition(p.primaryPos) === "pitcher") return 0;
  const exp = p.positionExp?.[p.secondaryPos] || 0;
  if (exp >= 70) return 0.07;
  if (exp >= 45) return 0.05;
  if (exp >= 20) return 0.025;
  return 0.01;
};

GameData.lineupProfileBonus = function (state) {
  const p = state.player;
  return (GameData.PLAYSTYLE_PROFILES[p.playStyle]?.lineupBonus || 0)
    + (GameData.PERSONALITY_EFFECTS[p.personality]?.lineupBonus || 0)
    + GameData.secondaryUtilityBonus(state);
};

<script>
/* js/systems/state.js */
/* ===================== state.js =====================
   게임 상태(state) 생성/보관을 담당.
   window.Game.state 가 현재 플레이 중인 세이브 데이터의 단일 소스.
======================================================= */
window.Game = window.Game || {};

Game.createNewState = function (charOptions) {
  const GD = GameData;

  const battingStats = {};
  GD.BATTING_STATS.forEach(k => battingStats[k] = 25 + Math.floor(Math.random() * 10));
  const pitchingStats = {};
  GD.PITCHING_STATS.forEach(k => pitchingStats[k] = 20 + Math.floor(Math.random() * 10));
  const pitchTypes = {};
  GD.PITCH_TYPES.forEach(k => pitchTypes[k] = 10 + Math.floor(Math.random() * 10));

  // 포지션에 따라 초기 능력치 보정
  const posGroup = GD.POSITIONS.find(p => p.id === charOptions.primaryPos)?.group;
  if (posGroup === "pitcher") {
    pitchingStats.velocity += 10; pitchingStats.control += 8;
  } else {
    battingStats.contact += 10; battingStats.power += 6;
  }

  const relationships = {};
  GD.NPCS.forEach(n => relationships[n.id] = GD.newRelationship());
  // 부모는 기본 애정 있는 상태로 시작
  relationships.mother.affinity = 40; relationships.mother.trust = 40;
  relationships.father.affinity = 30; relationships.father.trust = 30;
  relationships.sister.affinity = 45; relationships.sister.trust = 40;
  relationships.friend_min.affinity = 50; relationships.friend_min.trust = 45;
  relationships.coach_kim.trust = 40; // 감독 신뢰의 단일 원본

  const romance = {};
  GD.ROMANCE_CHARS.forEach(c => romance[c.id] = GD.newRomance());

  const personalityMod = GD.PERSONALITIES.find(p => p.id === charOptions.personality)?.mod || {};
  // 장기 성장 능력치 (훈련으로 서서히 변하는 값). 이전 버전에는 여기에 confidence/focus/health/
  // fatigue/stress/morale까지 중복으로 들어있었는데, 그건 전부 아래 condition으로 옮겼다.
  const physical = {
    stamina: 30, physical: 30, flexibility: 30, injuryResistance: 30,
    competitiveness: 50, calmness: 50, diligence: 50, leadership: 40, baseballIQ: 45,
  };
  Object.entries(personalityMod).forEach(([k, v]) => { if (physical[k] !== undefined) physical[k] += v; });

  const state = {
    saveVersion: GD.SAVE_VERSION,
    createdAt: Date.now(),
    flags: new Set(),
    seenEvents: {},   // eventId -> lastDay (숫자, 쿨다운 판정용)
    endingHistory: [],       // 발견한 엔딩 목록 (엔딩 도감)
    encounteredCharacters: {}, // 현재 회차에서 만난 인물과 해금 단계
    lastCareerCheck: null,
    lastSeasonCheck: null,
    pendingNotices: [], // 날짜 진행 중 발생한 시즌종료/자동전환 알림을 순서대로 보여주기 위한 큐
    storyMemory: [],         // 장기적으로 기억해야 할 중요한 선택들 {day, stageId, text}
    relationshipHistory: [], // 관계에서 발생한 주요 사건 로그 {day, npcId, text}
    eventHistory: [],        // 발생한 이벤트 id 로그 (중복/도감 검증용)
    careerHistory: [],       // 커리어 단계/소속 변화 로그 {day, from, to, team}
    achievements: [],        // 수상/기록 관련 업적
    awards: [],              // 시즌별 개인상
    injuries: [],            // 부상 이력 {day, type, severity}
    teamHistory: [],         // 소속팀 변경 이력 {day, team}

    relationships,
    romance,
    school: { grade: 60, attendance: 90 },
    player: {
      name: charOptions.name || "무명",
      face: GD.PROTAGONIST_FACE_ID,
      personality: charOptions.personality,

      playStyle: charOptions.playStyle,
      trait: charOptions.trait,
      weakness: charOptions.weakness,

      age: 15,
      stageId: "ms3",
      team: "은성중학교 야구부",
      school: "은성중학교",

      date: { year: 1, month: 3, day: 1, part: 0 }, // part: 0 오전 1 오후 2 저녁
      totalDays: 0,
      stageStartDay: 0,      // 현재 스테이지(학년/커리어 단계)에 진입한 시점의 totalDays
      seasonStartDay: 0,     // 현재 시즌이 시작된 시점의 totalDays
      stageEntrySeasons: {}, // 각 스테이지에 처음 진입했을 때의 currentSeason 기록 (예: pro1 진입 시즌)

      stats: { batting: battingStats, pitching: pitchingStats, pitches: pitchTypes, physical },
      positionExp: Object.fromEntries(GD.POSITIONS.map(p => [p.id, p.id === charOptions.primaryPos ? 30 : ((charOptions.secondaryPos && charOptions.secondaryPos !== "NONE" && p.id === charOptions.secondaryPos) ? 10 : 0)])),

      seasonSegments: [],       // 같은 시즌 내 리그/레벨/팀별 기록 분리
      competition: { id: "middle", levelId: "MS", leagueName: "중학 야구" },
      schedule: null,           // LeagueEngine이 시즌별로 생성
      scheduleSegments: [],     // 콜업/강등/이적 전후 팀 일정·성적 분리
      careerStatus: {
        proSeasons: 0, serviceYears: 0, callups: 0, demotions: 0, releases: 0,
        independentSeasons: 0, overseasSeasons: 0, lastDecision: null,
      },

      trainingCounts: {},  // 훈련 id별 누적 횟수 (특성 해금 조건)
      recentTrainings: [], // 최근 수행한 훈련 id 목록 (과훈련 판정용, 최대 5개 유지)
      traits: [],          // 해금한 훈련 특성 id 목록
      activeInjury: null,  // 현재 진행 중인 부상 {type, severity, daysRemaining, statPenalty, recurrenceRisk}
    },
  };
  // 캐릭터 생성 선택의 초기 능력치 보정은 딱 한 번만 적용한다.
  // 구버전 세이브를 불러올 때 중복 적용되지 않도록 profileInitialApplied 플래그를 사용한다.
  if (GD.applyProfileInitialMods) GD.applyProfileInitialMods(state);

  // 회차 시작 시 기본적으로 이미 알고 있는 가족/친구만 도감에 등록한다.
  if (Game.Meta) {
    Game.Meta.beginPlaythrough();
    ["mother", "father", "sister", "friend_min"].forEach(id => Game.Meta.discoverCharacter(state, id, { level: 1, route: "start" }));
  }
  return state;
};

// dot-path getter/setter helpers used across systems
Game.getPath = function (obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
};
Game.setPath = function (obj, path, value) {
  const keys = path.split(".");
  let cur = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (cur[keys[i]] === undefined) cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length - 1]] = value;
};

// 타자+투수 세부 기록을 모두 담는 완전한 기록 셰이프.
// 시즌 기록(player.season)과 통산 기록(player.record) 모두 이 구조를 공유한다.
GameData.newRecord = function () {
  return {
    games: 0, plateAppearances: 0, atBats: 0, runs: 0, hits: 0, doubles: 0, triples: 0, hr: 0, rbi: 0,
    walks: 0, hbp: 0, strikeouts: 0, stolenBases: 0, caughtStealing: 0, sacrificeBunts: 0, sacrificeFlies: 0, gdp: 0,
    avg: 0, obp: 0, slg: 0, ops: 0,
    pGames: 0, pStarts: 0, wins: 0, losses: 0, saves: 0, holds: 0, blownSaves: 0, noDecisions: 0, battersFaced: 0,
    outsRecorded: 0, inningsPitched: 0, inningsDisplay: "0.0",
    hitsAllowed: 0, hrAllowed: 0, walksAllowed: 0, hbpAllowed: 0, strikeoutsPitched: 0,
    runsAllowed: 0, earnedRuns: 0, era: 0, whip: 0, k9: 0, bb9: 0,
    clutchHits: 0, durability: 0,
  };
};

// 기록에 저장된 모든 수치 필드를 훑어 NaN/undefined/null을 0으로 되돌린다.
// (오래된 세이브를 불러오거나, 계산 도중 실수로 깨진 값이 들어와도 화면에 NaN이 뜨지 않게 하는 안전장치)
GameData.sanitizeRecord = function (rec) {
  const base = GameData.newRecord();
  Object.keys(base).forEach(k => {
    if (typeof base[k] === "number") {
      const v = rec[k];
      rec[k] = (typeof v === "number" && !Number.isNaN(v) && Number.isFinite(v)) ? v : 0;
    } else if (typeof rec[k] !== "string") {
      rec[k] = base[k];
    }
  });
  return rec;
};

// 타율/출루율/장타율/OPS, 방어율/WHIP처럼 누적치로부터 계산해야 하는 값들을 다시 산출한다.
GameData.recalcRates = function (rec) {
  rec.avg = rec.atBats > 0 ? Math.round((rec.hits / rec.atBats) * 1000) / 1000 : 0;
  // OBP = (H+BB+HBP) / (AB+BB+HBP+SF). 희생번트(SH)는 분모에 포함하지 않는다.
  const obpDenom = rec.atBats + rec.walks + rec.hbp + rec.sacrificeFlies;
  rec.obp = obpDenom > 0 ? Math.round(((rec.hits + rec.walks + rec.hbp) / obpDenom) * 1000) / 1000 : 0;
  const totalBases = (rec.hits - rec.doubles - rec.triples - rec.hr) + rec.doubles * 2 + rec.triples * 3 + rec.hr * 4;
  rec.slg = rec.atBats > 0 ? Math.round((totalBases / rec.atBats) * 1000) / 1000 : 0;
  rec.ops = Math.round((rec.obp + rec.slg) * 1000) / 1000;

  const actualInnings = rec.outsRecorded / 3;
  rec.era = actualInnings > 0 ? Math.round((rec.earnedRuns * 9 / actualInnings) * 100) / 100 : 0;
  rec.whip = actualInnings > 0 ? Math.round(((rec.walksAllowed + rec.hitsAllowed) / actualInnings) * 100) / 100 : 0;
  rec.k9 = rec.outsRecorded > 0 ? Math.round((rec.strikeoutsPitched * 27 / rec.outsRecorded) * 100) / 100 : 0;
  rec.bb9 = rec.outsRecorded > 0 ? Math.round((rec.walksAllowed * 27 / rec.outsRecorded) * 100) / 100 : 0;
  const fullInnings = Math.floor(rec.outsRecorded / 3);
  const remainingOuts = rec.outsRecorded % 3;
  rec.inningsPitched = Number(`${fullInnings}.${remainingOuts}`);
  rec.inningsDisplay = `${fullInnings}.${remainingOuts}`;
  return rec;
};

Game.state = null; // 현재 활성 세이브

</script>
<script>
/* js/systems/save.js */
/* ===================== save.js =====================
   localStorage 기반 저장/불러오기.
   - 슬롯: auto (자동저장 1개) + slot1~slot5 (수동저장 5개)
   - 버전 마이그레이션: migrate() 체인으로 과거 세이브를 최신 구조로 변환
   - 손상된 세이브를 불러와도 게임 전체가 멈추지 않도록 안전 복구한다.
====================================================== */
window.Game = window.Game || {};

GameData.SAVE_VERSION = 7; // v7: 고정 주인공 외형, 프로필 실효성, 포지션별 생성 구조

Game.Save = (function () {
  const KEY = GameData.SAVE_KEY;

  function readAll() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      console.error("세이브 데이터를 읽는 중 오류", e);
      return {};
    }
  }
  function writeAll(all) {
    try {
      localStorage.setItem(KEY, JSON.stringify(all));
      return true;
    } catch (e) {
      console.error("저장 실패", e);
      return false;
    }
  }

  function serialize(state) {
    const clone = JSON.parse(JSON.stringify(state, (k, v) => (v instanceof Set ? Array.from(v) : v)));
    clone.flags = Array.from(state.flags);
    return clone;
  }

  // deserialize는 실패해도 예외를 던지지 않고 {ok:false, error} 형태로 반환한다.
  function deserialize(raw) {
    try {
      const state = migrate(raw);
      state.flags = new Set(state.flags || []);
      sanitizeState(state);
      return { ok: true, state };
    } catch (e) {
      console.error("세이브 복구 실패", e);
      return { ok: false, error: e.message || String(e) };
    }
  }

  // 목록에 있는 필드가 없으면 기본값을 채워 넣는다. (요청된 신규 필드 전체 커버)
  function ensureTopLevelFields(s) {
    const defaults = {
      endingHistory: [], unlockedEndings: undefined, // 구버전 호환용, 아래에서 병합
      lastCareerCheck: null, lastSeasonCheck: null, pendingNotices: [],
      storyMemory: [], relationshipHistory: [], eventHistory: [],
      careerHistory: [], achievements: [], awards: [], injuries: [], teamHistory: [],
      currentSeason: 1, encounteredCharacters: {},
      seenEvents: {}, flags: [],
    };
    Object.entries(defaults).forEach(([k, v]) => {
      if (s[k] === undefined) s[k] = v;
    });
    // 구버전에는 unlockedEndings라는 이름을 썼었다 -> endingHistory로 통합
    if (Array.isArray(s.unlockedEndings) && s.unlockedEndings.length && s.endingHistory.length === 0) {
      s.endingHistory = s.unlockedEndings;
    }
    delete s.unlockedEndings;
  }

  const CONDITION_DEFAULTS = {
    energy: 70, health: 80, fatigue: 20, morale: 55, stress: 25,
    trustCoach: 40, teamStanding: 30, confidence: 50, focus: 50, gameSense: 50, injuryRisk: 15,
  };
  const PHYSICAL_GROWTH_DEFAULTS = {
    stamina: 30, physical: 30, flexibility: 30, injuryResistance: 30,
    competitiveness: 50, calmness: 50, diligence: 50, leadership: 40, baseballIQ: 45,
  };
  // 예전 stats.physical에 잘못 섞여 있던 "자원/상태" 필드들(에너지는 stamina라는 이름으로,
  // 그 외에는 condition과 완전히 동일한 이름으로 중복 저장되어 있었다) 정리용 목록.
  const STRAY_CONDITION_KEYS_IN_PHYSICAL = ["health", "fatigue", "injuryRisk", "confidence", "focus", "stress", "morale"];

  function ensurePlayerFields(p) {
    if (!p.record) p.record = GameData.newRecord();
    else GameData.sanitizeRecord(p.record);
    if (!p.season) p.season = GameData.newRecord();
    else GameData.sanitizeRecord(p.season);
    if (!p.seasonHistory) p.seasonHistory = [];
    if (!p.seasonSegments) p.seasonSegments = [];
    if (!p.competition || typeof p.competition !== "object") {
      const compId = GameData.STAGE_COMPETITION[p.stageId] || "highschool";
      const comp = GameData.COMPETITIONS[compId] || GameData.COMPETITIONS.highschool;
      p.competition = { id: comp.id, levelId: comp.levelId, leagueName: comp.name };
    }
    if (!p.careerStatus || typeof p.careerStatus !== "object") p.careerStatus = {};
    const careerDefaults = { proSeasons: 0, serviceYears: 0, callups: 0, demotions: 0, releases: 0, independentSeasons: 0, overseasSeasons: 0, lastDecision: null };
    Object.entries(careerDefaults).forEach(([k,v]) => { if (p.careerStatus[k] === undefined) p.careerStatus[k] = v; });
    if (p.schedule !== null && typeof p.schedule !== "object") p.schedule = null;
    if (!Array.isArray(p.scheduleSegments)) p.scheduleSegments = [];
    if (typeof p.money !== "number" || Number.isNaN(p.money)) p.money = 10;
    if (!p.fame) p.fame = { baseball: 5, fan: 2, public: 0, team: 20, media: 10, sns: 0 };
    ["baseball", "fan", "public", "team", "media", "sns"].forEach(k => {
      if (typeof p.fame[k] !== "number" || Number.isNaN(p.fame[k])) p.fame[k] = 0;
    });

    // ---- 자원/상태(condition) 마이그레이션 ----
    if (!p.condition) p.condition = {};
    // 구버전에는 "현재 행동 자원"이 condition.stamina라는 이름이었다. energy로 옮긴다.
    if (typeof p.condition.stamina === "number" && typeof p.condition.energy !== "number") {
      p.condition.energy = p.condition.stamina;
    }
    delete p.condition.stamina;
    Object.entries(CONDITION_DEFAULTS).forEach(([k, def]) => {
      if (typeof p.condition[k] !== "number" || Number.isNaN(p.condition[k])) p.condition[k] = def;
    });

    // ---- 장기 성장 능력치(stats.physical) 마이그레이션 ----
    if (!p.stats) p.stats = { batting: {}, pitching: {}, pitches: {}, physical: {} };
    if (!p.stats.physical) p.stats.physical = {};
    STRAY_CONDITION_KEYS_IN_PHYSICAL.forEach(k => { delete p.stats.physical[k]; });
    Object.entries(PHYSICAL_GROWTH_DEFAULTS).forEach(([k, def]) => {
      if (typeof p.stats.physical[k] !== "number" || Number.isNaN(p.stats.physical[k])) p.stats.physical[k] = def;
    });
    if (!p.stats.batting) p.stats.batting = {};
    if (!p.stats.pitching) p.stats.pitching = {};
    if (!p.stats.pitches) p.stats.pitches = {};
    GameData.BATTING_STATS.forEach(k => { if (typeof p.stats.batting[k] !== "number" || Number.isNaN(p.stats.batting[k])) p.stats.batting[k] = 25; });
    GameData.PITCHING_STATS.forEach(k => { if (typeof p.stats.pitching[k] !== "number" || Number.isNaN(p.stats.pitching[k])) p.stats.pitching[k] = 20; });
    GameData.PITCH_TYPES.forEach(k => { if (typeof p.stats.pitches[k] !== "number" || Number.isNaN(p.stats.pitches[k])) p.stats.pitches[k] = 10; });

    if (p.activeInjury !== null && typeof p.activeInjury !== "object") p.activeInjury = null;
    if (p.activeInjury && (typeof p.activeInjury.daysRemaining !== "number" || Number.isNaN(p.activeInjury.daysRemaining))) p.activeInjury = null;

    // ---- 훈련 특성 시스템 필드 ----
    if (!p.trainingCounts) p.trainingCounts = {};
    if (!p.recentTrainings) p.recentTrainings = [];
    if (!p.traits) p.traits = [];

    if (!p.positionExp) p.positionExp = {};
    GameData.POSITIONS.forEach(pos => { if (typeof p.positionExp[pos.id] !== "number" || Number.isNaN(p.positionExp[pos.id])) p.positionExp[pos.id] = 0; });

    // ---- v7 캐릭터 생성 프로필 ----
    p.face = GameData.PROTAGONIST_FACE_ID;
    if (p.secondaryPos === undefined || p.secondaryPos === null) p.secondaryPos = "NONE";
    if (GameData.normalizeProfileChoices) GameData.normalizeProfileChoices(p);
    // 기존 플레이 데이터에는 초기 보정을 소급 적용하지 않는다. 새 게임은 state.js에서 true로 설정된다.
    if (p.profileInitialApplied === undefined) p.profileInitialApplied = true;

    // ---- 경과일수 기반 시간 구조 필드 (구버전엔 없었음 - 모듈로 연산 기반 근사치로 보정) ----
    if (typeof p.stageStartDay !== "number" || Number.isNaN(p.stageStartDay)) {
      p.stageStartDay = Math.floor((p.totalDays || 0) / GameData.STAGE_LENGTH_DAYS) * GameData.STAGE_LENGTH_DAYS;
    }
    if (typeof p.seasonStartDay !== "number" || Number.isNaN(p.seasonStartDay)) {
      p.seasonStartDay = Math.floor((p.totalDays || 0) / GameData.SEASON_LENGTH_DAYS) * GameData.SEASON_LENGTH_DAYS;
    }
    if (!p.stageEntrySeasons || typeof p.stageEntrySeasons !== "object") p.stageEntrySeasons = {};
  }

  function sanitizeState(state) {
    if (!state.player || typeof state.player !== "object" || typeof state.player.stageId !== "string") {
      throw new Error("선수 데이터가 손상되어 복구할 수 없습니다.");
    }
    ensureTopLevelFields(state);
    if (!state.encounteredCharacters || typeof state.encounteredCharacters !== "object") state.encounteredCharacters = {};
    if (!state.relationships) state.relationships = {};
    GameData.NPCS.forEach(n => { if (!state.relationships[n.id]) state.relationships[n.id] = GameData.newRelationship(); });
    if (!state.romance) state.romance = {};
    GameData.ROMANCE_CHARS.forEach(c => {
      if (!state.romance[c.id]) { state.romance[c.id] = GameData.newRomance(); return; }
      const defaults = GameData.newRomance();
      Object.entries(defaults).forEach(([k, v]) => {
        if (state.romance[c.id][k] === undefined) state.romance[c.id][k] = v;
      });
    });
    ensurePlayerFields(state.player);
    // 감독 신뢰의 단일 원본은 relationships.coach_kim.trust다. 구버전 condition 값은 최초 1회 병합한다.
    const coach = state.relationships.coach_kim;
    if (coach) {
      if (typeof coach.trust !== "number") coach.trust = state.player.condition.trustCoach || 40;
      state.player.condition.trustCoach = coach.trust;
    }
    return state;
  }

  // 버전 마이그레이션 체인. 새 버전이 추가되면 여기에 단계별로 이어붙인다.
  function migrate(raw) {
    let s = raw;
    if (!s.saveVersion || s.saveVersion < 1) {
      s.saveVersion = 1;
      if (!s.unlockedEndings) s.unlockedEndings = [];
      if (!s.seenEvents) s.seenEvents = {};
    }
    if (s.saveVersion < 2) {
      // v1 -> v2: 시즌 기록 분리, 장기기억/이력 필드, 커리어 진행 체크 필드 추가
      sanitizeState(s);
      s.saveVersion = 2;
    }
    if (s.saveVersion < 3) {
      // v2 -> v3: condition.stamina(자원) -> condition.energy로 개명,
      // stats.physical에서 중복 저장되던 자원성 필드 제거, 장기 성장 능력치(스태미너/피지컬/
      // 유연성/부상내성) 신설, 훈련 특성 시스템 필드 추가. 실제 이전 로직은 ensurePlayerFields에 있다.
      sanitizeState(s);
      s.saveVersion = 3;
    }
    if (s.saveVersion < 4) {
      // v3 -> v4: 부상 엔진(activeInjury) 필드, 확장된 기록 필드(득점/병살/타자상대수/K9/BB9/노디시전) 보강
      sanitizeState(s);
      s.saveVersion = 4;
    }
    if (s.saveVersion < 5) {
      // v4 -> v5: 학년/시즌 길이를 45/90일 압축 배속에서 달력 1년(360일)로 재조정,
      // stageStartDay/seasonStartDay/stageEntrySeasons(모듈로 대신 경과일수 기반 시간 구조),
      // 연애 스키마에 rivalry/stress 필드 추가. ensurePlayerFields/sanitizeState가 처리한다.
      sanitizeState(s);
      s.saveVersion = 5;
    }
    if (s.saveVersion < 6) {
      // v5 -> v6: 시즌 내 팀/레벨별 기록 세그먼트, 리그 일정, 커리어 상태, 회차 인물 발견 기록.
      if (s.relationships?.coach_kim && typeof s.player?.condition?.trustCoach === "number") {
        s.relationships.coach_kim.trust = s.player.condition.trustCoach;
      }
      sanitizeState(s);
      s.saveVersion = 6;
    }
    if (s.saveVersion < 7) {
      // v6 -> v7: 얼굴 선택 제거, 주인공 외형 고정, 투수/야수별 스타일·약점 정규화,
      // 부포지션 NONE 도입. 기존 능력치에는 신규 초기 보정을 소급하지 않는다.
      if (s.player) {
        s.player.face = GameData.PROTAGONIST_FACE_ID;
        s.player.profileInitialApplied = true;
      }
      sanitizeState(s);
      s.saveVersion = 7;
    }
    sanitizeState(s);
    s.saveVersion = GameData.SAVE_VERSION;
    return s;
  }

  return {
    // 세이브/불러오기와 무관하게, 런타임 중에도 상태를 방어적으로 정규화할 때 쓴다.
    // (예: 하루가 지날 때마다 호출해 NaN/undefined가 슬금슬금 섞여드는 것을 막는다)
    normalizeState(state) {
      try { sanitizeState(state); } catch (e) { console.error("상태 정규화 실패", e); }
      return state;
    },
    saveToSlot(slotId, state, meta) {
      const all = readAll();
      all[slotId] = { data: serialize(state), meta: meta || {}, savedAt: Date.now() };
      return writeAll(all);
    },
    // 반환값: {ok:true, state} 또는 {ok:false, error}
    loadFromSlot(slotId) {
      const all = readAll();
      const entry = all[slotId];
      if (!entry) return { ok: false, error: "해당 슬롯에 저장된 데이터가 없습니다." };
      return deserialize(entry.data);
    },
    deleteSlot(slotId) {
      const all = readAll();
      delete all[slotId];
      return writeAll(all);
    },
    listSlots() {
      const all = readAll();
      return Object.entries(all).map(([id, entry]) => ({
        id,
        savedAt: entry.savedAt,
        meta: entry.meta,
      })).sort((a, b) => b.savedAt - a.savedAt);
    },
    hasAnySave() {
      const all = readAll();
      return Object.keys(all).length > 0;
    },
    autosave(state) {
      const meta = {
        name: state.player.name,
        stage: GameData.STAGES.find(x => x.id === state.player.stageId)?.name || state.player.stageId,
        date: `${state.player.date.year}년차 ${state.player.date.month}월 ${state.player.date.day}일`,
      };
      return this.saveToSlot("auto", state, meta);
    },
  };
})();

</script>
<script>
/* js/systems/metaProgress.js */
/* ===================== metaProgress.js =====================
   회차 세이브와 분리된 메타 진행 데이터.
   새 게임을 시작해도 인물 도감/엔딩/CG 발견 기록은 유지된다.
============================================================== */
window.Game = window.Game || {};

Game.Meta = (function () {
  const KEY = "extraInningsMeta_v1";
  const defaults = () => ({ version: 1, playthroughs: 0, characters: {}, endings: {}, gallery: {}, achievements: {} });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return Object.assign(defaults(), raw ? JSON.parse(raw) : {});
    } catch (e) {
      console.warn("메타 진행 데이터 복구 실패", e);
      return defaults();
    }
  }
  function save(meta) {
    try { localStorage.setItem(KEY, JSON.stringify(meta)); return true; }
    catch (e) { console.warn("메타 진행 저장 실패", e); return false; }
  }
  function discoverCharacter(state, characterId, context = {}) {
    if (!characterId) return null;
    const meta = load();
    const now = state?.player?.totalDays || 0;
    const entry = meta.characters[characterId] || {
      discovered: false, level: 0, firstSeenAt: null, encounters: 0,
      events: [], endings: [], gallery: [], routes: [],
    };
    entry.discovered = true;
    entry.level = Math.max(entry.level || 0, context.level || 1);
    entry.firstSeenAt = entry.firstSeenAt || { day: now, stageId: state?.player?.stageId || null };
    entry.encounters = (entry.encounters || 0) + 1;
    if (context.eventId && !entry.events.includes(context.eventId)) entry.events.push(context.eventId);
    if (context.route && !entry.routes.includes(context.route)) entry.routes.push(context.route);
    meta.characters[characterId] = entry;
    save(meta);
    if (state) {
      state.encounteredCharacters = state.encounteredCharacters || {};
      state.encounteredCharacters[characterId] = Math.max(state.encounteredCharacters[characterId] || 0, entry.level);
    }
    return entry;
  }
  function recordCharacterEnding(characterId, endingId) {
    const meta = load();
    const entry = meta.characters[characterId] || { discovered: true, level: 1, encounters: 0, events: [], endings: [], gallery: [], routes: [] };
    if (!entry.endings.includes(endingId)) entry.endings.push(endingId);
    entry.level = Math.max(entry.level || 0, 3);
    meta.characters[characterId] = entry;
    save(meta);
  }
  function collectionProgress() {
    const meta = load();
    const total = GameData.CHARACTER_REGISTRY.length;
    const discovered = GameData.CHARACTER_REGISTRY.filter(c => meta.characters[c.id]?.discovered).length;
    return { total, discovered, ratio: total ? discovered / total : 0, meta };
  }
  function beginPlaythrough() {
    const meta = load(); meta.playthroughs += 1; save(meta); return meta.playthroughs;
  }
  return { KEY, load, save, discoverCharacter, recordCharacterEnding, collectionProgress, beginPlaythrough };
})();

</script>
<script>
/* js/systems/eventEngine.js */
/* ===================== eventEngine.js =====================
   이벤트 후보 선정, 조건/쿨다운 판정, 선택 효과 적용을 전담.
   모든 이벤트는 반드시 최소 하나 이상의 상태 변화를 일으킨다 (13. 준수).
============================================================= */
window.Game = window.Game || {};

Game.Events = (function () {
  const ALL_EVENTS = [...GameData.EVENTS_GENERAL, ...GameData.EVENTS_ROMANCE];
  const CLAMPED_PATHS = new Set([
    ...GameData.BATTING_STATS.map(k => "stats.batting." + k),
    ...GameData.PITCHING_STATS.map(k => "stats.pitching." + k),
    ...GameData.PITCH_TYPES.map(k => "stats.pitches." + k),
    ...GameData.PHYSICAL_STATS.map(k => "stats.physical." + k),
    ...GameData.CONDITION_STATS.map(k => "condition." + k),
    "fame.baseball", "fame.fan", "fame.public", "fame.team", "fame.media", "fame.sns",
    "school.grade", "school.attendance",
  ]);

  function isRelPath(path) { return path.startsWith("relationships."); }
  function isRomancePath(path) { return path.startsWith("romance."); }
  // "school.grade"/"school.attendance"는 state.player.school(선수 소속 학교 이름 문자열)이 아니라
  // state.school(성적/출석 데이터 객체)을 가리킨다. 예전에는 이 구분이 없어서 state.player.school
  // 이라는 문자열에 .grade를 대입하려다 조용히 실패하고 있었다.
  function isSchoolStatPath(path) { return path === "school.grade" || path === "school.attendance"; }

  function applyDelta(state, path, delta) {
    if (path.endsWith(".add") || path.endsWith(".remove")) return; // flags 별도 처리
    // 감독 신뢰는 relationships.coach_kim.trust를 단일 원본으로 사용한다.
    if (path === "condition.trustCoach") { Game.Careers.addCoachTrust(state, Number(delta) || 0); return; }
    if (path === "relationships.coach_kim.trust") { Game.Careers.addCoachTrust(state, Number(delta) || 0); return; }
    if (isRomancePath(path) && path.endsWith(".stage")) {
      Game.setPath(state.romance, path.replace("romance.", ""), delta);
      return;
    }
    if (path === "stageId") { Game.Careers.transitionStage(state, delta, {}); return; }
    if (path === "team") { Game.Careers.changeTeam(state, delta); return; }
    const base = isSchoolStatPath(path) ? state.school
      : isRelPath(path) ? state.relationships
      : (isRomancePath(path) ? state.romance : state.player);
    const key = isSchoolStatPath(path) ? path.replace("school.", "")
      : isRelPath(path) ? path.replace("relationships.", "")
      : (isRomancePath(path) ? path.replace("romance.", "") : path);
    const current = Game.getPath(base, key);
    if (typeof delta === "string" || typeof delta === "boolean") {
      // 팀/학교명 같은 문자열 필드, isPublic 같은 boolean 플래그는 값 자체를 직접 대입한다
      // (수치 누적이 아니라 값 교체).
      Game.setPath(base, key, delta);
    } else if (typeof current === "number") {
      let next = current + delta;
      const clampKey = isRelPath(path) || isRomancePath(path) ? null : path;
      if (clampKey && CLAMPED_PATHS.has(clampKey)) next = GameData.CLAMP(next);
      else if (isRelPath(path) || isRomancePath(path)) next = GameData.CLAMP(next, -100, 100);
      Game.setPath(base, key, next);
    } else if (current === undefined) {
      Game.setPath(base, key, delta);
    }
  }

  function applyEffects(state, effects) {
    const changeLog = [];
    const entries = Object.entries(effects || {});
    // team/school을 먼저 반영해야, 뒤이어 stageId를 처리할 때 careerHistory에 올바른 소속명이 기록된다.
    const rank = ([k]) => (k === "team" || k === "school") ? 0 : (k === "stageId" ? 1 : 2);
    entries.sort((a, b) => rank(a) - rank(b));
    entries.forEach(([path, val]) => {
      if (path === "flags.add") {
        val.forEach(f => { if (!state.flags.has(f)) { state.flags.add(f); changeLog.push(`새 스토리 플래그 획득: ${f}`); } });
        return;
      }
      if (path === "injuryTrigger") {
        const injury = Game.Injuries.trigger(state, val);
        changeLog.push(`부상 발생: ${injury.type} (${injury.severity === "major" ? "중상" : "경상"}, 회복까지 약 ${injury.daysRemaining}일)`);
        return;
      }
      if (path === "flags.remove") {
        val.forEach(f => state.flags.delete(f));
        return;
      }
      const before = path === "stageId" ? state.player.stageId
        : isSchoolStatPath(path) ? Game.getPath(state.school, path.replace("school.", ""))
        : path === "team" || path === "school" ? Game.getPath(state.player, path)
        : isRelPath(path) ? Game.getPath(state.relationships, path.replace("relationships.", ""))
        : isRomancePath(path) ? Game.getPath(state.romance, path.replace("romance.", ""))
        : Game.getPath(state.player, path);
      applyDelta(state, path, val);
      const after = path === "stageId" ? state.player.stageId
        : isSchoolStatPath(path) ? Game.getPath(state.school, path.replace("school.", ""))
        : path === "team" || path === "school" ? Game.getPath(state.player, path)
        : isRelPath(path) ? Game.getPath(state.relationships, path.replace("relationships.", ""))
        : isRomancePath(path) ? Game.getPath(state.romance, path.replace("romance.", ""))
        : Game.getPath(state.player, path);
      if (typeof before === "number" && typeof after === "number" && before !== after) {
        const diff = after - before;
        changeLog.push(`${labelFor(path)} ${diff > 0 ? "+" : ""}${diff}`);
      } else if (path === "stageId" && before !== after) {
        const stageName = id => GameData.STAGES.find(x => x.id === id)?.name || id;
        changeLog.push(`커리어 단계: ${stageName(before)} → ${stageName(after)}`);
      } else if ((path === "team" || path === "school") && before !== after) {
        changeLog.push(`${path === "team" ? "소속팀" : "소속 학교"}: ${before} → ${after}`);
      } else if (typeof after === "string" && path.endsWith("stage")) {
        changeLog.push(`관계 진행: ${after}`);
        const charId = path.split(".")[1];
        state.relationshipHistory.push({ day: state.player.totalDays, charId, from: before, to: after });
      }
    });
    return changeLog;
  }

  function labelFor(path) {
    const parts = path.split(".");
    const last = parts[parts.length - 1];
    if (GameData.STAT_LABELS[last]) {
      if (path.startsWith("relationships.")) {
        const npc = GameData.NPCS.find(n => n.id === parts[1]);
        return `${npc ? npc.name : parts[1]} ${GameData.STAT_LABELS[last] || last}`;
      }
      return GameData.STAT_LABELS[last];
    }
    const map = {
      money: "돈", grade: "성적", attendance: "출석", stamina: "체력", health: "건강",
      fatigue: "피로", morale: "사기", stress: "스트레스", trustCoach: "감독 신뢰",
      teamStanding: "팀 내 입지", confidence: "자신감", focus: "집중력", injuryRisk: "부상 위험",
      baseball: "야구계 평가", fan: "팬 인기", public: "대중 인지도", team: "팀 평판",
      media: "언론 평판", sns: "SNS 평판", affinity: "친밀도", trust: "신뢰", respect: "존경",
      rivalry: "경쟁심", favor: "호감", conflict: "갈등", jealousy: "질투", dependence: "의존",
      memory: "추억", affection: "호감도", excitement: "설렘", intimacy: "친밀",
      sharedMemory: "공동 추억", valuesMatch: "가치관 일치",
    };
    if (path.startsWith("relationships.")) {
      const npc = GameData.NPCS.find(n => n.id === parts[1]);
      return `${npc ? npc.name : parts[1]} ${map[last] || last}`;
    }
    if (path.startsWith("romance.")) {
      const c = GameData.ROMANCE_CHARS.find(n => n.id === parts[1]);
      return `${c ? c.name : parts[1]} ${map[last] || last}`;
    }
    return map[last] || last;
  }

  function eligible(state, category, filterFn) {
    const today = state.player.totalDays;
    return ALL_EVENTS.filter(ev => {
      if (category && ev.category !== category) return false;
      if (filterFn && !filterFn(ev)) return false;
      if (ev.once && state.flags.has("done_" + ev.id)) return false;
      const last = state.seenEvents[ev.id];
      if (last !== undefined && (today - last) < (ev.cooldown || 0)) return false;
      try { return ev.cond ? ev.cond(state) : true; } catch (e) { return false; }
    });
  }

  function pickRandomEvent(state, category, filterFn) {
    const pool = eligible(state, category, filterFn);
    if (pool.length === 0) return null;
    const totalWeight = pool.reduce((sum, e) => sum + (e.weight || 5), 0);
    let r = Math.random() * totalWeight;
    for (const ev of pool) {
      r -= (ev.weight || 5);
      if (r <= 0) return ev;
    }
    return pool[pool.length - 1];
  }

  function resolveChoice(state, event, choiceIdx) {
    const choice = event.choices[choiceIdx];
    state.seenEvents[event.id] = state.player.totalDays;
    if (event.once) state.flags.add("done_" + event.id);
    const changeLog = applyEffects(state, choice.effects);
    state.eventHistory.push({ day: state.player.totalDays, id: event.id, choice: choiceIdx });
    // 이벤트 데이터에 characterIds가 없어도 관계/연애 효과가 발생한 인물을 자동 발견 처리한다.
    const discovered = new Set(event.characterIds || []);
    Object.keys(choice.effects || {}).forEach(path => {
      if (path.startsWith("relationships.")) discovered.add(path.split(".")[1]);
      if (path.startsWith("romance.")) discovered.add(path.split(".")[1]);
    });
    discovered.forEach(id => Game.Meta?.discoverCharacter(state, id, { level: 1, eventId: event.id, route: state.player.stageId }));
    if (event.memorable) {
      state.storyMemory.push({ day: state.player.totalDays, stageId: state.player.stageId, text: choice.result });
    }
    return { text: choice.result, changeLog, risky: !!choice.risky };
  }

  // 특수 키(별도 처리되는 것들)는 경로 검증에서 제외한다.
  const SPECIAL_EFFECT_KEYS = new Set(["flags.add", "flags.remove", "injuryTrigger", "stageId"]);

  // 모든 이벤트의 모든 선택지에 있는 effects 경로가 실제 상태 스키마(state)에 존재하는
  // 숫자/문자열 필드를 가리키는지 검사한다. dot-path가 중간에 존재하지 않는 객체를 지나가거나,
  // 최종적으로 숫자/문자열이 아닌 곳(혹은 undefined인데 특수 케이스가 아닌 곳)을 가리키면 문제로 보고한다.
  function validateAllEffectPaths(sampleState) {
    const problems = [];
    ALL_EVENTS.forEach(ev => {
      (ev.choices || []).forEach((choice, idx) => {
        Object.entries(choice.effects || {}).forEach(([path, val]) => {
          if (SPECIAL_EFFECT_KEYS.has(path)) return;
          if (isRomancePath(path) && path.endsWith(".stage")) return; // 문자열 상태값, 별도 처리
          if (path === "team" || path === "school") return; // 문자열 대입 필드
          const base = isSchoolStatPath(path) ? sampleState.school
            : isRelPath(path) ? sampleState.relationships
            : (isRomancePath(path) ? sampleState.romance : sampleState.player);
          const key = isSchoolStatPath(path) ? path.replace("school.", "")
            : isRelPath(path) ? path.replace("relationships.", "")
            : (isRomancePath(path) ? path.replace("romance.", "") : path);
          const current = Game.getPath(base, key);
          if (typeof current !== "number" && typeof current !== "string" && typeof current !== "boolean") {
            problems.push({ eventId: ev.id, choiceIndex: idx, path, resolvedType: typeof current });
          }
        });
      });
    });
    return problems;
  }

  // 특정 "행동 메뉴"를 통해서만 이벤트가 나오면 오히려 이벤트가 아니라 메뉴 뽑기처럼 느껴진다.
  // 그래서 훈련/휴식/시간 흘려보내기 같은 평범한 행동 중에도 다른 카테고리(학교/팀/가족/친구/SNS/부상)
  // 이벤트가 자연스럽게 끼어들 수 있도록 하는 "앰비언트" 이벤트 풀이다.
  const AMBIENT_CATEGORIES = ["school", "team", "family", "friend", "sns", "injury"];

  function pickAmbientEvent(state) {
    const candidates = AMBIENT_CATEGORIES.filter(cat => eligible(state, cat).length > 0);
    if (candidates.length === 0) return null;
    const category = candidates[Math.floor(Math.random() * candidates.length)];
    return pickRandomEvent(state, category);
  }

  return { ALL_EVENTS, applyEffects, applyDelta, eligible, pickRandomEvent, pickAmbientEvent, resolveChoice, labelFor, validateAllEffectPaths };
})();

</script>
<script>
/* js/systems/training.js */
/* ===================== training.js =====================
   훈련/휴식 실행 로직 (엔진). 데이터는 js/data/training_data.js 참고.

   핵심 원칙:
   - 결과는 항상 "현재 자원(에너지/건강/근육피로/부상위험)"과
     "장기 성장(스태미너/피지컬/유연성/부상내성/각 야구 능력치)"을 분리해서 보여준다.
   - 능력치가 높을수록 성장이 느려진다 (GameData.growthDifficultyMultiplier).
   - 같은 훈련을 반복하면 효율이 떨어지고 부상 위험이 커진다 (과훈련).
   - 훈련을 충분히 반복하면 특성(Trait)을 얻어 플레이 스타일이 생긴다.
========================================================== */
window.Game = window.Game || {};

Game.Training = (function () {
  function randIn([min, max]) { return min + Math.random() * (max - min); }

  function traitEffect(state, type) {
    return GameData.TRAINING_TRAITS.filter(t => state.player.traits.includes(t.id) && t.effect.type === type);
  }

  function energyCostMultiplier(state) {
    const traits = traitEffect(state, "energyCostMult");
    return traits.reduce((mult, t) => mult * t.effect.value, 1);
  }

  function growthBonusMultiplier(state, trainingId) {
    const traits = traitEffect(state, "growthBonus").filter(t => t.effect.trainingIds.includes(trainingId));
    return traits.reduce((mult, t) => mult * t.effect.mult, 1);
  }

  function injuryRiskTrainingMultiplier(state) {
    const traits = traitEffect(state, "injuryRiskReduction");
    return traits.reduce((mult, t) => mult * (t.effect.trainingRiskMult ?? 1), 1);
  }

  // 최근 수행한 훈련 목록에서 같은 훈련이 몇 번이나 반복됐는지 (과훈련 판정)
  function recentRepeatCount(state, trainingId) {
    return state.player.recentTrainings.filter(id => id === trainingId).length;
  }

  function pushRecent(state, trainingId) {
    const rt = state.player.recentTrainings;
    rt.push(trainingId);
    while (rt.length > 5) rt.shift();
  }

  function checkTraitUnlocks(state, trainingId) {
    const unlocked = [];
    GameData.TRAINING_TRAITS.forEach(t => {
      if (t.trainingId !== trainingId) return;
      if (state.player.traits.includes(t.id)) return;
      if ((state.player.trainingCounts[trainingId] || 0) < t.threshold) return;
      state.player.traits.push(t.id);
      const eff = t.effect;
      if (eff.type === "statBonus") {
        Game.Events.applyDelta(state, eff.stat, eff.value);
      } else if (eff.type === "statBonusMulti") {
        eff.stats.forEach(([path, val]) => Game.Events.applyDelta(state, path, val));
      } else if (eff.type === "injuryRiskReduction") {
        Game.Events.applyDelta(state, "condition.injuryRisk", eff.flatBonus);
      }
      unlocked.push(t);
    });
    return unlocked;
  }

  // 캐릭터 생성 프로필의 훈련 효과는 profileEffects.js를 단일 기준으로 사용한다.
  function profileTrainingMultiplier(state, trainingId) {
    return GameData.profileTrainingMultiplier ? GameData.profileTrainingMultiplier(state, trainingId) : 1;
  }

  function perform(state, trainingId) {
    const t = GameData.TRAININGS.find(x => x.id === trainingId);
    if (!t) return null;
    const p = state.player;

    if (p.condition.energy < t.energyCost * 0.4) {
      return { fail: true, msg: "에너지가 부족해 제대로 된 훈련을 하기 어렵다. 휴식이 필요하다." };
    }
    if (t.intensity === "high" && p.condition.health < 25) {
      return { fail: true, msg: "건강 상태가 너무 나빠 고강도 훈련은 위험하다. 회복 훈련이나 휴식을 먼저 취하자." };
    }
    if (Game.Injuries.isMajor(state) && t.id !== "recovery_tr" && t.id !== "rehab") {
      return { fail: true, msg: `${p.activeInjury.type} 부상으로 정상적인 훈련이 불가능하다. 회복 훈련이나 재활 훈련만 가능하다.` };
    }
    const injuredEfficiencyPenalty = Game.Injuries.isActive(state) ? 0.6 : 1;
    if (t.moneyCost && p.money < t.moneyCost) {
      return { fail: true, msg: "비용이 부족하다." };
    }

    const repeatCount = recentRepeatCount(state, trainingId);
    const repeatExtra = GameData.PERSONALITY_EFFECTS?.[p.personality]?.repeatPenaltyExtra || 0;
    const overtrainEfficiency = GameData.CLAMP(1 - repeatCount * (0.15 + repeatExtra), 0.35, 1); // 반복할수록 효율 감소
    const overtrainRiskMult = 1 + repeatCount * 0.35; // 반복할수록 부상 위험 증가
    const isOvertrained = repeatCount >= 3;

    const coachQuality = 1 + (state.relationships.coach_lee.trust / 200);
    const facilityMod = 1 + (p.fame.team / 300);
    const conditionMod = GameData.CLAMP((p.condition.focus + p.condition.energy - p.condition.fatigue) / 100, 0.4, 1.6);
    const diligenceMod = 1 + (p.stats.physical.diligence - 50) / 150;
    const energyMult = energyCostMultiplier(state);

    const growthLog = [];
    t.growth.forEach(([path, min, max]) => {
      const currentValue = Game.getPath(p, path);
      const difficulty = GameData.growthDifficultyMultiplier(typeof currentValue === "number" ? currentValue : 50);
      const bonusMult = growthBonusMultiplier(state, trainingId) * profileTrainingMultiplier(state, trainingId);
      const base = randIn([min, max]);
      const total = Math.round(base * difficulty * coachQuality * facilityMod * conditionMod * diligenceMod * overtrainEfficiency * bonusMult * injuredEfficiencyPenalty * 100) / 100;
      if (total !== 0) {
        Game.Events.applyDelta(state, path, total);
        growthLog.push(`[장기성장] ${Game.Events.labelFor(path)} +${total}`);
      }
    });

    const resourceLog = [];
    const energyDelta = -Math.round(t.energyCost * energyMult);
    Game.Events.applyDelta(state, "condition.energy", energyDelta);
    resourceLog.push(`[자원] 에너지 ${energyDelta}`);

    if (t.resource.health) {
      const d = Math.round(randIn(t.resource.health));
      if (d !== 0) { Game.Events.applyDelta(state, "condition.health", d); resourceLog.push(`[상태] 건강 ${d > 0 ? "+" : ""}${d}`); }
    }
    if (t.resource.fatigue) {
      const personalityFatigueMult = GameData.PERSONALITY_EFFECTS?.[p.personality]?.fatigueMult || 1;
      const d = Math.round(randIn(t.resource.fatigue) * (1 + repeatCount * 0.2) * personalityFatigueMult);
      if (d !== 0) { Game.Events.applyDelta(state, "condition.fatigue", d); resourceLog.push(`[상태] 근육 피로 ${d > 0 ? "+" : ""}${d}`); }
    }
    if (t.resource.injuryRisk) {
      const d = Math.round(randIn(t.resource.injuryRisk) * overtrainRiskMult * injuryRiskTrainingMultiplier(state));
      if (d !== 0) { Game.Events.applyDelta(state, "condition.injuryRisk", d); resourceLog.push(`[상태] 부상 위험 ${d > 0 ? "+" : ""}${d}`); }
    }
    if (t.resource.gameSense) {
      const d = Math.round(randIn(t.resource.gameSense));
      if (d !== 0) { Game.Events.applyDelta(state, "condition.gameSense", d); resourceLog.push(`[상태] 경기 감각 ${d > 0 ? "+" : ""}${d}`); }
    }
    if (t.moneyCost) { Game.Events.applyDelta(state, "money", -t.moneyCost); resourceLog.push(`[자원] 돈 -${t.moneyCost}`); }

    // 포지션 경험치: 포지션 훈련은 실제 해당 포지션에만 경험치를 준다.
    // 부포지션은 관련 수비 훈련을 해야 성장하며, 빠른 적응력/천재형 보정도 반영한다.
    const positionGains = GameData.positionExperienceGain ? GameData.positionExperienceGain(state, trainingId) : [];
    positionGains.forEach(([posId, gain]) => {
      p.positionExp[posId] = Math.round(GameData.CLAMP((p.positionExp[posId] || 0) + gain, 0, 100) * 100) / 100;
    });

    p.trainingCounts[trainingId] = (p.trainingCounts[trainingId] || 0) + 1;
    pushRecent(state, trainingId);
    const traitsUnlocked = checkTraitUnlocks(state, trainingId);

    const warnLog = [];
    if (isOvertrained) {
      warnLog.push("⚠ 같은 훈련을 너무 반복해서 효율이 크게 떨어지고 있다. 다른 훈련이나 휴식이 필요해 보인다.");
      Game.Events.applyDelta(state, "relationships.coach_lee.trust", -1);
    }
    traitsUnlocked.forEach(t2 => warnLog.push(`🏅 새로운 특성 획득: [${t2.name}] ${t2.desc}`));

    // 훈련 종료 시 자연 발생 부상 판정 (injuryRisk/근육피로/건강/나이/포지션/부상내성 종합 반영)
    const naturalInjury = Game.Injuries.maybeNaturalInjury(state, { source: "training", intensity: t.intensity });
    if (naturalInjury) {
      warnLog.push(`🚑 부상 발생: ${naturalInjury.type} (${naturalInjury.severity === "major" ? "중상" : "경상"}, 회복까지 약 ${naturalInjury.daysRemaining}일)`);
    }

    return {
      fail: false,
      trainingName: t.name,
      growthLog, resourceLog, warnLog,
      changeLog: [...growthLog, ...resourceLog, ...warnLog],
      naturalInjury,
    };
  }

  function rest(state, restId) {
    const r = GameData.RESTS.find(x => x.id === restId);
    if (!r) return null;
    const p = state.player;
    if (r.moneyCost && p.money < r.moneyCost) return { fail: true, msg: "돈이 부족하다." };

    const restTraitFx = GameData.TRAIT_EFFECTS[p.trait];
    const restEffMult = restTraitFx?.restEfficiencyMult || 1;

    const log = [];
    const energyGain = Math.round(r.energyGain * restEffMult);
    const healthGain = Math.round(r.healthGain * restEffMult);
    Game.Events.applyDelta(state, "condition.energy", energyGain); log.push(`[자원] 에너지 +${energyGain}`);
    Game.Events.applyDelta(state, "condition.fatigue", -r.fatigueLoss); log.push(`[상태] 근육 피로 -${r.fatigueLoss}`);
    Game.Events.applyDelta(state, "condition.health", healthGain); log.push(`[상태] 건강 +${healthGain}`);
    if (r.injuryRiskLoss) { Game.Events.applyDelta(state, "condition.injuryRisk", -r.injuryRiskLoss); log.push(`[상태] 부상 위험 -${r.injuryRiskLoss}`); }
    if (r.gameSenseLoss) { Game.Events.applyDelta(state, "condition.gameSense", -r.gameSenseLoss); log.push(`[상태] 경기 감각 -${r.gameSenseLoss}`); }
    if (r.moneyCost) { Game.Events.applyDelta(state, "money", -r.moneyCost); log.push(`[자원] 돈 -${r.moneyCost}`); }

    // 휴식은 훈련 반복(과훈련) 카운트를 리셋해준다 — 쉬어가는 것도 전략이 되도록.
    state.player.recentTrainings = [];

    return { fail: false, restName: r.name, changeLog: log };
  }

  return { perform, rest, growthDifficultyMultiplier: GameData.growthDifficultyMultiplier, energyCostMultiplier, traitEffect };
})();

</script>
<script>
/* js/systems/leagueEngine.js */
/* ===================== leagueEngine.js =====================
   리그 일정, 직접 플레이 경기, 백그라운드 경기, 팀 성적을 관리한다.
   모든 리그/포지션이 6일마다 한 경기였던 구조를 제거한다.
============================================================== */
window.Game = window.Game || {};

Game.League = (function () {
  function seedFromState(state) {
    const base = Number(state.createdAt || 1) + Number(state.currentSeason || 1) * 1009;
    return Math.abs(Math.floor(base % 2147483647)) || 1;
  }
  function seeded(seed) {
    let x = seed % 2147483647;
    if (x <= 0) x += 2147483646;
    return () => ((x = x * 16807 % 2147483647) - 1) / 2147483646;
  }
  function distributedDays(start, end, count) {
    if (count <= 0) return [];
    if (count === 1) return [Math.round((start + end) / 2)];
    const days = [];
    for (let i = 0; i < count; i++) {
      let d = Math.round(start + (end - start) * (i / (count - 1)));
      while (days.includes(d)) d += 1;
      days.push(d);
    }
    return days;
  }
  function sampleEvenly(items, count, offset = 0) {
    if (count >= items.length) return items.slice();
    if (count <= 0) return [];
    const out = [];
    const step = items.length / count;
    for (let i = 0; i < count; i++) {
      const idx = Math.min(items.length - 1, Math.floor(offset + i * step) % items.length);
      if (!out.includes(items[idx])) out.push(items[idx]);
    }
    for (const item of items) {
      if (out.length >= count) break;
      if (!out.includes(item)) out.push(item);
    }
    return out.sort((a, b) => a - b);
  }
  function roleKey(state) {
    const pos = state.player.primaryPos;
    if (["SP", "RP", "CL"].includes(pos)) return pos;
    return "fielder";
  }
  function buildSchedule(state) {
    const comp = GameData.competitionForState(state);
    const rng = seeded(seedFromState(state));
    const teamGameDays = distributedDays(comp.gameStartDay, comp.gameEndDay, comp.teamGames);
    const target = Math.min(teamGameDays.length, comp.featuredGames[roleKey(state)] || comp.featuredGames.fielder);
    let directGameDays;
    if (roleKey(state) === "SP") {
      // 선발은 5인 로테이션을 기준으로 하되, 중요 경기 위주로 직접 조작한다.
      const rotationSlot = Math.floor(rng() * 5);
      const starts = teamGameDays.filter((_, i) => i % 5 === rotationSlot);
      directGameDays = sampleEvenly(starts.length ? starts : teamGameDays, target, 0);
    } else {
      directGameDays = sampleEvenly(teamGameDays, target, Math.floor(rng() * 2));
    }
    return {
      season: state.currentSeason,
      stageId: state.player.stageId,
      team: state.player.team,
      competitionId: comp.id,
      levelId: comp.levelId,
      seasonStartDay: state.player.seasonStartDay || state.player.totalDays,
      phase: "regular",
      teamGameDays,
      directGameDays,
      results: {},
      teamWins: 0,
      teamLosses: 0,
      playerAppearances: 0,
      backgroundAppearances: 0,
      lastProcessedDay: -1,
      postseasonQualified: false,
      teamStrength: GameData.CLAMP((GameData.TEAM_PROFILES[state.player.team]?.strength || 50) + Math.round((rng() - 0.5) * 16), 28, 82),
      projectedRank: null,
    };
  }
  function ensureSeason(state) {
    const p = state.player;
    const comp = GameData.competitionForState(state);
    const s = p.schedule;
    if (!s || s.season !== state.currentSeason || s.stageId !== p.stageId || s.competitionId !== comp.id || s.seasonStartDay !== p.seasonStartDay) {
      p.schedule = buildSchedule(state);
    }
    return p.schedule;
  }
  function dayInSeason(state, totalDay = state.player.totalDays) {
    return totalDay - (state.player.seasonStartDay || 0);
  }
  function isTeamGameDay(state, day = dayInSeason(state)) {
    return ensureSeason(state).teamGameDays.includes(day);
  }
  function isPlayerGameDay(state, day = dayInSeason(state)) {
    if (["draft", "retired"].includes(state.player.stageId)) return false;
    return ensureSeason(state).directGameDays.includes(day);
  }
  function nextDirectGameIn(state) {
    const schedule = ensureSeason(state);
    const day = dayInSeason(state);
    const next = schedule.directGameDays.find(d => d >= day && !schedule.results[d]);
    return next === undefined ? null : Math.max(0, next - day);
  }
  function opponentFor(state, day = dayInSeason(state)) {
    const comp = GameData.competitionForState(state);
    const labels = comp.id === "highschool"
      ? ["한빛고", "강남고", "동해고", "청룡고", "백산고", "성진고"]
      : comp.id === "middle"
        ? ["한빛중", "강남중", "동해중", "백산중"]
        : comp.id === "independent"
          ? ["블루윙스", "파이오니어스", "레전즈", "드림즈"]
          : ["한빛", "강남", "부산", "대전", "광주", "창원", "수원", "대구", "인천"];
    return labels[Math.abs((day + state.currentSeason * 3) % labels.length)];
  }
  function teamStrength(state) {
    return ensureSeason(state).teamStrength ?? GameData.TEAM_PROFILES[state.player.team]?.strength ?? 50;
  }
  function recordResult(state, day, result) {
    const schedule = ensureSeason(state);
    if (schedule.results[day]) return schedule.results[day];
    const normalized = Object.assign({ won: false, playerAppeared: false, direct: false }, result || {});
    schedule.results[day] = normalized;
    if (normalized.won) schedule.teamWins += 1;
    else schedule.teamLosses += 1;
    if (normalized.playerAppeared) schedule.playerAppearances += 1;
    if (normalized.playerAppeared && !normalized.direct) schedule.backgroundAppearances += 1;
    return normalized;
  }
  function processCompletedDay(state, completedDay) {
    const schedule = ensureSeason(state);
    if (completedDay < 0 || completedDay <= schedule.lastProcessedDay) return null;
    schedule.lastProcessedDay = completedDay;
    if (!schedule.teamGameDays.includes(completedDay) || schedule.results[completedDay]) return null;
    const result = Game.GameSim.simulateBackgroundGame(state, {
      day: completedDay,
      opponent: opponentFor(state, completedDay),
      featured: schedule.directGameDays.includes(completedDay),
    });
    return recordResult(state, completedDay, result);
  }
  function markDirectResult(state, gameState, summary) {
    const day = gameState?.dayInSeason ?? dayInSeason(state);
    return recordResult(state, day, {
      won: !!summary.teamWon,
      playerAppeared: true,
      direct: true,
      score: summary.score,
      opponent: gameState?.opponent || opponentFor(state, day),
    });
  }
  function scheduleSnapshot(schedule) {
    return {
      season: schedule.season, stageId: schedule.stageId, team: schedule.team,
      competitionId: schedule.competitionId, levelId: schedule.levelId,
      wins: schedule.teamWins, losses: schedule.teamLosses,
      playerAppearances: schedule.playerAppearances,
      teamStrength: schedule.teamStrength,
      gamesProcessed: Object.keys(schedule.results || {}).length,
    };
  }
  function finalizeSeason(state) {
    const schedule = ensureSeason(state);
    const comp = GameData.COMPETITIONS[schedule.competitionId];
    const archived = state.player.scheduleSegments || [];
    const scheduleParts = [...archived, scheduleSnapshot(schedule)];
    const totalWins = scheduleParts.reduce((a, x) => a + (x.wins || 0), 0);
    const totalLosses = scheduleParts.reduce((a, x) => a + (x.losses || 0), 0);
    const currentTotal = schedule.teamWins + schedule.teamLosses;
    const currentPct = currentTotal ? schedule.teamWins / currentTotal : 0;
    const rng = seeded(seedFromState(state) + 7919);
    const teamCount = ["middle", "highschool", "independent"].includes(schedule.competitionId) ? 8 : 10;
    const table = [{ name: state.player.team, wins: schedule.teamWins, losses: schedule.teamLosses, pct: currentPct }];
    for (let i = 1; i < teamCount; i++) {
      const strength = GameData.CLAMP(48 + Math.round((rng() - 0.5) * 24), 30, 75);
      const otherPct = GameData.CLAMP(0.50 + (strength - 50) / 120 + (rng() - 0.5) * 0.10, 0.25, 0.75);
      const games = Math.max(currentTotal, comp?.teamGames || currentTotal || 1);
      const wins = Math.round(games * otherPct);
      table.push({ name: `리그 팀 ${i + 1}`, wins, losses: games - wins, pct: wins / games });
    }
    table.sort((a, b) => b.pct - a.pct || b.wins - a.wins);
    const rank = table.findIndex(t => t.name === state.player.team) + 1;
    schedule.projectedRank = rank;
    const cutoff = teamCount >= 10 ? 5 : 4;
    schedule.postseasonQualified = currentTotal >= 10 && rank <= cutoff;
    return {
      competitionId: schedule.competitionId,
      leagueName: comp?.name || schedule.competitionId,
      levelId: schedule.levelId,
      wins: totalWins,
      losses: totalLosses,
      currentTeamWins: schedule.teamWins,
      currentTeamLosses: schedule.teamLosses,
      winPct: Math.round((totalWins / Math.max(1, totalWins + totalLosses)) * 1000) / 1000,
      rank, teamCount, table, segments: scheduleParts,
      postseasonQualified: schedule.postseasonQualified,
      playerAppearances: scheduleParts.reduce((a, x) => a + (x.playerAppearances || 0), 0),
    };
  }
  function onContextChanged(state) {
    const p = state.player;
    if (p.schedule && Object.keys(p.schedule.results || {}).length > 0) {
      p.scheduleSegments = p.scheduleSegments || [];
      p.scheduleSegments.push(scheduleSnapshot(p.schedule));
    }
    p.schedule = null;
    ensureSeason(state);
  }
  return {
    ensureSeason, dayInSeason, isTeamGameDay, isPlayerGameDay, nextDirectGameIn,
    opponentFor, teamStrength, recordResult, processCompletedDay, markDirectResult,
    finalizeSeason, onContextChanged, buildSchedule,
  };
})();

</script>
<script>
/* js/systems/timeSystem.js */
/* ===================== timeSystem.js =====================
   하루 1회 행동, 날짜 전환, 학년 전환, 리그 일정 연결을 담당한다.
============================================================ */
window.Game = window.Game || {};

GameData.STAGE_LENGTH_DAYS = 360;

Game.Time = (function () {
  function currentStageIndex(state) { return GameData.STAGES.findIndex(s => s.id === state.player.stageId); }
  function daysInStage(state) { return state.player.totalDays - (state.player.stageStartDay || 0); }
  function isGameDay(state) {
    return !["draft", "retired"].includes(state.player.stageId)
      && Game.League.isPlayerGameDay(state)
      && !state.player.schedule.results[Game.League.dayInSeason(state)];
  }
  function dailyDecay(state) {
    const p = state.player;
    Game.Events.applyDelta(state, "condition.fatigue", -4);
    Game.Events.applyDelta(state, "condition.stress", -2);
    Game.Events.applyDelta(state, "condition.injuryRisk", -1);
    if (p.condition.fatigue > 70) Game.Events.applyDelta(state, "condition.health", -2);
    // 경기에 오래 나서지 않으면 감각이 서서히 떨어진다.
    if (!p.schedule?.results?.[Game.League.dayInSeason(state) - 1]?.playerAppeared) {
      Game.Events.applyDelta(state, "condition.gameSense", -0.2);
    }
  }
  function advancePart(state) {
    const p = state.player;
    // v0.7.1부터 모든 행동은 하루 전체를 사용한다. 기존 저장의 오전/오후/저녁 값도 0으로 정규화한다.
    p.date.part = 0;

    // 오늘 경기를 끝내지 않고 날짜를 넘긴 경우에는 백그라운드 진행으로 처리한다.
    const completedDay = Game.League.dayInSeason(state);
    if (Game.League.isTeamGameDay(state, completedDay) && !p.schedule.results[completedDay]) {
      Game.League.processCompletedDay(state, completedDay);
    }

    p.date.part = 0;
    p.date.day += 1;
    p.totalDays += 1;
    dailyDecay(state);
    if (p.date.day > 30) { p.date.day = 1; p.date.month += 1; }
    if (p.date.month > 12) { p.date.month = 1; p.date.year += 1; }

    const recovery = Game.Injuries.tick(state);
    if (recovery) {
      state.pendingNotices.push({
        type: "injury", title: "부상 회복",
        lines: [`${recovery.type} 부상에서 회복했다.`, "컨디션을 서서히 끌어올릴 필요가 있다."],
      });
    }

    if (Game.Season.isSeasonEnd(state)) {
      const summary = Game.Season.finalizeSeason(state);
      if (summary) state.pendingNotices.push(summary);
    }
    const transitioned = maybeAdvanceStage(state);
    if (transitioned) {
      const name = id => GameData.STAGES.find(x => x.id === id)?.name || id;
      state.pendingNotices.push({
        type: "stage", title: "새로운 단계",
        lines: [`${name(transitioned)}(으)로 접어들었다.`, `소속: ${p.team}`],
      });
    }
    Game.Save.normalizeState(state);
  }
  function maybeAdvanceStage(state) {
    const p = state.player;
    if (daysInStage(state) < GameData.STAGE_LENGTH_DAYS) return null;
    if (["draft", "pro2", "pro1", "veteran", "retired"].includes(p.stageId)) return null;
    const idx = currentStageIndex(state);
    if (idx < 0 || idx >= GameData.STAGES.length - 1) return null;
    if (p.stageId === "hs3") {
      Game.Careers.transitionStage(state, "draft", { ageDelta: 1, competitionId: "highschool" });
      return "draft";
    }
    const next = GameData.STAGES[idx + 1];
    const opts = { ageDelta: 1 };
    if (next.id === "hs1") { opts.school = "은성고등학교"; opts.team = "은성고등학교 야구부"; opts.competitionId = "highschool"; }
    Game.Careers.transitionStage(state, next.id, opts);
    return next.id;
  }
  return { isGameDay, advancePart, currentStageIndex, dailyDecay, daysInStage };
})();

</script>
<script>
/* js/systems/gameSim.js */
/* ===================== gameSim.js =====================
   카드 선택은 승부 접근법을 정하고, 실제 야구 결과는 능력치·상황·확률표로 산출한다.
   경기 상태(이닝/점수/아웃/주자)를 유지하며 타자·선발·불펜 기록을 현실적인 규모로 보정한다.
========================================================= */
window.Game = window.Game || {};

GameData.BATTER_CARDS = [
  { id: "aggressive", name: "적극적인 스윙", risk: "공격적", statKeys: ["power", "batSpeed"] },
  { id: "contact", name: "컨택 집중", risk: "안정적", statKeys: ["contact", "eye"] },
  { id: "pull_power", name: "장타 노림", risk: "고위험", statKeys: ["power", "batSpeed"] },
