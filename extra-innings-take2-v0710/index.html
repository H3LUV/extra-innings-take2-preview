      UI.el("div", { class: "romance-role" }, c.role),
      UI.el("div", { class: "romance-stage" }, `단계: ${GameData.ROMANCE_OUTCOMES[r.stage]?.name || r.stage}`),
      UI.button("만나러 가기", () => UI.doRomanceVisit(c.id), "btn btn-sm"),
    ]);
  });
  root.appendChild(UI.screen("연애·데이트", items, { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
  UI.appendNav(root, "relations");
};

UI.doRomanceVisit = function (charId) {
  const state = Game.state;
  const pool = Game.Events.eligible(state, "romance").filter(ev => ev.id.includes(`ro_${charId}_`));
  const ev = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  if (ev) {
    UI.showEventModal(ev, () => { Game.Time.advancePart(state); Game.Save.autosave(state); checkGameOverConditions(); UI.showHub(); });
  } else {
    Game.Events.applyDelta(state, `romance.${charId}.affection`, 3);
    UI.toast("함께 시간을 보내며 조금 더 가까워졌다.");
    Game.Time.advancePart(state);
    Game.Save.autosave(state);
    checkGameOverConditions();
    UI.showHub();
  }
};

/* ---------------- 관계 화면 ---------------- */
UI.showRelations = function () {
  const state = Game.state;
  const root = UI.clear();
  const npcCards = GameData.NPCS.map(n => {
    const r = state.relationships[n.id];
    return UI.el("div", { class: "rel-card" }, [
      UI.el("div", { class: "rel-name" }, n.name),
      UI.el("div", { class: "rel-desc" }, n.desc),
      UI.statBar("친밀도", r.affinity + 100, 200),
      UI.statBar("신뢰", r.trust + 100, 200),
    ]);
  });
  root.appendChild(UI.screen("관계도", [
    UI.el("div", { class: "group-label" }, "인간관계"),
    UI.el("div", { class: "rel-list" }, npcCards),
    UI.el("div", { class: "group-label" }, "연애"),
    UI.button("연애 메뉴 열기", () => UI.showRomanceMenu(), "btn"),
  ], { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
  UI.appendNav(root, "relations");
};

/* ---------------- 선수 정보 ---------------- */
UI.showPlayerInfo = function () {
  const state = Game.state;
  const p = state.player;
  const root = UI.clear();
  const battingRows = GameData.BATTING_STATS.map(k => UI.statBar(GameData.STAT_LABELS[k], p.stats.batting[k]));
  const pitchingRows = GameData.PITCHING_STATS.map(k => UI.statBar(GameData.STAT_LABELS[k], p.stats.pitching[k]));
  const physicalRows = GameData.PHYSICAL_STATS.map(k => UI.statBar(GameData.STAT_LABELS[k], p.stats.physical[k], 100, "bar-growth"));
  const conditionRows = GameData.CONDITION_STATS.filter(k => k !== "trustCoach" && k !== "teamStanding")
    .map(k => UI.statBar(GameData.STAT_LABELS[k], p.condition[k], 100, "bar-condition"));
  const posGroup = GameData.POSITIONS.find(x => x.id === p.primaryPos)?.group;

  const traitRows = p.traits.length === 0
    ? [UI.el("div", { class: "empty-msg" }, "아직 해금한 특성이 없다. 같은 훈련을 꾸준히 반복하면 특성을 얻는다.")]
    : p.traits.map(tid => {
        const t = GameData.TRAINING_TRAITS.find(x => x.id === tid);
        return UI.el("div", { class: "trait-card" }, [
          UI.el("div", { class: "trait-name" }, `🏅 ${t.name}`),
          UI.el("div", { class: "trait-desc" }, t.desc),
        ]);
      });

  root.appendChild(UI.screen("선수 정보", [
    UI.el("div", { class: "group-label" }, "기본 정보"),
    UI.el("div", { class: "info-block" }, [
      `이름: ${p.name}`, UI.el("br"), `나이: ${p.age}세`, UI.el("br"),
      `소속: ${p.team}`, UI.el("br"), `리그: ${GameData.competitionForState(state).name} (${p.competition?.levelId || "-"})`, UI.el("br"),
      `주 포지션: ${GameData.POSITIONS.find(x => x.id === p.primaryPos)?.name} (숙련 ${Math.round(p.positionExp?.[p.primaryPos] || 0)})`, UI.el("br"),
      ...(p.secondaryPos && p.secondaryPos !== "NONE" ? [`부 포지션: ${GameData.POSITIONS.find(x => x.id === p.secondaryPos)?.name} (숙련 ${Math.round(p.positionExp?.[p.secondaryPos] || 0)})`, UI.el("br")] : []),
      `성격: ${GameData.PERSONALITIES.find(x => x.id === p.personality)?.name || p.personality}`, UI.el("br"),
      `플레이 스타일: ${p.playStyle}`, UI.el("br"), `초기 특기: ${p.trait}`, UI.el("br"), `약점: ${p.weakness}`, UI.el("br"),
      `자금: ${p.money}00만원`, UI.el("br"),
    ]),
    UI.el("div", { class: "group-label" }, "명성"),
    UI.statBar("야구계 평가", p.fame.baseball), UI.statBar("팬 인기", p.fame.fan),
    UI.statBar("대중 인지도", p.fame.public), UI.statBar("팀 내 평판", p.fame.team),
    UI.statBar("언론 평판", p.fame.media), UI.statBar("SNS 평판", p.fame.sns),
    UI.el("div", { class: "group-label" }, "이번 시즌 기록"),
    UI.el("div", { class: "info-block" }, recordLine(p.season, posGroup)),
    UI.el("div", { class: "group-label" }, "통산 기록"),
    UI.el("div", { class: "info-block" }, recordLine(p.record, posGroup)),
    UI.el("div", { class: "group-label" }, "이번 시즌 소속별 기록"),
    ...((p.seasonSegments || []).length ? p.seasonSegments.map(seg => UI.el("div", { class: "info-block" }, `${seg.leagueName} · ${seg.team} · ${recordLine(seg.record, posGroup)}`)) : [UI.el("div", { class: "empty-msg" }, "아직 기록이 없습니다.")]),
    UI.el("div", { class: "group-label" }, posGroup === "pitcher" ? "투수 능력치" : "타자 능력치"),
    ...(posGroup === "pitcher" ? pitchingRows : battingRows),
    UI.el("div", { class: "group-label group-label-condition" }, "현재 컨디션 (자원 — 매일 소모/회복됨)"),
    ...conditionRows,
    UI.el("div", { class: "group-label group-label-growth" }, "장기 신체 능력치 (훈련으로 서서히 성장)"),
    ...physicalRows,
    UI.el("div", { class: "group-label" }, "보유 특성"),
    ...traitRows,
  ], { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
  UI.appendNav(root, "info");
};

/* ---------------- 설정 ---------------- */
UI.showSettingsScreen = function () {
  const root = UI.clear();
  root.appendChild(UI.screen("설정", [
    UI.button("수동 저장 슬롯 열기", () => UI.showManualSaveSlots(), "btn"),
    UI.button("타이틀로 돌아가기", () => UI.showTitle(), "btn btn-danger"),
    state_debug_ending_button(),
  ], { footer: [UI.button("← 홈으로", () => UI.showHub(), "btn btn-ghost")] }));
  UI.appendNav(root, "settings");
};
function state_debug_ending_button() {
  return UI.button("지금 은퇴하고 엔딩 보기", () => {
    if (confirm("정말로 지금 커리어를 마무리하고 엔딩을 확인하시겠습니까?")) {
      Game.state.flags.add("force_ending");
      UI.showEndingScreen();
    }
  }, "btn btn-ghost");
}

</script>
<script>
/* js/ui/screens_event.js */
/* ===================== screens_event.js =====================
   이벤트 발생 -> 선택 -> 결과(수치 변화 명시) 표시 오버레이
================================================================ */
window.UI = window.UI || {};

UI.showEventModal = function (event, onClose) {
  const state = Game.state;
  const overlay = UI.el("div", { class: "overlay" });
  const box = UI.el("div", { class: "event-box" }, [
    UI.el("div", { class: "overlay-scroll" }, [
      UI.el("div", { class: "event-title" }, event.title),
      UI.el("div", { class: "event-desc" }, event.desc),
      UI.el("div", { class: "event-choices" }, event.choices.map((c, idx) =>
        UI.button(c.text, () => {
          const result = Game.Events.resolveChoice(state, event, idx);
          overlay.remove();
          UI.showResultOverlay(event.title, [result.text, ...result.changeLog], onClose);
        }, "btn choice-btn" + (c.risky ? " risky" : "")))),
    ]),
  ]);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
};

UI.showResultOverlay = function (title, lines, onClose) {
  const overlay = UI.el("div", { class: "overlay" });
  const box = UI.el("div", { class: "result-box" }, [
    UI.el("div", { class: "overlay-scroll" }, [
      UI.el("div", { class: "result-title" }, title),
      UI.el("div", { class: "result-lines" }, lines.filter(Boolean).map(l => UI.el("div", { class: "result-line" }, l))),
    ]),
    UI.el("div", { class: "overlay-sticky-footer" }, [
      UI.button("확인", () => { overlay.remove(); if (onClose) onClose(); }, "btn btn-primary btn-lg"),
    ]),
  ]);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
};

</script>
<script>
/* js/ui/screens_game.js */
/* ===================== screens_game.js =====================
   리그 일정에 의해 잡힌 직접 경기의 라인업/벤치/카드 선택/빠른 진행 UI.
   경기 상태는 Game.GameSim의 inning/score/outs/bases를 그대로 표시한다.
================================================================ */
window.UI = window.UI || {};

const BENCH_ACTIONS = [
  { id: "scout_opp", name: "상대 분석", effects: { "stats.physical.baseballIQ": 2 } },
  { id: "cheer", name: "동료 응원", effects: { "relationships.captain_park.affinity": 3, "condition.morale": 2 } },
  { id: "coach_talk", name: "코치와 대화", effects: { "relationships.coach_kim.trust": 3 } },
  { id: "pinch_ready", name: "대타 준비", role: "batter", effects: { "stats.batting.clutch": 2, "condition.focus": 2 } },
  { id: "field_ready", name: "수비 준비", role: "batter", effects: { "stats.batting.range": 1 } },
  { id: "bullpen_ready", name: "불펜 준비", role: "pitcher", effects: { "stats.pitching.stamina": 1 } },
  { id: "pickoff_watch", name: "주자 견제 타이밍 연구", role: "pitcher", effects: { "stats.pitching.pickoff": 1 } },
  { id: "self_train", name: "개인 훈련", effects: { "stats.physical.diligence": 2, "condition.fatigue": 5 } },
  { id: "observe", name: "팀 분위기 관찰", effects: { "stats.physical.baseballIQ": 1 } },
];

function lineupChance(state) {
  const p = state.player;
  const trust = GameData.CLAMP(Game.Careers.getCoachTrust(state), 0, 100);
  const base = (trust * 0.42 + p.condition.teamStanding * 0.35 + (p.positionExp[p.primaryPos] || 0) * 0.23);
  if (p.primaryPos === "SP") return GameData.CLAMP(base + 35, 75, 99);
  if (p.primaryPos === "RP") return GameData.CLAMP(base + 18, 45, 94);
  if (p.primaryPos === "CL") return GameData.CLAMP(base + 20, 50, 96);
  return GameData.CLAMP(base + 18, 35, 98);
}

UI.showGameDayIntro = function () {
  const state = Game.state;
  state.flags.add("played_today_" + state.player.totalDays);
  UI.renderGameDayIntroBody();
};

UI.renderGameDayIntroBody = function () {
  const state = Game.state;
  const p = state.player;
  const day = Game.League.dayInSeason(state);
  const opponent = Game.League.opponentFor(state, day);

  if (p.activeInjury && p.activeInjury.severity === "major") {
    const root = UI.clear();
    root.appendChild(UI.screen("경기 당일 - 부상자 명단", [
      UI.el("div", { class: "event-desc" }, `오늘 ${opponent}전이 있지만 ${p.activeInjury.type} 부상으로 출전할 수 없다.`),
      UI.el("div", { class: "event-desc" }, `회복까지 약 ${p.activeInjury.daysRemaining}일 남았다.`),
      UI.button("확인", () => {
        const won = Math.random() < 0.5;
        Game.League.recordResult(state, day, { won, playerAppeared: false, direct: true, opponent });
        Game.Time.advancePart(state); Game.Save.autosave(state); UI.showHub();
      }, "btn btn-primary"),
    ]));
    return;
  }

  const selected = Math.random() * 100 < lineupChance(state);
  const pos = p.primaryPos;
  const line = selected
    ? (pos === "SP" ? "오늘 선발투수로 마운드에 오른다."
      : pos === "RP" || pos === "CL" ? "불펜에서 등판 지시가 내려왔다."
      : "오늘 선발 라인업에 이름을 올렸다.")
    : "오늘은 벤치 또는 불펜 대기 명단에서 시작한다.";
  const root = UI.clear();
  root.appendChild(UI.screen("경기 당일", [
    UI.el("div", { class: "event-desc" }, `${p.team} vs ${opponent}`),
    UI.el("div", { class: "event-desc" }, line),
    selected ? UI.button("직접 경기", () => UI.startGameSim({ opponent }), "btn btn-primary") : null,
    selected ? UI.button("빠른 진행", () => UI.quickSimGame({ opponent }), "btn") : null,
    !selected ? UI.button("벤치로 이동", () => UI.showBenchScreen(0, opponent), "btn btn-primary") : null,
  ].filter(Boolean)));
};

UI.showBenchScreen = function (round, opponent) {
  const state = Game.state;
  const root = UI.clear();
  if (round >= 2) {
    const day = Game.League.dayInSeason(state);
    const won = Math.random() < GameData.CLAMP(0.45 + (Game.League.teamStrength(state) - 50) / 120, 0.25, 0.75);
    Game.League.recordResult(state, day, { won, playerAppeared: false, direct: true, opponent });
    Game.Events.applyDelta(state, "condition.teamStanding", won ? 1 : -1);
    root.appendChild(UI.screen("경기 종료", [
      UI.el("div", { class: "event-desc" }, won ? "벤치에서 지켜본 팀은 승리했다." : "팀은 아쉽게 패배했다."),
      UI.button("확인", () => { Game.Time.advancePart(state); Game.Save.autosave(state); UI.showHub(); }, "btn btn-primary"),
    ]));
    return;
  }
  root.appendChild(UI.screen("벤치 대기", [
    UI.el("div", { class: "event-desc" }, "출전하지 못했지만 경기 중 할 수 있는 일을 선택한다."),
    UI.el("div", { class: "training-list" }, BENCH_ACTIONS
      .filter(a => !a.role || a.role === Game.GameSim.role(state))
      .map(a => UI.button(a.name, () => { Game.Events.applyEffects(state, a.effects); UI.showBenchScreen(round + 1, opponent); }, "btn training-btn"))),
  ]));
};

UI.startGameSim = function (options = {}) {
  const state = Game.state;
  const gameState = Game.GameSim.createGameState(state, options);
  UI.renderGameStep(state, [], Game.GameSim.recommendedSteps(state), gameState);
};

UI.quickSimGame = function (options = {}) {
  const state = Game.state;
  const summary = Game.GameSim.quickSimGame(state, options);
  UI.showGameSummary(summary, []);
};

function baseText(game) {
  return `${game.bases[0] ? "1루 ●" : "1루 ○"}  ${game.bases[1] ? "2루 ●" : "2루 ○"}  ${game.bases[2] ? "3루 ●" : "3루 ○"}`;
}

UI.renderGameStep = function (state, results, totalSteps, gameState) {
  gameState = gameState || Game.GameSim.createGameState(state, {});
  const root = UI.clear();
  if (results.length >= totalSteps) {
    const summary = Game.GameSim.finalizeGame(state, results, gameState);
    UI.showGameSummary(summary, results);
    return;
  }
  const cards = Game.GameSim.cardsFor(state, gameState);
  const stepNum = results.length + 1;
  root.appendChild(UI.screen(`경기 진행 (${stepNum}/${totalSteps})`, [
    UI.el("div", { class: "info-block game-scoreboard" }, [
      UI.el("strong", {}, `${gameState.inning}회 · ${gameState.outs} OUT`), UI.el("br"),
      `${state.player.team} ${gameState.score.player} : ${gameState.score.opponent} ${gameState.opponent}`, UI.el("br"),
      baseText(gameState),
    ]),
    UI.el("div", { class: "event-desc" }, Game.GameSim.role(state) === "pitcher" ? "이번 승부에서 어떤 공을 선택할까?" : "이번 타석에서 어떤 접근을 할까?"),
    UI.el("div", { class: "training-list" }, cards.map(c =>
      UI.button(`${c.name} · ${c.risk}`, () => {
        const r = Game.GameSim.simulateStep(state, c.id, gameState);
        results.push(r);
        UI.showResultOverlay(r.success ? "좋은 결과" : "아쉬운 결과", [`${r.text}`, `예상 성공 확률 ${r.chance}%`], () => UI.renderGameStep(state, results, totalSteps, gameState));
      }, "btn training-btn"))),
  ]));
};

UI.showGameSummary = function (summary, results) {
  const state = Game.state;
  const injuryLine = summary.naturalInjury
    ? [`부상 발생: ${summary.naturalInjury.type} (${summary.naturalInjury.severity === "major" ? "중상" : "경상"})`]
    : [];
  const decisionLine = summary.decision ? [`투수 판정: ${summary.decision}`] : [];
  const scoreLine = [`최종 스코어 ${summary.score.player} : ${summary.score.opponent}`];
  const personalLines = summary.personalStats?.lines || [];
  const root = UI.clear();
  root.appendChild(UI.screen("경기 종료", [
    UI.el("div", { class: "event-desc" }, summary.teamWon ? "팀이 승리했다!" : "팀이 패배했다."),
    UI.el("div", { class: "result-lines" }, [...scoreLine, ...personalLines, ...decisionLine, ...injuryLine, ...(results || []).map((r, i) => `${i + 1}. ${r.text}`)]
      .map(x => UI.el("div", { class: "result-line" }, x))),
    UI.button("확인", () => { Game.Time.advancePart(state); Game.Save.autosave(state); UI.showHub(); }, "btn btn-primary"),
  ]));
};

</script>
<script>
/* js/ui/screens_ending.js */
/* ===================== screens_ending.js =====================
   엔딩 계산 결과 표시 + 엔딩 도감 (발견/미발견 구분)
================================================================= */
window.UI = window.UI || {};

UI.showEndingScreen = function () {
  const state = Game.state;
  const ending = Game.EndingEngine.compute(state);
  if (!state.endingHistory.find(e => e.id === ending.id)) {
    state.endingHistory.push(ending);
  }
  const meta = Game.Meta.load();
  meta.endings[ending.id] = { unlocked: true, title: ending.title, unlockedAt: Date.now() };
  Game.Meta.save(meta);
  Game.Save.autosave(state);

  const timelineItems = state.careerHistory.map(h => {
    const name = id => GameData.STAGES.find(x => x.id === id)?.name || id;
    return UI.el("div", { class: "result-line" }, `${h.day}일차 · ${name(h.from)} → ${name(h.to)} (${h.team})`);
  });
  const memoryItems = state.storyMemory.slice(-8).map(m => UI.el("div", { class: "result-line" }, `${m.day}일차 · ${m.text}`));

  const root = UI.clear();
  root.appendChild(UI.el("div", { class: "ending-screen" }, [
    UI.el("div", { class: "ending-label" }, "- 엔딩 -"),
    UI.el("div", { class: "ending-title" }, ending.title),
    UI.el("div", { class: "ending-narrative" }, ending.narrative),
    UI.el("div", { class: "ending-stats" }, [
      UI.el("div", {}, `커리어: ${ending.careerTier}`),
      UI.el("div", {}, `인생: ${ending.lifeTone}`),
      UI.el("div", {}, `은퇴 후: ${ending.postCareerPath}`),
      UI.el("div", {}, `연애: ${ending.romanceOutcome} (${ending.romanceChar})`),
      UI.el("div", {}, `최종 나이: ${ending.stats.age}세 · 자금: ${ending.stats.money}00만원 · 건강: ${Math.round(ending.stats.health)}`),
      UI.el("div", {}, `통산 기록: ${ending.stats.record.games}경기 타율 ${ending.stats.record.avg} 홈런 ${ending.stats.record.hr} 승 ${ending.stats.record.wins}`),
    ]),
    timelineItems.length ? UI.el("div", { class: "group-label" }, "커리어 연표") : null,
    timelineItems.length ? UI.el("div", { class: "result-lines" }, timelineItems) : null,
    memoryItems.length ? UI.el("div", { class: "group-label" }, "기억에 남는 순간들") : null,
    memoryItems.length ? UI.el("div", { class: "result-lines" }, memoryItems) : null,
    UI.el("div", { class: "ending-actions" }, [
      UI.button("엔딩 도감 보기", () => UI.showEndingGallery(), "btn"),
      UI.button("타이틀로", () => UI.showTitle(), "btn btn-primary"),
    ]),
  ]));
};

UI.showEndingGallery = function () {
  const state = Game.state;
  const root = UI.clear();
  const unlocked = state ? state.endingHistory : [];
  const items = unlocked.length === 0
    ? [UI.el("div", { class: "empty-msg" }, "아직 발견한 엔딩이 없습니다. 커리어를 마무리하면 엔딩이 기록됩니다.")]
    : unlocked.map(e => UI.el("div", { class: "ending-gallery-card" }, [
        UI.el("div", { class: "ending-gallery-title" }, e.title),
        UI.el("div", { class: "ending-gallery-sub" }, `${e.romanceOutcome} · ${e.postCareerPath}`),
      ]));
  // 미발견 엔딩 힌트 (조합 축 이름만 살짝 공개)
  const lockedHint = UI.el("div", { class: "ending-locked-hint" },
    `아직 발견하지 못한 조합이 더 있습니다. (커리어 ${GameData.CAREER_TIERS.length}종 x 인생 ${GameData.LIFE_TONES.length}종 x 은퇴후 ${GameData.POST_CAREER_PATHS.length}종 x 연애 ${Object.keys(GameData.ROMANCE_OUTCOMES).length}종 조합)`);

  root.appendChild(UI.screen("엔딩 도감", [
    UI.el("div", { class: "group-label" }, `발견한 엔딩: ${unlocked.length}개`),
    ...items, lockedHint,
  ], { footer: [UI.button(Game.state ? "← 홈으로" : "← 타이틀로", () => Game.state ? UI.showHub() : UI.showTitle(), "btn btn-ghost")] }));
  if (Game.state) UI.appendNav(root, "endings");
};

/* ---------------- 통합 도감 / 인물 도감 ---------------- */
UI.showCollectionHub = function () {
  const root = UI.clear();
  const progress = Game.Meta.collectionProgress();
  const endingCount = Game.state?.endingHistory?.length || 0;
  root.appendChild(UI.screen("도감", [
    UI.el("div", { class: "collection-summary" }, `인물 ${progress.discovered}/${progress.total} · 엔딩 ${endingCount}개`),
    UI.button("인물 도감", () => UI.showCharacterCodex(), "btn"),
    UI.button("엔딩 도감", () => UI.showEndingGallery(), "btn"),
  ], { footer: [UI.button(Game.state ? "← 홈으로" : "← 타이틀로", () => Game.state ? UI.showHub() : UI.showTitle(), "btn btn-ghost")] }));
  if (Game.state) UI.appendNav(root, "endings");
};

UI.showCharacterCodex = function () {
  const root = UI.clear();
  const { meta, total, discovered } = Game.Meta.collectionProgress();
  const cards = GameData.CHARACTER_REGISTRY.map(c => {
    const entry = meta.characters[c.id];
    const open = !!entry?.discovered;
    return UI.el("div", { class: `rel-card character-codex-card${open ? " discovered" : " locked"}` }, [
      UI.el("div", { class: "rel-name" }, open ? c.name : "???"),
      UI.el("div", { class: "rel-desc" }, open ? `${c.role} · 해금 단계 ${entry.level || 1}` : "아직 만나지 못한 인물"),
      open ? UI.el("div", { class: "rel-desc" }, `만난 횟수 ${entry.encounters || 1} · 이벤트 ${(entry.events || []).length}개`) : null,
      !open ? UI.el("div", { class: "rel-desc" }, "다른 진로·팀·성적·선택에서 등장할 수 있습니다.") : null,
    ].filter(Boolean));
  });
  root.appendChild(UI.screen("인물 도감", [
    UI.el("div", { class: "group-label" }, `발견 ${discovered}/${total}`),
    UI.el("div", { class: "rel-list" }, cards),
  ], { footer: [UI.button("← 도감으로", () => UI.showCollectionHub(), "btn btn-ghost")] }));
  if (Game.state) UI.appendNav(root, "endings");
};

</script>

<!-- 진입점 -->
<script>
/* js/main.js */
/* ===================== main.js =====================
   앱 진입점. DOM 로드 후 타이틀 화면을 띄운다.
====================================================== */
document.addEventListener("DOMContentLoaded", () => {
  try {
    UI.showTitle();
  } catch (e) {
    console.error(e);
    document.getElementById("app").innerHTML =
      `<div style="padding:24px;color:#fff;">게임을 불러오는 중 오류가 발생했습니다: ${e.message}</div>`;
  }
});

</script>
