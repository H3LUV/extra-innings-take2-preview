<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXTRA INNINGS TAKE 2 v0.8.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10121c}#game{width:100%;height:100%;border:0;display:block}#patch-status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:7px 12px;border-radius:16px;background:rgba(16,18,28,.9);color:#fff;font:12px system-ui;opacity:1;transition:opacity .25s}</style>
</head>
<body>
<iframe id="game" src="../extra-innings-take2-v0800/?v=0810"></iframe>
<div id="patch-status">타자 능력치 정리 중</div>
<script>
(function(){
 const frame=document.getElementById('game'),status=document.getElementById('patch-status');let tries=0;
 function deepest(){try{let w=frame.contentWindow;for(let i=0;i<16;i++){const f=w?.document?.getElementById('game');if(!f?.contentWindow)break;w=f.contentWindow;}return w;}catch(e){return null;}}
 function patch(){
  const w=deepest();if(!w?.GameData||!w?.UI)return false;if(w.__EXTRA_INNINGS_V081_PATCHED__)return true;
  const GD=w.GameData;
  GD.BATTING_STATS=(GD.BATTING_STATS||[]).filter(k=>!['vsLefty','vsRighty'].includes(k));
  delete GD.STAT_LABELS.vsLefty;delete GD.STAT_LABELS.vsRighty;
  const contact=GD.TRAININGS?.find(t=>t.id==='contact_tr');
  const power=GD.TRAININGS?.find(t=>t.id==='power_tr');
  if(contact&&!contact.growth.some(g=>g[0]==='stats.batting.batSpeed')) contact.growth.push(['stats.batting.batSpeed',0.08,0.18]);
  if(power&&!power.growth.some(g=>g[0]==='stats.batting.batSpeed')) power.growth.push(['stats.batting.batSpeed',0.12,0.24]);
  const oldShowInfo=w.UI.showInfo;
  if(typeof oldShowInfo==='function') w.UI.showInfo=function(){return oldShowInfo.apply(this,arguments);};
  w.__EXTRA_INNINGS_V081_PATCHED__=true;w.document.title='EXTRA INNINGS TAKE 2 v0.8.1';return true;
 }
 function tick(){tries++;if(patch()){status.textContent='v0.8.1 적용 완료';setTimeout(()=>status.style.opacity='0',900);}else if(tries<420)setTimeout(tick,100);else status.textContent='능력치 정리 적용 실패';}
 frame.addEventListener('load',()=>setTimeout(tick,220));setTimeout(tick,450);
})();
</script>
</body>
</html>
